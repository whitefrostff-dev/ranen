.list{overflow:auto;border-right:1px solid var(--line)}.list button{display:flex;gap:12px;align-items:center;width:100%;padding:13px 14px;text-align:left;border-bottom:1px solid var(--line);color:var(--ink)}.list .on{background:var(--card)}

.avedit{position:relative;cursor:pointer}.cam{position:absolute;right:0;bottom:2px;width:28px;height:28px;border-radius:50%;background:var(--g);color:var(--on);display:grid;place-items:center;border:3px solid var(--bg)}

/* modern restyle */

const cover=(g,v,x,y,w,h,mir)=>{const vw=v.videoWidth,vh=v.videoHeight;if(!vw)return;const k=Math.max(w/vw,h/vh),dw=vw*k,dh=vh*k;g.save();g.beginPath();g.rect(x,y,w,h);g.clip();if(mir){g.translate(x+w,0);g.scale(-1,1);g.drawImage(v,(w-dw)/2,y+(h-dh)/2,dw,dh)}else g.drawImage(v,x+(w-dw)/2,y+(h-dh)/2,dw,dh);g.restore()};
async function openDuet(id){const p=posts.find(x=>x.id===id);if(!p||p.type!=='video')return toast('Duets work with videos');if(dlg.open)return;

 D={id};

 $('#dm').textContent='Ready. Use headphones to avoid echo, then tap Record.';$('#dr').disabled=false}
function duetRec(){if(!D)return;const b=$('#dr');if(D.rec&&D.rec.state==='recording'){D.rec.stop();return}
 if(!D.ac){D.ac=new(window.AudioContext||window.webkitAudioContext)();D.dest=D.ac.createMediaStreamDestination();try{const s1=D.ac.createMediaElementSource(D.ov);s1.connect(D.dest);s1.connect(D.ac.destination)}catch(e){}D.ac.createMediaStreamSource(D.st).connect(D.dest)}
 D.ac.resume();const stream=$('#dc').captureStream(30);D.dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));

let rec=null;
const mediaHTML=m=>m.kind==='image'?`<img class="mi" src="${m.src}" alt="Photo" onclick="viewImg('${m.src}')">`:m.kind==='video'?`<video class="mi" src="${m.src}" controls playsinline preload="metadata"></video>`:m.kind==='audio'?`<audio src="${m.src}" controls preload="metadata"></audio>`:'';
const viewImg=src=>show(`<img class="pv" style="max-height:78vh;object-fit:contain;background:none" src="${src}" alt="">`);
async function sendBlob(blob,name,kind){const c=curChat();if(!c)return;const r=reply;reply=null;showReply();
 const tmp={from:me,to:c,at:Date.now(),kind:kind==='voice'?'audio':blob.type.startsWith('video')?'video':'image',src:URL.createObjectURL(blob),t:'',pending:1,rid:r?r.id:'',rf:r?r.from:'',rt:r?r.t.slice(0,80):''};thread.push(tmp);renderMsgs(1);sending++;
 try{const fd=new FormData();fd.append('to',c);fd.append('kind',kind);fd.append('reply',r?r.id:'');fd.append('media',blob,name);await api('/api/messages/media',{method:'POST',body:fd})}catch(e){toast(e.message);thread=thread.filter(x=>x!==tmp);renderMsgs()}
 sending--;loadThread(1)}
async function sendFile(inp){const f=inp.files[0];inp.value='';if(!f)return;
 if(f.type.startsWith('video')){if(f.size>28e6)return toast('Video is over 28 MB.');return sendBlob(f,f.name,'')}
 if(f.type.startsWith('image')){try{const d=await shrink(await readFile(f),1600);sendBlob(await(await fetch(d)).blob(),'photo.jpg','')}catch(e){toast('Could not read that image.')}}else toast('Choose a photo or video.')}
async function micToggle(){if(rec)return;try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),mr=new MediaRecorder(st),ch=[];rec={mr,st,ch,t0:Date.now()};mr.ondataavailable=e=>e.data.size&&ch.push(e.data);mr.start();$('#sendbar').classList.add('rec');
 rec.iv=setInterval(()=>{const n=(Date.now()-rec.t0)/1e3|0,t=$('#rt');if(t)t.textContent=`● ${n/60|0}:${String(n%60).padStart(2,'0')}`;if(n>=180)stopRec(true)},500)}catch(e){rec=null;toast('Microphone access was blocked or is not available.')}}
function stopRec(send){const r=rec;if(!r)return;rec=null;clearInterval(r.iv);$('#sendbar')?.classList.remove('rec');
 r.mr.onstop=()=>{r.st.getTracks().forEach(t=>t.stop());if(send&&r.ch.length){const ty=r.mr.mimeType||'audio/webm';sendBlob(new Blob(r.ch,{type:ty}),'voice.'+(ty.includes('mp4')?'m4a':'webm'),'voice')}};r.mr.stop()}
function chat(){const c=curChat();if(!c)return `<div class="empty">No one else has joined yet.<br>Invite a friend, or use Search to find people by username.</div>`;const d=users[c];
 return `<div class="chat ${chatOpen?'open':''}"><div class="list">${chatList()}</div><div class="conv"><div class="ch"><button class="back" onclick="chatOpen=false;render()" aria-label="Back">←</button><a class="who" onclick="openProfile('${c}')">${av(c,40,1)}<span><b>${esc(c)}</b><small>${d.online?'Online now':'Offline'}</small></span></a></div>
 <div class="msgs" id="msgs">${thread.map(bub).join('')||'<div class="empty">Say hi to '+esc(c)+'.</div>'}</div><div class="rbar" id="rbar"></div>
 <div class="send" id="sendbar"><label class="ib" aria-label="Send photo or video">${ic('clip')}<input type="file" accept="image/*,video/*" hidden onchange="sendFile(this)"></label><label class="ib" aria-label="Take a photo">${ic('camera')}<input type="file" accept="image/*" capture="environment" hidden onchange="sendFile(this)"></label><input id="ci" placeholder="Message ${esc(c)}" autocomplete="off" onkeydown="if(event.key==='Enter')sendMsg()"><button class="ib" onclick="micToggle()" aria-label="Record voice note">${ic('mic')}</button><button class="btn" onclick="sendMsg()">Send</button><span class="recui"><button class="ib" onclick="stopRec(false)" aria-label="Cancel recording">✕</button><span id="rt">● 0:00</span><button class="btn" onclick="stopRec(true)">Send</button></span></div></div></div>`}
function openChat(u){chatWith=u;chatOpen=true;thread=[];reply=null;tab='chat';render();loadThread(1)}
async function loadThread(force){if(sending)return;const c=curChat();if(!c)return;try{const t=await api('/api/messages?with='+c);if(sending||c!==curChat())return;if(force||JSON.stringify(t)!==JSON.stringify(thread)){thread=t;renderMsgs(force);if(unr[c]){delete unr[c];badges();const l=$('.list');if(l)l.innerHTML=chatList()}}}catch(e){}}
async function sendMsg(){const i=$('#ci'),t=i.value.trim(),c=curChat();if(!t||!c)return;const r=reply;i.value='';i.focus();reply=null;showReply();
 thread.push({from:me,to:c,t,at:Date.now(),rid:r?r.id:'',rf:r?r.from:'',rt:r?r.t.slice(0,80):''});renderMsgs(1);sending++;
 try{await jpost('/api/messages',{to:c,text:t,reply:r?r.id:''})}catch(e){toast(e.message);thread.pop();renderMsgs()}sending--;loadThread(1)}
const personRow=u=>`<div class="card prow"><a class="who" onclick="openProfile('${u}')">${av(u,48,1)}<span><b>${esc(u)}</b><small>${esc(users[u].bio)||users[u].followers+' followers'}</small></span></a><span class="sp"></span><button class="btn sm ${users[u].isFollowing?'ghost':''}" onclick="follow('${u}')">${users[u].isFollowing?'Following':'Follow'}</button><button class="btn sm ghost" onclick="openChat('${u}')" aria-label="Message">${ic('chat',18)}</button></div>`;
async function runSearch(){const t=q.trim();try{sres=t?await api('/api/search?q='+encodeURIComponent(t)):null}catch(e){sres=[]}const b=$('#sres');if(tab==='search'&&b)b.innerHTML=searchBody()}
const pRow=p=>`<div class="card prow"><a class="who" onclick="openProfile('${p.name}')">${av(p.name,48,1)}<span><b>${esc(p.fullName||p.name)}${p.badge?' <span class="vb">✔</span>':''}</b><small>@${esc(p.name)}${p.reason?' · '+esc(p.reason):p.bio?' · '+esc(p.bio.slice(0,40)):''}</small></span></a><span class="sp"></span><button class="btn sm ${p.isFollowing?'ghost':''}" onclick="follow('${p.name}')">${p.isFollowing?'Following':'Follow'}</button><button class="btn sm ghost" onclick="openChat('${p.name}')" aria-label="Message">${ic('chat',18)}</button></div>`;
const searchBody=()=>{const t=q.trim();if(!t)return `<h3 style="margin:6px 0">People you may know</h3>${sugs.map(pRow).join('')||'<div class="empty">Type a name or @username to find people.</div>'}`;if(sres===null)return '<div class="empty">Searching…</div>';return sres.length?sres.map(pRow).join(''):`<div class="empty">Nobody found for "${esc(t)}".<br>Try another spelling or the exact @username.</div>`};
const search=()=>{if(q.trim()&&sres===null)runSearch();return `<div class="wrap"><h2>Search</h2><div id="sres">${searchBody()}</div></div>`};
function friends(){const o=Object.keys(users).filter(u=>u!==me),l=ftab==='following'?o.filter(u=>users[u].isFollowing):ftab==='followers'?o.filter(u=>users[u].followsMe):o.filter(u=>!users[u].isFollowing);
 return `<div class="wrap"><h2>Friends</h2><div class="chips" style="margin-top:0">${[['following','Following'],['followers','Followers'],['find','Find people']].map(([k,t])=>`<button class="${ftab===k?'on':''}" onclick="ftab='${k}';render()">${t}</button>`).join('')}</div>${l.length?l.map(personRow).join(''):`<div class="empty">${ftab==='find'?'Everyone is followed. Invite more friends!':'Nobody here yet.'}</div>`}</div>`}
const listPosts=(t,l,e)=>`<div class="wrap"><h2>${t}</h2>${l.length?l.map(postHTML).join(''):`<div class="empty">${e}</div>`}</div>`;
const saved=()=>listPosts('Saved',posts.filter(p=>savedIds().includes(p.id)),'Tap the bookmark on any post to save it here.');
function memories(){const d=new Date();return listPosts('Memories',posts.filter(p=>{const x=new Date(p.t);return p.user===me&&x.getDate()===d.getDate()&&x.getMonth()===d.getMonth()&&x.getFullYear()<d.getFullYear()}),'Your posts from this day in past years will show up here.')}
function notifsView(){setTimeout(async()=>{if(unread()){try{await api('/api/notifications/read',{method:'POST'});notifs.forEach(n=>n.read=true);updBell()}catch(e){}}},1200);
 return `<div class="wrap"><h2>Notifications</h2>${notifs.map(n=>`<button class="card nt ${n.read?'':'un'}" onclick="${n.post?`openComments('${n.post}')`:`openProfile('${n.from}')`}">${av(n.from,44)}<span class="sp"><b>${esc(n.from)}</b> ${nText(n)}</span><small class="mu">${ago(n.at)}</small></button>`).join('')||'<div class="empty">No notifications yet. Likes, comments and new followers show up here.</div>'}</div>`}
function menu(){return `<div class="wrap"><h2>Menu</h2><button class="card prow" onclick="openProfile('${me}')">${av(me,48)}<span class="who"><span><b>${esc(me)}</b><small>See your profile</small></span></span></button>
 <button class="card prow" onclick="openInvite()"><span style="color:inherit">${ic('heart',28)}</span><b>Invite friends</b></button>
 <div class="tiles">${MENU.filter(m=>!['home','invite'].includes(m[0])).map(m=>`<button class="card tile" onclick="nav('${m[0]}')"><span style="color:${m[3]}">${ic(m[2],30)}</span>${m[1]}${m[4]?'<small>Coming soon</small>':''}</button>`).join('')}</div>
 <button class="card prow" onclick="go('settings')">${ic('gear',26)}<b>Settings & privacy</b></button><button class="card prow" onclick="go('help')">${ic('help',26)}<b>Help & support</b></button><button class="card prow" onclick="go('contact')">${ic('phone',26)}<b>Contact us</b></button>${isAdmin?`<button class="card prow" onclick="go('admin')">${ic('shield',26)}<b>Admin panel</b></button>`:''}
 <div style="margin-top:14px"><button class="btn ghost" onclick="logout()">Log out</button></div><p class="mu" style="margin-top:18px;text-align:center">Amlink v1.0 · Built by <a onclick="go('about')">${DEV}</a></p></div>`}
const help=()=>`<div class="wrap"><h2>Help & support</h2>${[['How do I add friends?','Use the search bar and type their exact @username, then tap Follow. You can also pick from Suggested for you.'],['How do I hide that I am online?','Settings & privacy, then turn off "Show when I\'m online".'],['How do I change my profile photo?','Open your Profile and tap your photo, or use Settings & privacy.'],['How do notifications work?','You get an alert when someone likes or comments on your post or follows you. Turn on browser notifications in Settings.'],['How do I report something?','Tap the flag on a post. Our team reviews reports.'],['How do I delete my account?','Settings & privacy, then Delete my account at the bottom.']].map(([a,b])=>`<details class="card sec" style="margin-top:10px"><summary>${a}</summary><p>${b}</p></details>`).join('')}<p class="mu" style="margin-top:14px">Still stuck? Email whitefrostff@gmail.com</p></div>`;
function profile(){const u=view||me,d=users[u];if(!d)return '<div class="empty">User not found.</div>';const ps=posts.filter(p=>p.user===u),mine=u===me;
 return `<div class="wrap"><div class="ph">${mine?`<label class="avedit" title="Change photo">${av(u,96,1)}<input type="file" accept="image/*" hidden onchange="newPic(this)"><span class="cam">${ic('plus',14)}</span></label>`:av(u,96,1)}<div><h2>${esc(d.fullName||u)}${d.badge?' <span class="vb">✔</span>':''}</h2><small class="mu">@${esc(u)}</small><div class="nums"><span><b>${ps.length}</b>posts</span><span><b>${d.followers}</b>followers</span><span><b>${d.followingCount}</b>following</span></div><small class="mu">${d.online?'● Online now':'Offline'}</small></div></div>
 <p class="bio">${esc(d.bio)||(mine?'No bio yet. Add one in Settings.':'')}</p>
 <div class="row">${mine?`<button class="btn ghost" onclick="go('settings')">Settings & privacy</button>`:`<button class="btn ${d.isFollowing?'ghost':''}" onclick="follow('${u}')">${d.isFollowing?'Following':'Follow'}</button><button class="btn ghost" onclick="openChat('${u}')">Message</button><button class="btn ghost" onclick="openReport('user','${u}')">Report</button><button class="btn ghost" onclick="blockUser('${u}')">Block</button>`}</div>
 <div class="grid">${ps.map(p=>`<div class="t">${p.type==='image'?`<img src="${p.src}" alt="">`:p.type==='video'?`<video src="${p.src}" muted preload="metadata"></video>`:`<div>${esc(p.text)}</div>`}</div>`).join('')}</div></div>`}
const tgl=(k,l,d=1)=>`<label class="tg"><span>${l}</span><input type="checkbox" ${pref(k,d?'1':'0')==='1'?'checked':''} onchange="setPref('${k}',this.checked?'1':'0')"></label>`;

 return `<div class="wrap"><h2>Settings & privacy</h2>
 <div class="card sec"><h3>Account</h3><div class="who">${av(me,48)}<span><b>@${esc(me)}</b><small>${esc(myEmail)} · username can't be changed</small></span></div><div class="row"><label class="btn ghost">Change photo<input type="file" accept="image/*" hidden onchange="newPic(this)"></label><button class="btn ghost" onclick="editName()">Edit name</button><button class="btn ghost" onclick="editBio()">Edit bio</button><button class="btn ghost" onclick="openPw()">${noPass?'Set a password':'Change password'}</button><button class="btn ghost" onclick="openInfo()">Date of birth & gender</button></div></div>
 <div class="card sec"><h3>Appearance</h3><div class="seg">${[['dark','🌙 Black and white'],['light','☀️ White and light blue'],['auto','Auto']].map(([k,l])=>`<button class="${t===k?'on':''}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div></div>
 <div class="card sec"><h3>Notifications</h3><label class="tg"><span>Browser notifications (when this tab is in the background)</span><input type="checkbox" ${pref('bn','0')==='1'&&window.Notification&&Notification.permission==='granted'?'checked':''} onchange="setBN(this)"></label>${tgl('n_social','Likes, comments and new followers')}${tgl('n_msg','New messages')}${tgl('n_online','When people you follow come online')}${tgl('snd','Notification sound')}</div>

 <div class="card sec"><h3>Security and data</h3><div class="row"><button class="btn ghost" onclick="logoutAll()">Log out of all devices</button><button class="btn ghost" onclick="downloadData()">Download my data</button></div><p class="mu">Signed in as ${esc(myEmail)}.</p></div>

const REASONS=['Spam or scam','Nudity or sexual content','Harassment or bullying','Hate speech','Violence or threats','Something else'];
function openReport(type,target){show(`<h3>Report ${type==='post'?'this post':'@'+esc(target)}</h3><p class="mu">Why are you reporting this?</p>${REASONS.map(r=>`<button class="rsn" onclick="sendReport('${type}','${esc(target)}','${r}')">${r}</button>`).join('')}`,'sheet')}

 if(atab==='overview'){const x=await api('/api/admin/stats');b.innerHTML=`<div class="tiles">${[['Users',x.users],['Online now',x.online],['New this week',x.new7],['Posts',x.posts],['Messages',x.messages],['Open reports',x.reports],['Unverified signups',x.pending],['Suspended',x.banned]].map(([l,v])=>`<div class="card tile"><b style="font-size:28px">${v}</b>${l}</div>`).join('')}</div><div class="card sec"><h3>Announcement to everyone</h3><textarea class="ainp" id="an" maxlength="300" placeholder="Shown at the top for every user. Leave empty to remove it.">${esc(x.announce)}</textarea><button class="btn" onclick="aAct('/api/admin/announce','POST',{text:$('#an').value}).then(()=>toast('Announcement updated'))">Publish</button></div><div class="card sec" style="margin-top:12px"><h3>Registrations</h3><p class="mu">${x.signupsClosed?'New sign-ups are paused.':'New sign-ups are open.'}</p><div class="row"><button class="btn" onclick="aAct('/api/admin/settings','POST',{signupsClosed:${!x.signupsClosed}})">${x.signupsClosed?'Open sign-ups':'Pause sign-ups'}</button><a class="btn ghost" href="/api/admin/export.csv">Download users (CSV)</a></div></div><div class="card sec" style="margin-top:12px"><h3>Online now (${x.online})</h3><p class="mu">${(x.onlineUsers||[]).map(n=>'@'+esc(n)).join(', ')||'No one'}</p></div>`}
 else if(atab==='reports'){const r=await api('/api/admin/reports');b.innerHTML=r.map(x=>`<div class="card sec" style="margin-top:10px"><b>${esc(x.type)} report</b> <small class="mu">by @${esc(x.by)} · ${ago(x.at)} · ${esc(x.status)}</small><p>${esc(x.reason)}</p><p class="mu">${x.type==='post'?`@${esc(x.author)}: ${esc(x.preview)}`:`User @${esc(x.target)}`}</p>${x.status==='open'?`<div class="row"><button class="btn sm ghost" onclick="aAct('/api/admin/reports/${x.id}/resolve','POST',{action:'dismiss'})">Dismiss</button>${x.type==='post'?`<button class="btn sm danger" onclick="aAct('/api/admin/reports/${x.id}/resolve','POST',{action:'delete_post'})">Delete post</button>`:''}<button class="btn sm danger" onclick="aAct('/api/admin/reports/${x.id}/resolve','POST',{action:'ban'})">Suspend user</button></div>`:''}</div>`).join('')||'<div class="empty">No reports.</div>'}
 else if(atab==='posts'){const p=await api('/api/admin/posts?q='+encodeURIComponent($('#aq')?.value||''));b.innerHTML=p.map(x=>`<div class="card sec" style="margin-top:10px"><div class="row"><b>@${esc(x.user)}</b><small class="mu">${ago(x.t)} · ♥ ${x.likes}</small><span class="sp"></span><button class="btn sm danger" onclick="if(confirm('Delete this post?'))aAct('/api/admin/posts/${x.id}','DELETE')">Delete</button></div>${x.text?`<p>${esc(x.text)}</p>`:''}${x.type==='image'?`<img class="m" style="max-height:200px;border-radius:12px" src="${x.src}" alt="">`:x.type==='video'?`<video class="m" style="max-height:200px;border-radius:12px" src="${x.src}" controls preload="metadata"></video>`:''}${x.comments.map(c=>`<div class="row" style="font-size:14px"><span><b>${esc(c.u)}</b> ${esc(c.t)}</span><span class="sp"></span><a onclick="aAct('/api/admin/posts/${x.id}/comments/${c.i}','DELETE')">remove</a></div>`).join('')}</div>`).join('')||'<div class="empty">No posts.</div>'}
 else if(atab==='audit'){const a=await api('/api/admin/audit');b.innerHTML=a.map(x=>`<div class="card sec" style="margin-top:8px"><b>${esc(x.action)}</b> <small class="mu">${ago(x.at)} · ${esc(x.by)}</small>${x.detail?`<p class="mu" style="word-break:break-all">${esc(x.detail)}</p>`:''}</div>`).join('')||'<div class="empty">No admin actions yet.</div>'}
 else{const u=await api('/api/admin/users?q='+encodeURIComponent($('#aq')?.value||''));b.innerHTML=u.map(x=>`<div class="card sec" style="margin-top:10px"><div class="who">${av(x.name,44)}<span><b>@${esc(x.name)}${x.badge?' <span class="vb">✔</span>':''}${x.admin?' (admin)':''}</b><small>${esc(x.fullName||'')} ${esc(x.email)}<br>${x.created?'Joined '+new Date(x.created*1000).toLocaleDateString():'Joined: before tracking'} · ${x.posts} posts${x.pending?' · unverified':''}${x.banned?' · SUSPENDED':''}</small></span></div>${x.admin?'':`<div class="row" style="margin-top:10px"><button class="btn sm ghost" onclick="aAct('/api/admin/users/${x.name}/badge','POST',{badge:${!x.badge}})">${x.badge?'Remove badge':'Give badge ✔'}</button><button class="btn sm ghost" onclick="aAct('/api/admin/users/${x.name}/clear','POST',{field:'pic'})">Remove photo</button><button class="btn sm ghost" onclick="aAct('/api/admin/users/${x.name}/clear','POST',{field:'bio'})">Clear bio</button><button class="btn sm ghost" onclick="aAct('/api/admin/users/${x.name}/ban','POST',{banned:${!x.banned}})">${x.banned?'Restore':'Suspend'}</button><button class="btn sm danger" onclick="if(confirm('Delete @${x.name} and all their posts?'))aAct('/api/admin/users/${x.name}','DELETE')">Delete</button></div>`}</div>`).join('')||'<div class="empty">No users found.</div>'}
 }catch(e){b.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function openPw(){show(`<h3>${noPass?'Set a password':'Change password'}</h3><p class="mu">${noPass?'You signed up with Google. A password lets you also log in with your username.':'Choose a new password.'}</p>${noPass?'':'<input id="p0" type="password" placeholder="Current password" class="ainp">'}<input id="p1" type="password" placeholder="New password (6+ characters)" class="ainp"><input id="p2" type="password" placeholder="Repeat new password" class="ainp"><div class="err" id="pe"></div><button class="btn" onclick="savePw()">Save password</button>`)}
async function savePw(){const a=$('#p1').value;if(a!==$('#p2').value){$('#pe').textContent='The two passwords do not match.';return}try{await jpost('/api/password',{old:$('#p0')?$('#p0').value:'',new:a});noPass=false;dlg.close();toast('Password saved');render()}catch(e){$('#pe').textContent=e.message}}
async function logoutAll(){if(!confirm('Log out of Amlink on all your devices?'))return;try{await api('/api/logout-all',{method:'POST'});location.reload()}catch(e){toast(e.message)}}
async function downloadData(){try{const d=await api('/api/me/export'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='amlink-my-data.json';a.click();toast('Your data was downloaded')}catch(e){toast(e.message)}}
async function setBN(el){if(!window.Notification){el.checked=false;return toast('This browser does not support notifications')}if(el.checked){const r=await Notification.requestPermission();if(r!=='granted'){el.checked=false;setPref('bn','0');return toast('Notifications were blocked in your browser')}setPref('bn','1')}else setPref('bn','0')}
async function setHide(v){await jpost('/api/settings',{hide:v});loadUsers()}
async function newPic(i){const f=i.files[0];if(!f)return;try{const fd=new FormData();fd.append('pic',await(await fetch(await shrink(await readFile(f),400))).blob(),'pic.jpg');await api('/api/me',{method:'POST',body:fd});load();toast('Photo updated')}catch(e){toast('Could not use that image.')}}
async function editBio(){const b=prompt('Your bio (150 characters)',users[me].bio||'');if(b===null)return;const fd=new FormData();fd.append('bio',b);await api('/api/me',{method:'POST',body:fd});load()}
function render(){document.body.classList.toggle('inchat',tab==='chat'&&chatOpen);document.body.classList.toggle('inreels',tab==='reels');if(tab!=='chat'&&rec)stopRec(false);document.querySelectorAll('#nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab&&!(tab==='me'&&view)));
 $('#main').innerHTML=({home,reels,chat,me:profile,search,friends,saved,memories,notifs:notifsView,menu,help,settings,about,contact:contactView,admin:adminView})[tab]();$('#side').innerHTML=sideHTML();if(tab==='reels')autoplay();if(tab==='chat'){renderMsgs(1);bindMsgs();showReply()}}
function openInvite(){const l=location.origin;show(`<h3>Invite friends</h3><p>Share your link. When they sign up, search for your @username to connect.</p><p><b>${esc(l)}</b></p><div class="row"><button class="btn" onclick="navigator.clipboard.writeText('${esc(l)}').then(()=>toast('Link copied'))">Copy link</button>${navigator.share?`<button class="btn ghost" onclick="navigator.share({title:'Amlink',text:'Join me on Amlink!',url:'${esc(l)}'})">Share</button>`:''}</div>`)}
function openCreate(){cfile=null;show(`<h3>Create post</h3><textarea id="ct" placeholder="What's on your mind?" maxlength="1000"></textarea><div id="cp"></div><div class="row"><label class="btn ghost">${ic('plus',18)} Photo or video<input type="file" accept="image/*,video/*" hidden onchange="cpick(this)"></label><span class="sp"></span><button class="btn" id="cb" onclick="cpublish()">Post</button></div><div class="err" id="ce"></div>`)}
async function cpick(i){const f=i.files[0],e=$('#ce');if(!f)return;e.textContent='';
 if(f.type.startsWith('video')){if(f.size>55e6){e.textContent='Video is over 55 MB.';return}cfile=f;$('#cp').innerHTML=`<video src="${URL.createObjectURL(f)}" controls playsinline></video>`}
 else if(f.type.startsWith('image')){try{const d=await shrink(await readFile(f),1600);cfile=await(await fetch(d)).blob();$('#cp').innerHTML=`<img class="pv" src="${d}" alt="Preview">`}catch(x){e.textContent='Could not read that image. Try a JPG or PNG.'}}
 else e.textContent='Choose a photo or video.'}
async function cpublish(){const t=$('#ct').value.trim(),b=$('#cb'),e=$('#ce');if(!t&&!cfile){e.textContent='Write something or add a photo or video.';return}
 b.disabled=true;b.textContent='Posting…';const fd=new FormData();fd.append('text',t);if(cfile)fd.append('media',cfile,cfile.name||'photo.jpg');
 try{await api('/api/posts',{method:'POST',body:fd});dlg.close();if(tab!=='reels')tab='home';await load();toast('Posted')}catch(x){e.textContent=x.message;b.disabled=false;b.textContent='Post'}}
function openComments(id){const p=posts.find(x=>x.id===id);if(!p)return toast('That post was deleted');show(`<div id="cmx"><h3>Comments</h3>${p.comments.map(c=>`<p><b>${esc(c.u)}</b> ${esc(c.t)}</p>`).join('')||'<p class="mu">No comments yet.</p>'}<div class="send" style="padding:10px 0 0"><input id="cmi" placeholder="Add a comment" onkeydown="if(event.key==='Enter')addComment('${id}')"><button class="btn sm" onclick="addComment('${id}')">Send</button></div></div>`)}
async function addComment(id){const i=$('#cmi'),t=i.value.trim();if(!t)return;try{await jpost(`/api/posts/${id}/comment`,{text:t});posts=await api('/api/posts');render();openComments(id)}catch(e){toast(e.message)}}
theme();authRender();api('/api/config').then(c=>{cfg=c;if(!document.body.classList.contains('in')&&(A.v==='login'||A.v==='signup'))authRender()}).catch(()=>{});api('/api/me').then(enter).catch(()=>{});
</script>
</body>
</html>
