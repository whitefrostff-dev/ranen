<!DOCTYPE html>
<html lang="en" data-theme="color" data-tab="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amlink</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2FF;--card:#fff;--ink:#16122E;--mute:#756F96;--line:#E6E2F6;--acc:#6D4AFF;--acc2:#FF4F7B;--on:#fff;--r:20px;--g:linear-gradient(135deg,var(--acc),var(--acc2));--top:60px;--bot:0px}
html[data-theme=mono]{--bg:#fff;--card:#fff;--ink:#000;--mute:#555;--line:#d4d4d4;--acc:#000;--acc2:#000;--r:4px}
html[data-theme=night]{--bg:#000;--card:#0F0F0F;--ink:#fff;--mute:#9a9a9a;--line:#262626;--acc:#fff;--acc2:#bbb;--on:#000;--r:14px}
html[data-theme=color][data-tab=reels]:not([data-custom]){--acc:#FF2D6F;--acc2:#FF9A3D}
html[data-theme=color][data-tab=chat]:not([data-custom]){--acc:#12B76A;--acc2:#0EA5E9}
html[data-theme=color][data-tab=me]:not([data-custom]){--acc:#FF7A18;--acc2:#E11D74}
html[data-theme=color][data-tab=search]:not([data-custom]){--acc:#0EA5E9;--acc2:#6366F1}
*{box-sizing:border-box;margin:0}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
a{color:var(--acc);cursor:pointer;font-weight:600}
svg{display:block}.sp{flex:1}.mu{color:var(--mute);font-size:14px}
.btn{background:var(--g);color:var(--on);padding:11px 20px;border-radius:99px;font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.sm{padding:7px 14px;font-size:14px}.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#E5384F;color:#fff}.btn:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
html[data-theme=mono] .card{border-color:#000}
.avw{position:relative;width:var(--s);height:var(--s);flex:none;display:inline-block}
.av{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--g);color:var(--on);font-weight:800}
.av img{width:100%;height:100%;object-fit:cover}
.dot{position:absolute;right:0;bottom:0;width:28%;height:28%;min-width:10px;min-height:10px;border-radius:50%;background:#22c55e;border:2px solid var(--card)}
.who{display:flex;gap:10px;align-items:center;color:var(--ink)}.who span{display:flex;flex-direction:column}.who small{color:var(--mute);font-weight:400}
.empty{padding:50px 20px;text-align:center;color:var(--mute)}
.err{color:#E5384F;font-size:14px;min-height:18px}
/* auth */
#auth{min-height:100dvh;display:grid;grid-template-columns:1fr 1fr}body.in #auth{display:none}
.hero{background:linear-gradient(160deg,#6D4AFF,#2A1A9E 55%,#FF4F7B);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:flex-end}
.hero h1{font-size:clamp(56px,10vw,130px);line-height:.88;font-weight:800;letter-spacing:-.05em}.hero p{margin-top:16px;max-width:340px;font-size:18px;opacity:.92}
.form{padding:40px;display:flex;flex-direction:column;justify-content:center;gap:12px;max-width:460px;margin:auto;width:100%}
.form input[type=text],.form input[type=email],.form input[type=password]{padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);width:100%}
.pick{display:flex;gap:14px;align-items:center}.pick .av{width:64px;height:64px;font-size:26px}
.chk{display:flex;gap:10px;font-size:14px;color:var(--mute);align-items:flex-start}
/* app shell */
#app{display:none;grid-template-columns:240px minmax(0,1fr) 320px;max-width:1280px;margin:auto}body.in #app{display:grid}
.top{grid-column:1/-1;position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-size:30px;font-weight:800;letter-spacing:-.05em;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;width:208px}
html[data-theme=mono] .logo{color:#000;background:none}html[data-theme=night] .logo{color:#fff;background:none}
.sbox{flex:1;max-width:420px;margin:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:0 14px;color:var(--mute)}
.sbox input{border:0;background:none;padding:10px 0;width:100%;outline:0;color:var(--ink)}
.gear{display:none}
nav{position:sticky;top:var(--top);height:calc(100dvh - var(--top));padding:14px 10px;display:flex;flex-direction:column;gap:4px}
nav button{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;font-weight:600;font-size:17px;color:var(--ink)}
nav button.on{background:var(--card);color:var(--acc);box-shadow:inset 0 0 0 1px var(--line)}
nav button.mk{background:var(--g);color:var(--on);margin:6px 0}
main{min-width:0}.wrap{padding:18px;max-width:640px;margin:auto}
#side{padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:var(--top);align-self:start}
.sec{padding:16px}.sec h3{margin-bottom:10px;font-size:16px}.sec>*+*{margin-top:10px}
.prow{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-top:10px}.prow.s{padding:6px 0;margin:0}
/* home */
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;width:70px;flex:none;position:relative;font-size:12px;color:var(--ink)}
.st small{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{padding:3px;border-radius:50%;background:var(--g);display:block}.ring .avw{border:3px solid var(--bg);border-radius:50%}
.plus{position:absolute;top:44px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--g);color:var(--on);display:grid;place-items:center;border:2px solid var(--bg)}
.compose{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;color:var(--mute)}
.chips{display:flex;gap:8px;margin:14px 0 4px}.chips button{padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600}.chips .on{background:var(--g);color:var(--on);border-color:transparent}
.post{margin-top:16px;overflow:hidden}.post header{display:flex;align-items:center;gap:10px;padding:12px 14px}.post header .who{flex:1}.post p{padding:0 14px 12px;line-height:1.45}
.m{width:100%;max-height:640px;object-fit:cover;display:block;background:#000}
.acts{display:flex;gap:16px;padding:12px 14px;align-items:center}.acts button{display:flex;gap:6px;align-items:center;font-weight:600;color:var(--mute)}
.liked{color:#FF3B5C!important}.liked svg{fill:#FF3B5C}
.mobonly{display:none}
/* reels */
#reels{height:calc(100dvh - var(--top) - var(--bot));overflow-y:scroll;scroll-snap-type:y mandatory;background:#000;max-width:460px;margin:auto;scrollbar-width:none}
.reel{height:100%;scroll-snap-align:start;position:relative;color:#fff}.reel video{width:100%;height:100%;object-fit:cover}
.reel .info{position:absolute;left:16px;right:84px;bottom:22px;text-shadow:0 1px 8px #000;background:linear-gradient(transparent,#0008);padding:30px 0 0}.reel .info a{color:#fff}
.rail{position:absolute;right:10px;bottom:30px;display:flex;flex-direction:column;gap:20px;align-items:center}
.rail button{color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;filter:drop-shadow(0 1px 4px #000)}
/* chat */
.chat{display:grid;grid-template-columns:280px 1fr;height:calc(100dvh - var(--top) - var(--bot));border-left:1px solid var(--line);border-right:1px solid var(--line)}
.list{overflow:auto;border-right:1px solid var(--line)}
.list button{display:flex;gap:12px;align-items:center;width:100%;padding:13px 14px;text-align:left;border-bottom:1px solid var(--line);color:var(--ink)}.list .on{background:var(--card)}
.conv{display:flex;flex-direction:column;min-height:0}.ch{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}.ch small{display:block;color:var(--mute)}
.back{display:none}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.b{max-width:76%;padding:9px 13px;border-radius:18px 18px 18px 4px;background:var(--card);border:1px solid var(--line);align-self:flex-start}.b.me{align-self:flex-end;background:var(--g);color:var(--on);border:0;border-radius:18px 18px 4px 18px}.b small{display:block;font-size:10px;opacity:.7;text-align:right}
.send{display:flex;gap:8px;padding:10px 14px}.send input{flex:1;padding:12px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
/* profile, settings */
.ph{display:flex;gap:22px;align-items:center}.nums{display:flex;gap:18px;margin:8px 0}.nums span{display:flex;flex-direction:column;color:var(--mute);font-size:13px}.nums b{color:var(--ink);font-size:18px}
.bio{margin:12px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:18px}.grid .t{aspect-ratio:1;background:var(--line);overflow:hidden;font-size:13px;padding:0}.grid img,.grid video{width:100%;height:100%;object-fit:cover}.grid .t div{padding:8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button,.sw button{padding:10px 14px;border-radius:12px;border:1px solid var(--line);font-weight:600;background:var(--bg)}.seg .on,.sw .on{outline:3px solid var(--acc)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:44px;height:44px;padding:0;border-radius:50%}.sw button:first-child{width:auto;padding:0 14px;border-radius:99px}
.tg{display:flex;justify-content:space-between;align-items:center}.tg input{width:22px;height:22px;accent-color:var(--acc)}
.sec a{display:block}
dialog{border:0;border-radius:var(--r);max-width:560px;width:92%;padding:22px;background:var(--card);color:var(--ink);max-height:86vh;overflow:auto;margin:auto}dialog::backdrop{background:#000a}
dialog h3{margin-bottom:10px}dialog li,dialog p{margin:8px 0;line-height:1.5;font-size:15px}dialog ul{padding-left:20px}
dialog textarea{width:100%;min-height:90px;border:0;background:none;resize:none;outline:0;font-size:17px}
dialog video,dialog img.pv{width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin:8px 0}
.x{position:absolute;top:10px;right:14px;font-size:18px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(var(--bot) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:99;display:none}
@media(max-width:1100px){#app{grid-template-columns:76px minmax(0,1fr)}#side{display:none}.mobonly{display:block}nav button span{display:none}nav button{justify-content:center}.logo{width:auto}}
@media(max-width:760px){
#auth{grid-template-columns:1fr}.hero{padding:30px 24px;min-height:32vh}
:root{--top:58px;--bot:calc(64px + env(safe-area-inset-bottom,0px))}
#app{grid-template-columns:minmax(0,1fr)}.top{padding-top:calc(8px + env(safe-area-inset-top,0px))}.sbox{margin:0}.gear{display:block}.dsk{display:none}
nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
nav button{padding:10px 14px}nav button.on{box-shadow:none;background:none}nav button.mk{margin:0;border-radius:14px;padding:10px 18px}
main{padding-bottom:var(--bot)}.wrap{padding:12px}#reels{max-width:none;border-radius:0}
.chat{grid-template-columns:1fr;border:0}.conv{display:none}.chat.open .list{display:none}.chat.open .conv{display:flex}.back{display:block}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<section id="auth">
 <div class="hero"><h1>Am<br>link</h1><p>Post it. Watch it. Talk about it. Find your people.</p></div>
 <div class="form">
  <h2 id="aT">Create your account</h2>
  <div class="pick" id="pr"><div class="av" id="sp">+</div><label class="btn ghost">Add profile photo<input type="file" id="sf" accept="image/*" hidden></label></div>
  <input type="text" id="fU" placeholder="Username (letters, numbers, . _)" autocomplete="username">
  <input type="email" id="fM" placeholder="Email">
  <input type="password" id="fP" placeholder="Password (6+ characters)" autocomplete="current-password">
  <label class="chk" id="tr"><input type="checkbox" id="fT"><span>I am 13 or older and agree to the <a data-doc="terms">Terms and Conditions</a> and <a data-doc="privacy">Privacy Policy</a>.</span></label>
  <div class="err" id="err"></div>
  <button class="btn" id="gob">Create account</button>
  <button id="sw" style="color:var(--mute)">Already on Amlink? <a>Log in</a></button>
 </div>
</section>
<div id="app">
 <header class="top"><div class="logo">Amlink</div>
  <label class="sbox" id="sbx"></label><button class="gear" id="gb" aria-label="Settings" onclick="go('settings')"></button></header>
 <nav id="nav"></nav><main id="main"></main><aside id="side"></aside>
</div>
<dialog id="dlg"><div id="dB"></div><button class="x" onclick="dlg.close()" aria-label="Close">✕</button></dialog>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),L=localStorage;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',reels:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M10 8.5v7l6-3.5z"/>',plus:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',chat:'<path d="M21 12a8 8 0 0 1-8 8H4l1.5-3.6A8 8 0 1 1 21 12z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',heart:'<path d="M12 21s-8-5.5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 10c0 5.5-8 11-8 11z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',flag:'<path d="M5 21V4h12l-2 4 2 4H5"/>'};
const ic=(n,s=24)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const pref=(k,d)=>{try{return L.getItem('amlink:'+k)||d}catch(e){return d}},setPref=(k,v)=>{try{L.setItem('amlink:'+k,v)}catch(e){}};
const ACC=['#6D4AFF,#FF4F7B','#0EA5E9,#6366F1','#12B76A,#0EA5E9','#FF7A18,#E11D74','#F43F5E,#F59E0B'];
let me=null,users={},posts=[],tab='home',view=null,mode='signup',feed='all',q='',chatWith=null,chatOpen=false,thread=[],signPic='',cfile=null;
function theme(){const h=document.documentElement,a=pref('accent','auto');h.dataset.theme=pref('theme','color');
 if(a==='auto'){h.style.removeProperty('--acc');h.style.removeProperty('--acc2');h.removeAttribute('data-custom')}else{const[x,y]=a.split(',');h.style.setProperty('--acc',x);h.style.setProperty('--acc2',y);h.setAttribute('data-custom','1')}}
const setTheme=k=>{setPref('theme',k);theme();render()},setAcc=k=>{setPref('accent',k);theme();render()};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',2400)};
const show=h=>{$('#dB').innerHTML=h;dlg.showModal()};
const ago=t=>{const s=(Date.now()-t)/1e3|0;return s<60?'now':s<3600?(s/60|0)+'m':s<86400?(s/3600|0)+'h':(s/86400|0)+'d'};
const av=(u,sz=42,dot)=>{const d=users[u]||{};return `<span class="avw" style="--s:${sz}px"><span class="av">${d.pic?`<img src="${d.pic}" alt="">`:esc((u||'?')[0].toUpperCase())}</span>${dot&&d.online?'<i class="dot"></i>':''}</span>`};
async function api(p,o){const r=await fetch(p,{credentials:'same-origin',...o});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong.');return j}
const jpost=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const readFile=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
const shrink=(url,w)=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,w/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85))};i.onerror=no;i.src=url});
const docs={terms:`<h3>Terms and Conditions</h3><ul><li>You must be at least 13 years old.</li><li>You own what you post and let Amlink display it to other users.</li><li>You are responsible for your account and password.</li><li>No illegal, hateful, violent, sexual or misleading content, and no harassment.</li><li>We may remove content or suspend accounts that break these terms.</li><li>Amlink is provided as is and these terms may be updated.</li></ul><p><i>Starter text. Have a lawyer review it before launch.</i></p>`,privacy:`<h3>Privacy Policy</h3><ul><li>We collect your username, email, photo, posts, comments and messages.</li><li>We use them to run your account and keep Amlink safe.</li><li>We do not sell your personal data.</li><li>You can edit or delete your account and content in Settings.</li><li>Contact: support@amlink.app</li></ul><p><i>Starter text. Update it to match your real setup.</i></p>`,rules:`<h3>Community Guidelines</h3><ul><li>Be kind. No bullying, threats or hate.</li><li>Only post what you have the right to share.</li><li>No nudity, graphic violence or spam.</li><li>Do not share other people's private details.</li><li>Report anything that breaks these rules.</li></ul>`};
document.addEventListener('click',e=>{const d=e.target.closest('[data-doc]');if(d){e.preventDefault();show(docs[d.dataset.doc])}});
/* auth */
$('#sf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{signPic=await shrink(await readFile(f),400);$('#sp').innerHTML=`<img src="${signPic}" alt="Your photo">`}catch(x){$('#err').textContent='Could not read that image.'}};
$('#sw').onclick=()=>{mode=mode==='signup'?'login':'signup';const s=mode==='signup';$('#aT').textContent=s?'Create your account':'Welcome back';$("#gob").textContent=s?'Create account':'Log in';['pr','tr','fM'].forEach(i=>$('#'+i).style.display=s?'':'none');$('#sw').innerHTML=s?'Already on Amlink? <a>Log in</a>':'New here? <a>Create account</a>';$('#err').textContent=''};
$("#gob").onclick=async()=>{const u=$('#fU').value.trim().toLowerCase(),p=$('#fP').value;try{
 if(mode==='signup'){const f=new FormData();f.append('username',u);f.append('password',p);f.append('email',$('#fM').value.trim());f.append('terms',$('#fT').checked?'1':'0');if(signPic)f.append('pic',await(await fetch(signPic)).blob(),'pic.jpg');enter(await api('/api/signup',{method:'POST',body:f}))}
 else enter(await jpost('/api/login',{username:u,password:p}))}catch(e){$('#err').textContent=e.message}};
async function enter(u){me=u.name;document.body.classList.add('in');$('#sbx').innerHTML=ic('search',18)+'<input id="q" placeholder="Search people by @username" oninput="onq(this.value)" onfocus="if(tab!==\'search\'){tab=\'search\';view=null;render()}">';$('#gb').innerHTML=ic('gear');
 $('#nav').innerHTML=[['home','Home','home'],['reels','Reels','reels'],['create','Create','plus'],['chat','Chat','chat'],['me','Profile','user'],['settings','Settings','gear']].map(([t,l,i])=>`<button data-t="${t}" class="${t==='create'?'mk':''} ${t==='settings'?'dsk':''}" onclick="${t==='create'?'openCreate()':`go('${t}')`}" aria-label="${l}">${ic(i)}<span>${l}</span></button>`).join('');
 await load();setInterval(poll,3000);setInterval(refreshPosts,9000)}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
async function delAcc(){if(confirm('Delete your account and posts? This cannot be undone.')){await api('/api/me',{method:'DELETE'});location.reload()}}
/* data */
async function loadUsers(){users=await api('/api/users')}
async function load(){try{await loadUsers();posts=await api('/api/posts');render()}catch(e){toast(e.message)}}
async function refreshPosts(){try{const p=await api('/api/posts');if(JSON.stringify(p)!==JSON.stringify(posts)){posts=p;if(tab==='home'||tab==='me')render()}}catch(e){}}
async function poll(){try{const o=JSON.stringify(users);await loadUsers();if(o!==JSON.stringify(users)){$('#side').innerHTML=sideHTML();if(tab==='chat'||tab==='search')keep()}if(tab==='chat')loadThread()}catch(e){}}
function keep(){const v=$('#ci')?.value;render();const c=$('#ci');if(c&&v){c.value=v;c.focus()}}
const go=t=>{tab=t;view=null;chatOpen=false;render();scrollTo(0,0)};
const openProfile=u=>{tab='me';view=u===me?null:u;render();scrollTo(0,0)};
const onq=v=>{q=v;if(tab!=='search')tab='search';render()};
async function follow(u){try{await api('/api/follow/'+u,{method:'POST'});await loadUsers();render()}catch(e){toast(e.message)}}
async function like(id){try{await api(`/api/posts/${id}/like`,{method:'POST'});posts=await api('/api/posts');const o=$('#reels')?.scrollTop;render();if(o)$('#reels').scrollTop=o;if($('#cmx'))openComments(id)}catch(e){toast(e.message)}}
async function delPost(id){if(confirm('Delete this post?')){await api('/api/posts/'+id,{method:'DELETE'});load()}}
/* views */
function postHTML(p){const lk=p.likes.includes(me),m=p.type==='video'?`<video class="m" src="${p.src}" controls playsinline preload="metadata"></video>`:p.type==='image'?`<img class="m" src="${p.src}" alt="Post by ${esc(p.user)}">`:'';
 return `<article class="card post"><header><a class="who" onclick="openProfile('${p.user}')">${av(p.user,42,1)}<span><b>${esc(p.user)}</b><small>${ago(p.t)}</small></span></a>${p.user!==me&&!(users[p.user]||{}).isFollowing?`<button class="btn sm ghost" onclick="follow('${p.user}')">Follow</button>`:''}</header>${p.text?`<p>${esc(p.text)}</p>`:''}${m}
 <div class="acts"><button class="${lk?'liked':''}" onclick="like('${p.id}')" aria-label="Like">${ic('heart')}${p.likes.length}</button><button onclick="openComments('${p.id}')" aria-label="Comments">${ic('chat')}${p.comments.length}</button><span class="sp"></span>${p.user===me?`<button onclick="delPost('${p.id}')" aria-label="Delete">${ic('trash',20)}</button>`:`<button onclick="toast('Reported. Thank you.')" aria-label="Report">${ic('flag',20)}</button>`}</div></article>`}
const sugCard=()=>{const s=Object.keys(users).filter(u=>u!==me&&!users[u].isFollowing).slice(0,5);return `<div class="card sec"><h3>Suggested for you</h3>${s.map(u=>`<div class="prow s"><a class="who" onclick="openProfile('${u}')">${av(u,38,1)}<b>${esc(u)}</b></a><span class="sp"></span><a onclick="follow('${u}')">Follow</a></div>`).join('')||'<p class="mu">No suggestions yet. Invite friends to join!</p>'}</div>`};
const onlineCard=()=>{const o=Object.keys(users).filter(u=>u!==me&&users[u].online);return `<div class="card sec"><h3>Online now · ${o.length}</h3>${o.map(u=>`<div class="prow s"><a class="who" onclick="openChat('${u}')">${av(u,38,1)}<b>${esc(u)}</b></a></div>`).join('')||'<p class="mu">No one else is online.</p>'}</div>`};
const sideHTML=()=>sugCard()+onlineCard();
function home(){const list=posts.filter(p=>feed==='all'||p.user===me||(users[p.user]||{}).isFollowing),ppl=Object.keys(users).filter(u=>u!==me).sort((a,b)=>users[b].online-users[a].online).slice(0,14);
 return `<div class="wrap"><div class="stories"><button class="st" onclick="openCreate()">${av(me,62)}<b class="plus">${ic('plus',14)}</b><small>Your post</small></button>${ppl.map(u=>`<button class="st" onclick="openProfile('${u}')"><span class="ring">${av(u,56,1)}</span><small>${esc(u)}</small></button>`).join('')}</div>
 <div class="card compose" onclick="openCreate()">${av(me,40)}<span class="sp">What's on your mind, ${esc(me)}?</span><b class="btn sm">Post</b></div>
 <div class="mobonly" style="margin-top:14px">${sugCard()}</div>
 <div class="chips"><button class="${feed==='all'?'on':''}" onclick="feed='all';render()">For you</button><button class="${feed==='fol'?'on':''}" onclick="feed='fol';render()">Following</button></div>
 ${list.length?list.map(postHTML).join(''):`<div class="empty">${feed==='fol'?'Follow people to fill this feed.':'No posts yet. Be the first.'}</div>`}</div>`}
function reels(){const v=posts.filter(p=>p.type==='video');
 return `<div id="reels">${v.length?v.map(p=>`<section class="reel"><video src="${p.src}" loop muted playsinline onclick="this.muted=!this.muted;toast(this.muted?'Muted':'Sound on')"></video><div class="info"><a onclick="openProfile('${p.user}')">@${esc(p.user)}</a><p>${esc(p.text)}</p></div><div class="rail"><button onclick="openProfile('${p.user}')">${av(p.user,48)}</button><button class="${p.likes.includes(me)?'liked':''}" onclick="like('${p.id}')" aria-label="Like">${ic('heart',32)}<small>${p.likes.length}</small></button><button onclick="openComments('${p.id}')" aria-label="Comments">${ic('chat',32)}<small>${p.comments.length}</small></button></div></section>`).join(''):`<div class="empty" style="color:#bbb;padding-top:30vh">No reels yet.<br><br><button class="btn" onclick="openCreate()">Post a video</button></div>`}</div>`}
function autoplay(){const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');e.isIntersecting?v.play().catch(()=>{}):v.pause()}),{threshold:.6});document.querySelectorAll('.reel').forEach(r=>io.observe(r))}
function chat(){const n=Object.keys(users).filter(u=>u!==me).sort((a,b)=>users[b].online-users[a].online||a.localeCompare(b));
 if(!n.length)return `<div class="empty">No one else has joined yet.<br>Invite a friend, or use Search to find people by username.</div>`;
 const c=users[chatWith]&&chatWith!==me?chatWith:n[0],d=users[c];
 return `<div class="chat ${chatOpen?'open':''}"><div class="list">${n.map(u=>`<button class="${u===c?'on':''}" onclick="openChat('${u}')">${av(u,46,1)}<span><b>${esc(u)}</b><small class="mu" style="display:block">${users[u].online?'Online':'Offline'}</small></span></button>`).join('')}</div>
 <div class="conv"><div class="ch"><button class="back" onclick="chatOpen=false;render()" aria-label="Back">←</button><a class="who" onclick="openProfile('${c}')">${av(c,40,1)}<span><b>${esc(c)}</b><small>${d.online?'Online now':'Offline'}</small></span></a></div>
 <div class="msgs" id="msgs">${thread.map(m=>`<div class="b ${m.from===me?'me':''}">${esc(m.t)}<small>${new Date(m.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small></div>`).join('')||'<div class="empty">Say hi to '+esc(c)+'.</div>'}</div>
 <div class="send"><input id="ci" placeholder="Message ${esc(c)}" onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn" onclick="sendMsg()">Send</button></div></div></div>`}
function openChat(u){chatWith=u;chatOpen=true;tab='chat';thread=[];render();loadThread()}
async function loadThread(){const c=chatWith||Object.keys(users).filter(u=>u!==me)[0];if(!c)return;try{const t=await api('/api/messages?with='+c);if(JSON.stringify(t)!==JSON.stringify(thread)){thread=t;keep();scrollMsgs()}}catch(e){}}
const scrollMsgs=()=>{const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight};
async function sendMsg(){const i=$('#ci'),t=i.value.trim(),c=chatWith||Object.keys(users).filter(u=>u!==me)[0];if(!t)return;i.value='';try{await jpost('/api/messages',{to:c,text:t});loadThread()}catch(e){toast(e.message)}}
const personRow=u=>`<div class="card prow"><a class="who" onclick="openProfile('${u}')">${av(u,48,1)}<span><b>${esc(u)}</b><small>${esc(users[u].bio)||users[u].followers+' followers'}</small></span></a><span class="sp"></span><button class="btn sm ${users[u].isFollowing?'ghost':''}" onclick="follow('${u}')">${users[u].isFollowing?'Following':'Follow'}</button><button class="btn sm ghost" onclick="openChat('${u}')" aria-label="Message">${ic('chat',18)}</button></div>`;
function search(){const s=q.trim().toLowerCase().replace(/^@/,''),n=Object.keys(users).filter(u=>u!==me&&(!s||u.includes(s)||(users[u].bio||'').toLowerCase().includes(s)));
 return `<div class="wrap"><h2>${s?'Results for @'+esc(s):'People on Amlink'}</h2>${n.length?n.map(personRow).join(''):`<div class="empty">Nobody found for "@${esc(s)}".<br>Check the exact username.</div>`}</div>`}
function profile(){const u=view||me,d=users[u];if(!d)return '<div class="empty">User not found.</div>';const ps=posts.filter(p=>p.user===u);
 return `<div class="wrap"><div class="ph">${av(u,96,1)}<div><h2>@${esc(u)}</h2><div class="nums"><span><b>${ps.length}</b>posts</span><span><b>${d.followers}</b>followers</span><span><b>${d.followingCount}</b>following</span></div><small class="mu">${d.online?'● Online now':'Offline'}</small></div></div>
 <p class="bio">${esc(d.bio)||(u===me?'No bio yet. Add one in Settings.':'')}</p>
 <div class="row">${u===me?`<button class="btn ghost" onclick="go('settings')">Edit profile and settings</button>`:`<button class="btn ${d.isFollowing?'ghost':''}" onclick="follow('${u}')">${d.isFollowing?'Following':'Follow'}</button><button class="btn ghost" onclick="openChat('${u}')">Message</button>`}</div>
 <div class="grid">${ps.map(p=>`<div class="t">${p.type==='image'?`<img src="${p.src}" alt="">`:p.type==='video'?`<video src="${p.src}" muted preload="metadata"></video>`:`<div>${esc(p.text)}</div>`}</div>`).join('')}</div></div>`}
function settings(){const t=pref('theme','color'),a=pref('accent','auto');
 return `<div class="wrap"><h2>Settings</h2>
 <div class="card sec"><h3>Appearance</h3><div class="seg">${[['color','🌈 Colorful'],['mono','⚪ Black and white'],['night','⚫ Night']].map(([k,l])=>`<button class="${t===k?'on':''}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div><p class="mu">Accent colour (Colorful theme)</p><div class="sw"><button class="${a==='auto'?'on':''}" onclick="setAcc('auto')">Auto</button>${ACC.map(c=>`<button class="${a===c?'on':''}" style="background:linear-gradient(135deg,${c.split(',')[0]},${c.split(',')[1]})" onclick="setAcc('${c}')" aria-label="Accent colour"></button>`).join('')}</div></div>
 <div class="card sec"><h3>Privacy</h3><label class="tg"><span>Show when I'm online</span><input type="checkbox" ${users[me].hide?'':'checked'} onchange="setHide(!this.checked)"></label></div>
 <div class="card sec"><h3>Profile</h3><div class="row"><label class="btn ghost">Change photo<input type="file" accept="image/*" hidden onchange="newPic(this)"></label><button class="btn ghost" onclick="editBio()">Edit bio</button></div></div>
 <div class="card sec"><h3>Legal</h3><a data-doc="terms">Terms and Conditions</a><a data-doc="privacy">Privacy Policy</a><a data-doc="rules">Community Guidelines</a></div>
 <div class="card sec"><div class="row"><button class="btn ghost" onclick="logout()">Log out</button><button class="btn danger" onclick="delAcc()">Delete my account</button></div></div></div>`}
async function setHide(v){await jpost('/api/settings',{hide:v});loadUsers()}
async function newPic(i){const f=i.files[0];if(!f)return;try{const fd=new FormData();fd.append('pic',await(await fetch(await shrink(await readFile(f),400))).blob(),'pic.jpg');await api('/api/me',{method:'POST',body:fd});load();toast('Photo updated')}catch(e){toast('Could not use that image.')}}
async function editBio(){const b=prompt('Your bio (150 characters)',users[me].bio||'');if(b===null)return;const fd=new FormData();fd.append('bio',b);await api('/api/me',{method:'POST',body:fd});load()}
function render(){const h=document.documentElement;h.dataset.tab=tab;document.querySelectorAll('#nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab&&!(tab==='me'&&view)));
 const m=$('#main');m.innerHTML=({home,reels,chat,me:profile,search,settings})[tab]();$('#side').innerHTML=sideHTML();if(tab==='reels')autoplay();if(tab==='chat')scrollMsgs()}
/* create + comments */
function openCreate(){cfile=null;show(`<h3>Create post</h3><textarea id="ct" placeholder="What's on your mind?" maxlength="1000"></textarea><div id="cp"></div><div class="row"><label class="btn ghost">${ic('plus',18)} Photo or video<input type="file" accept="image/*,video/*" hidden onchange="cpick(this)"></label><span class="sp"></span><button class="btn" id="cb" onclick="cpublish()">Post</button></div><div class="err" id="ce"></div>`)}
async function cpick(i){const f=i.files[0],e=$('#ce');if(!f)return;e.textContent='';
 if(f.type.startsWith('video')){if(f.size>55e6){e.textContent='Video is over 55 MB.';return}cfile=f;$('#cp').innerHTML=`<video src="${URL.createObjectURL(f)}" controls playsinline></video>`}
 else if(f.type.startsWith('image')){try{const d=await shrink(await readFile(f),1600);cfile=await(await fetch(d)).blob();$('#cp').innerHTML=`<img class="pv" src="${d}" alt="Preview">`}catch(x){e.textContent='Could not read that image. Try a JPG or PNG.'}}
 else e.textContent='Choose a photo or video.'}
async function cpublish(){const t=$('#ct').value.trim(),b=$('#cb'),e=$('#ce');if(!t&&!cfile){e.textContent='Write something or add a photo or video.';return}
 b.disabled=true;b.textContent='Posting…';const fd=new FormData();fd.append('text',t);if(cfile)fd.append('media',cfile,cfile.name||'photo.jpg');
 try{await api('/api/posts',{method:'POST',body:fd});dlg.close();if(tab!=='reels')tab='home';await load();toast('Posted')}catch(x){e.textContent=x.message;b.disabled=false;b.textContent='Post'}}
function openComments(id){const p=posts.find(x=>x.id===id);if(!p)return;show(`<div id="cmx"><h3>Comments</h3>${p.comments.map(c=>`<p><b>${esc(c.u)}</b> ${esc(c.t)}</p>`).join('')||'<p class="mu">No comments yet.</p>'}<div class="send" style="padding:10px 0 0"><input id="cmi" placeholder="Add a comment" onkeydown="if(event.key==='Enter')addComment('${id}')"><button class="btn sm" onclick="addComment('${id}')">Send</button></div></div>`)}
async function addComment(id){const i=$('#cmi'),t=i.value.trim();if(!t)return;try{await jpost(`/api/posts/${id}/comment`,{text:t});posts=await api('/api/posts');render();openComments(id)}catch(e){toast(e.message)}}
theme();api('/api/me').then(enter).catch(()=>{});
</script>
</body>
</html>
