function dropVo(){if(ES&&ES.vo){ES.vo=null;toast('Voiceover removed because the clip length changed')}}
async function voStart(){
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Recording is not supported here');return}

  ES.rec=mr;V.currentTime=ES.start;V.playbackRate=ES.speed;V.muted=true;V.play().catch(()=>{});mr.start();panel()}

function click(e){

/* ---------- save the edit as a new video file ---------- */
async function done(){

  if(!edited){close();toast('No changes made');return}
  if((ES.end-ES.start)/ES.speed>MAXD+.5){toast('The finished video would be longer than 60 seconds. Trim more or speed it up.');return}
  if(!REC()){toast('This browser cannot save video edits. Try Chrome, Edge or Firefox.');return}

  o.appendChild(ov);

  catch(err){if(err&&err.message!='cancel')toast(err.message||'Could not process the video');const x=$('.vexp');if(x)x.remove();if(ES){ES.busy=false;if(V)V.play().catch(()=>{})}}}

function exportVideo(onp){
  return new Promise((resolve,reject)=>{
    const v=document.createElement('video');v.playsInline=true;v.preload='auto';v.src=V.src;
    let ac=null,rec=null,tmr=0,cancelled=false,ended=false,va=null;
    const clean=()=>{clearInterval(tmr);try{v.pause()}catch(e){}try{va&&va.pause()}catch(e){}try{ac&&ac.close()}catch(e){}EXP=null};
    EXP={cancel:()=>{cancelled=true;clean();try{if(rec&&rec.state!='inactive')rec.stop()}catch(e){}reject(new Error('cancel'))}};
    v.onerror=()=>{clean();reject(new Error('This video format cannot be processed here.'))};
    v.onloadeddata=async()=>{
      try{
        const g=geom(v.videoWidth,v.videoHeight),c=document.createElement('canvas');c.width=g.ow;c.height=g.oh;
        const x=c.getContext('2d'),stream=c.captureStream(30),len=ES.end-ES.start,sp=ES.speed,st=ES.start,en=ES.end,fl=F()?fstr():'none';
        if(!ES.mute||ES.vo){const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();const dest=ac.createMediaStreamDestination();
          if(!ES.mute){const src=ac.createMediaElementSource(v),gn=ac.createGain();gn.gain.value=ES.vol/100;src.connect(gn);gn.connect(dest)}else v.muted=true;
          if(ES.vo){va=new Audio();va.src=ES.vo.url;ac.createMediaElementSource(va).connect(dest)}
          await ac.resume();dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t))}
        else v.muted=true;
        v.playbackRate=sp;
        const mime=pickMime(),opts={videoBitsPerSecond:2200000,audioBitsPerSecond:128000};if(mime)opts.mimeType=mime;
        rec=new MediaRecorder(stream,opts);const ch=[];
        rec.ondataavailable=ev=>{if(ev.data&&ev.data.size)ch.push(ev.data)};
        rec.onstop=async()=>{
          if(cancelled)return;
          try{
            const type=(rec.mimeType||mime||'video/webm').split(';')[0];let blob=new Blob(ch,{type});
            if(type=='video/webm'){try{const fx=fixWebm(new Uint8Array(await blob.arrayBuffer()),len/sp);if(fx)blob=new Blob([fx],{type})}catch(e){}}
            if(blob.size>28*1048576)throw new Error('The edited video is too large. Trim it or crop it smaller.');
            const file=new File([blob],'reel.'+(type=='video/mp4'?'mp4':'webm'),{type});file.xdur=len/sp;clean();resolve(file)}
          catch(err){clean();reject(err)}};
        v.currentTime=st;await once(v,'seeked');
        rec.start(500);if(va)va.play().catch(()=>{});await v.play();
        const tick=()=>{if(cancelled||ended)return;
          x.filter=fl;x.drawImage(v,g.sx,g.sy,g.cw,g.ch,0,0,c.width,c.height);x.filter='none';drawItems(x,c.width,c.height);
          onp(Math.min(1,Math.max(0,(v.currentTime-st)/len)));
          if(v.currentTime>=en-.03||v.ended){ended=true;clearInterval(tmr);v.pause();setTimeout(()=>{try{rec.stop()}catch(e){}},200)}};
        tmr=setInterval(tick,33)}
      catch(err){clean();reject(new Error(err&&err.message&&err.message.length<90?err.message:'Could not process the video'))}}})}

window.XVE={open,auto:f=>open(f)};window.fixWebm=fixWebm;window.pickMime=pickMime;
document.addEventListener('click',e=>{const b=e.target.closest('[data-a=vedit]');if(!b)return;e.stopPropagation();const f=typeof window.studioVideo=='function'&&window.studioVideo();if(f)open(f);else toast('Choose a video first')},true);
})();

:root[data-t=dark]{--bg:#04060f;--fg:#eaf2ff;--mut:#8b9ac0;--card:#0d1530;--line:#1d2b50;--acc:#6ee7ff;--glass:rgba(9,14,32,.66);--glow:#22d3ee}
:root[data-t=light]{--bg:#f2f5ff;--fg:#0a1230;--mut:#5d6b8f;--card:#ffffff;--line:#d5ddf5;--acc:#2563eb;--glass:rgba(255,255,255,.72);--glow:#6366f1}
:root{--neon:linear-gradient(120deg,#22d3ee,#6366f1 48%,#d946ef);--sh:linear-gradient(110deg,#22d3ee,#ffffff 28%,#a78bfa 52%,#f0abfc 76%,#22d3ee);--rd:#22d3ee}
html,body{background:var(--bg);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;background:radial-gradient(40% 35% at 18% 12%,#22d3ee33,transparent 70%),radial-gradient(38% 34% at 86% 20%,#a855f733,transparent 70%),radial-gradient(45% 40% at 52% 100%,#ec489933,transparent 70%);animation:amb 28s ease-in-out infinite alternate;will-change:transform}
:root[data-t=light] body::before{opacity:.55}
@keyframes amb{to{transform:translate3d(3%,2%,0) scale(1.08) rotate(2deg)}}
#app{position:relative;z-index:1;height:var(--vvh,100dvh);background:transparent}
*{scrollbar-width:thin;scrollbar-color:#3b4d8a transparent}
::selection{background:#22d3ee55}
button,a,[data-a]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* ---------- glass surfaces ---------- */
#tb,nav{background:var(--glass)!important;backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5)}
#tb{border-bottom:1px solid var(--line)}nav{border-top:1px solid var(--line)}
.post,.cd,.stc,.skc,.comp,.pst,.gc,.shi,.mt,.cupc{background:var(--glass);border:1px solid var(--line);box-shadow:inset 0 1px 0 #ffffff12,0 14px 40px -26px #000}
.post{border-radius:20px}.comp{border-radius:26px}
.pgh{background:var(--glass)!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#md,#stu,#vedt,#pedt,#crp{background:var(--bg)}
#sh{--bg:#0a1126;--card:#131b38;--line:#223059}
#ts{background:var(--glass);color:var(--fg);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 0 28px -8px var(--glow),0 10px 30px -12px #000}
#dr{background:var(--bg)}

/* ---------- neon controls ---------- */
.pri:not(.sec){background:var(--neon) 0 0/200% 100%!important;color:#02121a!important;box-shadow:inset 0 1px 0 #ffffff66,0 10px 30px -12px var(--glow)}
.ed,.fb{background:var(--card);border:1px solid var(--line);transition:box-shadow .2s,border-color .2s,transform .12s}
input:not([type=checkbox]):not([type=range]):focus,textarea:focus,select:focus{outline:none;border-color:#22d3ee88!important;box-shadow:0 0 0 3px #22d3ee22,0 0 22px -8px var(--glow)}
.sw input:checked+span{background:var(--neon) 0 0/200% 100%}
.atb button.on,.atb button.on2{background:var(--neon);color:#02121a;border-color:transparent}
.seg{background:var(--card);border:1px solid var(--line)}.seg button.on{background:var(--neon);color:#02121a}
nav button.on{color:var(--glow)}nav button.on svg{filter:drop-shadow(0 0 7px var(--glow))}
nav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:2px;border-radius:0 0 3px 3px;background:var(--neon);box-shadow:0 0 12px var(--glow)}
nav .pl2{animation:shine 6s linear infinite,glowp 3.2s ease-in-out infinite;box-shadow:0 0 0 1px #ffffff40 inset,0 0 18px -4px var(--glow)}
@keyframes glowp{50%{box-shadow:0 0 0 1px #ffffff40 inset,0 0 30px -2px var(--glow)}}
#nb,.bd{animation:bpulse 2.4s ease-in-out infinite}
@keyframes bpulse{50%{box-shadow:0 0 0 4px #f0284933}}
.od{animation:odp 2.2s ease-in-out infinite}
@keyframes odp{50%{box-shadow:0 0 0 4px #31a24c33}}
.stc b,.pst b,.st b{letter-spacing:.4px;font-variant-numeric:tabular-nums}
@media(hover:hover){.ed:hover,.fb:hover,.di:hover,.sr:hover,.gc:hover{border-color:#22d3ee66;box-shadow:0 0 22px -10px var(--glow)}.post:hover{box-shadow:inset 0 1px 0 #ffffff12,0 18px 50px -26px var(--glow)}}
@media(min-width:900px){nav button.on::before{top:22%;bottom:22%;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}}

/* ---------- chat bubbles and the new message bar ---------- */
.m{background:var(--card);border:1px solid var(--line)}
.m.me:not([class*="bb_"]){background:var(--neon)!important;color:#02121a!important;border:0}
.m.me:not([class*="bb_"]) small{color:#02121acc}
.m.mnew{animation:mpop .34s cubic-bezier(.2,.9,.3,1.25)}
@keyframes mpop{from{opacity:0;transform:translateY(10px) scale(.94)}}
.ms{min-height:0;overscroll-behavior:contain}
.ch .bar{position:relative;display:flex;align-items:center;gap:8px;flex:none;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.ch .bar #mi{flex:1 1 auto;min-width:0;width:auto;height:42px;padding:0 16px;border-radius:21px;background:var(--card);border:1px solid var(--line);color:var(--fg);transition:box-shadow .2s,border-color .2s}
.ch .bar>button{flex:none;width:42px;height:42px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--card);border:1px solid var(--line);color:var(--fg);transition:transform .12s,box-shadow .2s}
.ch .bar>button:active,.btray>*:active{transform:scale(.92)}
.ch .bar>#mic{width:auto;min-width:42px;padding:0 12px;border-radius:21px}
.ch .bar>[data-a=send],.ch .bar>[data-a=gs]{background:var(--neon);color:#02121a;border:0;font-weight:800;box-shadow:0 0 20px -6px var(--glow)}
.ch .bar:not(.has)>[data-a=send]{display:none}
.ch .bar.has>#mic{display:none}
.ch .bar>.bplus{font-size:24px;line-height:1;transition:transform .25s cubic-bezier(.2,.9,.3,1.3),background .2s}
.ch .bar.open>.bplus{transform:rotate(45deg);background:var(--neon);color:#02121a;border:0}
.btray{position:absolute;left:10px;bottom:calc(100% + 8px);display:flex;gap:8px;padding:8px;border-radius:20px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 14px 34px -12px #000,0 0 26px -12px var(--glow);z-index:4;animation:trayin .22s cubic-bezier(.2,.9,.3,1.25);transform-origin:bottom left}
.btray[hidden]{display:none}
.ch .bar .btray>*{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;padding:0;background:var(--card);border:1px solid var(--line);cursor:pointer;color:var(--fg)}
@keyframes trayin{from{opacity:0;transform:translateY(8px) scale(.85)}}
.emp{background:var(--glass);backdrop-filter:blur(16px)}
.rpb{background:var(--glass)}

/* ---------- moments strip placeholder (stops the feed jumping when it loads) ---------- */
.msph{pointer-events:none}.msph .mo b.av{animation:none!important;box-shadow:none!important;background:var(--card)!important}
.msph .mo span{display:block;height:10px;margin-top:8px;border-radius:5px;background:var(--card)}

/* ---------- motion ---------- */
#main>*:not(.rl):not(.ch){animation:fin .38s cubic-bezier(.2,.8,.2,1) both}
.pr,.gc,.cd,.stc,.shi{animation:fin .4s cubic-bezier(.2,.8,.2,1) both}
.pr:nth-child(2),.gc:nth-child(2){animation-delay:.04s}.pr:nth-child(3),.gc:nth-child(3){animation-delay:.08s}.pr:nth-child(4),.gc:nth-child(4){animation-delay:.12s}.pr:nth-child(5),.gc:nth-child(5){animation-delay:.16s}.pr:nth-child(n+6),.gc:nth-child(n+6){animation-delay:.2s}
button:active:not(:disabled),.pr:active{transition:transform .08s}
@keyframes fin{from{opacity:0;transform:translateY(10px)}}
#app.out #login{animation:fin .6s ease both}
@media(prefers-reduced-motion:reduce){body::before,nav .pl2,#nb,.bd,.od,.m.mnew,.btray,.pr,.gc,.cd,.stc,.shi,#main>*{animation:none!important}}
</style>
<script>
(()=>{
/* ================= 1. chats only redraw when something changed ================= */
const MC={on:false,data:null};
const Aprev=A;
A=async(p,b)=>{if(MC.on&&typeof p=='string'&&(p.startsWith('msgs?')||p.startsWith('gmsgs?'))){MC.on=false;return MC.data}return Aprev(p,b)};
const sig=m=>JSON.stringify(m.map(x=>x.U?[x.TS,x.Text,x.Media,x.U.ID,x.Me]:x));
const playing=b=>[...b.querySelectorAll('audio,video')].some(v=>!v.paused&&!v.ended);
/* returns 'same' (nothing to do), 'busy' (a voice note or video is playing) or 'drawn' */
async function gated(sel,fetchM,inner,key){
  const m=await fetchM(),b=$(sel);if(!b)return'none';
  const sg=sig(m);
  if(b.dataset.sig===sg&&b.dataset.k==key)return'same';
  if(b.dataset.sig&&playing(b))return'busy';
  const prevN=+b.dataset.n||0;
  MC.data=m;MC.on=true;
  try{await inner()}finally{MC.on=false}
  const nb=$(sel);if(!nb)return'none';
  nb.dataset.sig=sg;nb.dataset.k=key;
  const els=[...nb.querySelectorAll('.m')];nb.dataset.n=els.length;
  if(prevN>0&&els.length>prevN)els.slice(prevN).forEach(e=>e.classList.add('mnew'));
  return'drawn'}
const Lp=L;
L=async function(){
  if(!$('#ms')||typeof peer=='undefined'||!peer||!$('#mic'))return Lp();
  return gated('#ms',()=>Aprev('msgs?w='+peer.ID),Lp,peer.ID)};
const Gp=gload;
gload=async function(){
  if(!$('#ms')||typeof gid=='undefined'||!gid||$('#mic'))return Gp();
  return gated('#ms',()=>Aprev('gmsgs?g='+gid),Gp,gid)};

/* ================= 2. the message bar: one input, a + tray, send/mic that swap ================= */
function tidyBar(){
  const bar=document.querySelector('.ch .bar');if(!bar||bar.dataset.t)return;bar.dataset.t='1';
  const tray=document.createElement('div');tray.className='btray';tray.hidden=true;
  [bar.querySelector('label.at'),document.getElementById('emb'),document.getElementById('gmb'),document.getElementById('gfb')].forEach(el=>{if(el)tray.appendChild(el)});
  bar.appendChild(tray);
  bar.insertAdjacentHTML('afterbegin','<button class="bplus" data-a="bpl" aria-label="More options">＋</button>');
  const sd=bar.querySelector('[data-a=send]'),gs=bar.querySelector('[data-a=gs]');if(sd)sd.textContent='➤';if(gs)gs.textContent='➤';
  const mi=document.getElementById('mi'),upd=()=>bar.classList.toggle('has',!!(mi&&mi.value.trim()));
  if(mi){mi.addEventListener('input',upd);mi.addEventListener('focus',()=>{tray.hidden=true;bar.classList.remove('open')});upd()}
  tray.addEventListener('click',e=>{if(!e.target.closest('label.at'))setTimeout(()=>{tray.hidden=true;bar.classList.remove('open')},0)})}
const ch7=chat;chat=async function(u){await ch7(u);tidyBar()};
const go7=gopen;gopen=async function(id,n){await go7(id,n);tidyBar()};
const sd7=send;send=async function(){const r=await sd7.apply(this,arguments);const bar=document.querySelector('.ch .bar'),mi=document.getElementById('mi');if(bar)bar.classList.toggle('has',!!(mi&&mi.value.trim()));return r};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a=bpl]');if(!b)return;e.stopPropagation();
  const bar=b.closest('.bar'),t=bar&&bar.querySelector('.btray');if(!t)return;t.hidden=!t.hidden;bar.classList.toggle('open',!t.hidden)},true);

/* ================= 3. phone keyboard: the screen follows the visible area ================= */
if(window.visualViewport){
  const vv=window.visualViewport,root=document.documentElement;
  const sync=()=>{root.style.setProperty('--vvh',Math.round(vv.height)+'px');window.scrollTo(0,0);
    const a=document.activeElement,ms=document.getElementById('ms');if(ms&&a&&a.id=='mi')ms.scrollTop=ms.scrollHeight};
  vv.addEventListener('resize',sync);vv.addEventListener('scroll',()=>window.scrollTo(0,0));sync()}

/* ================= 4. no jump when the moments strip arrives ================= */
const hm7=home;
home=function(){hm7();const c=document.querySelector('#main .comp');
  if(c&&!document.querySelector('#main .ms2'))c.insertAdjacentHTML('beforebegin','<div class="ms2 msph" aria-hidden="true">'+Array(6).fill('<span class="mo"><b class="av"></b><span></span></span>').join('')+'</div>')};
const st7=strip;
strip=async function(){try{await st7()}finally{document.querySelectorAll('#main .msph').forEach(e=>e.remove())}};

window.XST7={sig,gated,tidyBar,MC};
})();
</script>

/* Amlink profile image viewer: isolated from the existing profile and post viewers. */
#am-profile-viewer{position:fixed;inset:0;z-index:10050;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:22px;touch-action:pan-y}

 <button type="button" aria-label="Close image" data-am-pv-close>×</button>
 <img alt="Profile image" draggable="false">
 <div class="am-pv-label">Tap outside or press Esc to close</div>

<script>
(()=>{
 const box=document.getElementById('am-profile-viewer');if(!box)return;
 const img=box.querySelector('img');let previousFocus=null;
 function show(src,label){if(!src)return;previousFocus=document.activeElement;img.src=src;img.alt=label||'Profile image';box.classList.add('open');document.body.style.overflow='hidden';box.focus();}
 function close(){box.classList.remove('open');img.removeAttribute('src');document.body.style.overflow='';if(previousFocus&&previousFocus.focus)previousFocus.focus();}
 document.addEventListener('click',e=>{
  if(box.classList.contains('open'))return;
  const cover=e.target.closest('#main .cov');
  const avatar=e.target.closest('#main .pfc .rng');
  if(!cover&&!avatar)return;
  if(!window.PF)return;
  e.preventDefault();e.stopPropagation();
  if(cover){if(PF.Cover)show(PF.Cover,'Profile cover photo');}
  else if(PF.U&&PF.U.Av)show(PF.U.Av,'Profile picture');
 },true);
 box.addEventListener('click',e=>{if(e.target===box||e.target.closest('[data-am-pv-close]'))close()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&box.classList.contains('open'))close()});
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js" defer></script>
<script>
(()=>{
/* Two new solo arcade games. Scores are submitted through the existing one-use game-token flow. */
const submitNew=async(game,score)=>{try{const t=window.XTOK&&window.XTOK[game];if(!t)throw new Error('Game session expired. Start again.');const j=await A('gscore',{game,score,tok:t});toast(j.New?'New best: '+j.Best+' 🎉':'Score '+score+' · best '+j.Best)}catch(e){toast(e.message)}};
window.XG=window.XG||{};
window.XG.taprush=async function(){
  window.XTOK=window.XTOK||{};const j=await A('gstart',{game:'taprush'});XTOK.taprush=j.tok;
  modal('<h3>Tap Rush</h3><p id="tr-msg" class="sub" style="text-align:center;padding:14px">Tap Start, then wait for green. Tap too early and the round resets.</p><button id="tr-pad" style="width:100%;height:210px;border:0;border-radius:20px;background:#64748b;color:#fff;font-size:25px;font-weight:800">START</button><p id="tr-score" class="sub" style="text-align:center;padding:12px">Best reaction score is saved to your Amlink profile.</p>');
  const pad=$('#tr-pad'),msg=$('#tr-msg'),score=$('#tr-score');let phase='ready',timer=null,start=0;
  pad.onclick=()=>{if(phase==='ready'||phase==='early'){clearTimeout(timer);phase='wait';pad.style.background='#b7791f';pad.textContent='WAIT…';msg.textContent='Wait for the green signal';timer=setTimeout(()=>{phase='go';start=performance.now();pad.style.background='#16a34a';pad.textContent='TAP NOW!';msg.textContent='Tap as quickly as you can'},3200+Math.random()*1800)}else if(phase==='wait'){clearTimeout(timer);phase='early';pad.style.background='#b91c1c';pad.textContent='TOO SOON';msg.textContent='You tapped early. Tap to try again'}else if(phase==='go'){const ms=Math.round(performance.now()-start),sc=Math.max(1,Math.min(5000,5000-ms*5));phase='done';pad.style.background='#2563eb';pad.textContent=ms+' ms';msg.textContent='Reaction time: '+ms+' ms';score.textContent='Score: '+sc;submitNew('taprush',sc)}else{phase='ready';pad.style.background='#64748b';pad.textContent='START';msg.textContent='Tap Start, then wait for green.'}};
};
window.XG.tilemerge=async function(){
  window.XTOK=window.XTOK||{};const j=await A('gstart',{game:'tilemerge'});XTOK.tilemerge=j.tok;
  let board=Array(16).fill(0),score=0,over=false;const add=()=>{const z=board.map((v,i)=>v? -1:i).filter(i=>i>=0);if(z.length){const i=z[Math.random()*z.length|0];board[i]=Math.random()<.9?2:4}};add();add();
  modal('<h3>2048</h3><p id="tm-score" class="sub" style="text-align:center">Score 0 · Use arrow keys or swipe</p><div id="tm-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px;background:#9ca3af;border-radius:14px;touch-action:none;max-width:420px;margin:auto"></div><p id="tm-status" class="sub" style="text-align:center;padding:8px">Join matching tiles to make bigger numbers.</p><div class="act" style="justify-content:center"><button class="ed" id="tm-new">New game</button></div>');
  const grid=$('#tm-grid');const draw=()=>{if(!grid)return;grid.innerHTML=board.map((v,i)=>`<div style="aspect-ratio:1;display:grid;place-items:center;border-radius:8px;background:${v?'#f1d7a5':'#d1d5db'};color:#18202a;font-size:clamp(18px,5vw,28px);font-weight:800">${v||''}</div>`).join('');$('#tm-score').textContent='Score '+score+' · Use arrow keys or swipe'};
  const moved=(dir)=>{if(over)return;let changed=false;for(let n=0;n<4;n++){let ids=[];for(let k=0;k<4;k++){let r,c;if(dir==='left'){r=n;c=k}else if(dir==='right'){r=n;c=3-k}else if(dir==='up'){r=k;c=n}else{r=3-k;c=n}ids.push(r*4+c)}let vals=ids.map(i=>board[i]).filter(Boolean),out=[];for(let k=0;k<vals.length;k++){if(vals[k]===vals[k+1]){out.push(vals[k]*2);score+=vals[k]*2;k++}else out.push(vals[k])}while(out.length<4)out.push(0);ids.forEach((id,k)=>{if(board[id]!==out[k])changed=true;board[id]=out[k]})}if(changed){add();draw()}if(!board.some(v=>!v)&&!['left','right','up','down'].some(d=>{for(let i=0;i<16;i++){const r=i>>2,c=i%4,j=d==='left'?i-1:d==='right'?i+1:d==='up'?i-4:i+4;if((d==='left'&&c===0)||(d==='right'&&c===3)||(d==='up'&&r===0)||(d==='down'&&r===3))continue;if(board[i]===board[j])return true}return false})){over=true;$('#tm-status').textContent='No moves left. Final score: '+score;submitNew('tilemerge',Math.max(1,Math.min(50000,score)))}};

let liveRoom=null,liveRoomName='',liveHostId='',liveIsHost=false,liveHostVideo=null;
const loadLiveKit=()=>new Promise((resolve,reject)=>{if(window.LivekitClient)return resolve();const s=document.querySelector('script[src*="livekit-client"]');if(s){s.addEventListener('load',()=>window.LivekitClient?resolve():reject(new Error('LiveKit client did not load')),{once:true});s.addEventListener('error',()=>reject(new Error('Could not load LiveKit client')),{once:true});return}reject(new Error('LiveKit client script is missing'))});

async function liveConnect(roomName,host){
  await loadLiveKit();const j=await A('livetoken',{room:roomName});liveRoomName=roomName;liveHostId=j.owner;liveIsHost=!!j.host;
  modal(`<h3>${E(j.title||'Amlink Live')}</h3><div id="am-live-stage"><video id="am-live-video" autoplay playsinline ${host?'muted':''}></video><div class="am-live-controls"><span id="am-live-state">Connecting…</span><button id="am-live-mic">Mute mic</button><button id="am-live-cam">Turn camera off</button><button id="am-live-gift">🎁 Gift</button>${host?'<button id="am-live-end">End live</button>':'<button id="am-live-leave">Leave</button>'}</div><div id="am-live-comments" aria-live="polite"></div><div class="am-live-row"><input id="am-live-text" maxlength="180" placeholder="Say something kind…"><button id="am-live-send">Send</button></div></div>`);
  const video=$('#am-live-video'),state=$('#am-live-state');
  const room=new LivekitClient.Room({adaptiveStream:true,dynacast:true});liveRoom=room;
  const attach=(track)=>{const stage=$('#am-live-stage');if(!stage)return;const el=track.attach();if(track.kind==='video'){el.id='am-live-video';el.style.width='100%';el.style.minHeight='38vh';el.style.maxHeight='65vh';el.style.objectFit='contain';el.style.background='#000';const old=$('#am-live-video');if(old)old.replaceWith(el);else stage.insertBefore(el,stage.firstChild)}else{el.autoplay=true;el.style.display='none';stage.appendChild(el)}};
  room.on(LivekitClient.RoomEvent.TrackSubscribed,(track)=>attach(track));
  room.on(LivekitClient.RoomEvent.TrackUnsubscribed,(track)=>track.detach());
  room.on(LivekitClient.RoomEvent.DataReceived,(payload,participant)=>{try{const d=JSON.parse(new TextDecoder().decode(payload));if(d.type==='comment')liveComment((participant?.identity||'Viewer')+': '+d.text);if(d.type==='gift')liveComment('🎁 '+(participant?.name||'Someone')+' sent a gift!');if(d.type==='end'){room.disconnect();liveRoom=null;closeM();toast('The host ended this livestream')}}catch(e){}});
  room.on(LivekitClient.RoomEvent.ParticipantConnected,()=>{const s=$('#am-live-state');if(s)s.textContent='LIVE · '+(room.numParticipants)+' here'});
  room.on(LivekitClient.RoomEvent.ParticipantDisconnected,()=>{const s=$('#am-live-state');if(s)s.textContent='LIVE · '+(room.numParticipants)+' here'});
  room.on(LivekitClient.RoomEvent.Disconnected,()=>{const s=$('#am-live-state');if(s)s.textContent='Disconnected'});
  await room.connect(j.url,j.token);
  if(j.host){const cp=await room.localParticipant.setCameraEnabled(true);await room.localParticipant.setMicrophoneEnabled(true);if(cp?.track)attach(cp.track);}
  else {const s=$('#am-live-state');if(s)s.textContent='LIVE · watching';}
  const mic=$('#am-live-mic'),cam=$('#am-live-cam');let muted=false,camera=true;
  mic.onclick=async()=>{muted=!muted;await room.localParticipant.setMicrophoneEnabled(!muted);mic.textContent=muted?'Unmute mic':'Mute mic'};
  cam.onclick=async()=>{camera=!camera;await room.localParticipant.setCameraEnabled(camera);cam.textContent=camera?'Turn camera off':'Turn camera on'};
  $('#am-live-send').onclick=()=>{const input=$('#am-live-text'),text=(input?.value||'').trim();if(!text)return;livePublish('comment',{text:text.slice(0,180)});liveComment('You: '+text);input.value=''};

  $('#am-live-gift').dataset.a='gift';$('#am-live-gift').dataset.u=liveHostId;
  const leave=async(end)=>{if(end){livePublish('end',{});await new Promise(r=>setTimeout(r,250))}try{await room.disconnect()}catch(e){}liveRoom=null;if(end)await A('liveend',{room:roomName}).catch(()=>{});closeM()};
  if(j.host)$('#am-live-end').onclick=()=>leave(true);else $('#am-live-leave').onclick=()=>leave(false);
}

/* Amlink three-lane swipe navigation: Friends ⇄ For You ⇄ Reels. */
(()=>{
 const lanes=['people','feed','reels'];
 const syncLane=()=>document.querySelectorAll('.primary-swipe-nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 const originalGo=go;
 go=async function(t){const out=await originalGo(t);syncLane();return out};
 syncLane();
 let sx=0,sy=0,tracking=false;
 const main=document.getElementById('main');
 main.addEventListener('touchstart',e=>{
   if(!e.touches||e.touches.length!==1)return;
   const target=e.target;
   if(target.closest('input,textarea,button,a,.rl,.ms2,.pvg,.ch,.ms,.bar,.atb,.rt,[contenteditable="true"]')){tracking=false;return}
   if(!lanes.includes(tab))return;
   sx=e.touches[0].clientX;sy=e.touches[0].clientY;tracking=true;
 },{passive:true});
 main.addEventListener('touchend',e=>{
   if(!tracking||!e.changedTouches||!e.changedTouches.length)return;tracking=false;
   const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
   if(Math.abs(dx)<75||Math.abs(dx)<Math.abs(dy)*1.25)return;
   const i=lanes.indexOf(tab),next=dx<0?Math.min(lanes.length-1,i+1):Math.max(0,i-1);
   if(next!==i)go(lanes[next]);
 },{passive:true});
})();

// 2D arcade shooter: single-player, touch and keyboard controls, no weapons or real-world content.
function shooter(){
 main.innerHTML=`<div class="am-game-wrap"><div class="am-game-head"><button data-am="games-back">‹ Games</button><b>STAR DEFENDER · AIR COMBAT</b><b id="am-score">0</b></div><p class="am-sub">Pilot your jet. Blast incoming enemy aircraft. Hold FIRE for rapid shots, or move with the controls.</p><canvas id="am-shoot" class="am-game-canvas" aria-label="Jet aircraft arcade game"></canvas><div class="am-game-controls"><button id="am-left">◀ LEFT</button><button id="am-fire">FIRE ✦</button><button id="am-right">RIGHT ▶</button></div><div id="am-over" hidden></div></div>`;
 const c=$('#am-shoot'),ctx=c.getContext('2d'),scoreEl=$('#am-score');
 let W=0,H=0,score=0,lives=3,ship=0,shots=[],targets=[],keys={},running=false,last=0,spawn=0,fireClock=0,raf=0,dragging=false;
 const dpr=()=>Math.min(window.devicePixelRatio||1,2);
 function size(){const r=c.getBoundingClientRect(),d=dpr();W=r.width;H=r.height;c.width=Math.max(1,Math.round(W*d));c.height=Math.max(1,Math.round(H*d));ctx.setTransform(d,0,0,d,0,0);ship=Math.max(25,Math.min(W-25,ship||W/2));}
 size();const ro=new ResizeObserver(size);ro.observe(c);
 function jet(x,y,scale,enemy=false){ctx.save();ctx.translate(x,y);ctx.scale(scale*(enemy?-1:1),scale);ctx.lineJoin='round';
  // wings and tail
  ctx.fillStyle=enemy?'#ff6262':'#dcecff';ctx.strokeStyle=enemy?'#ffd0d0':'#ffffff';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(5,-5);ctx.lineTo(25,9);ctx.lineTo(23,15);ctx.lineTo(5,10);ctx.lineTo(4,22);ctx.lineTo(11,27);ctx.lineTo(10,31);ctx.lineTo(0,27);ctx.lineTo(-10,31);ctx.lineTo(-11,27);ctx.lineTo(-4,22);ctx.lineTo(-5,10);ctx.lineTo(-23,15);ctx.lineTo(-25,9);ctx.lineTo(-5,-5);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=enemy?'#5b1010':'#263d58';ctx.beginPath();ctx.ellipse(0,1,3.2,11,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=enemy?'#ffb1b1':'#68dfff';ctx.beginPath();ctx.ellipse(0,-8,2.4,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=enemy?'#ff9b35':'#55dfff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(-4,24);ctx.lineTo(0,37+Math.random()*4);ctx.lineTo(4,24);ctx.closePath();ctx.fill();ctx.restore();
 }
 function bullet(b){ctx.save();ctx.shadowColor='#48eaff';ctx.shadowBlur=15;ctx.fillStyle='#eaffff';ctx.fillRect(b.x-2.2,b.y-12,4.4,19);ctx.fillStyle='#37cfff';ctx.fillRect(b.x-1,b.y-18,2,8);ctx.restore();}
 function reset(){cancelAnimationFrame(raf);score=0;lives=3;shots=[];targets=[];spawn=0;fireClock=0;running=true;keys={};scoreEl.textContent='0';$('#am-over').hidden=true;last=performance.now();raf=requestAnimationFrame(loop)}
 function fire(){if(running&&shots.length<32)shots.push({x:ship,y:H-62});}
 function loop(t){if(!running)return;const dt=Math.min((t-last)/16.67,2.2);last=t;ctx.clearRect(0,0,W,H);
  // Deep-space backdrop and moving starfield
  const bg=ctx.createRadialGradient(W*.5,H*.55,5,W*.5,H*.55,Math.max(W,H)*.75);bg.addColorStop(0,'#182536');bg.addColorStop(1,'#02050b');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(let i=0;i<65;i++){const x=(i*97+Math.sin(i*8)*17)%W,y=(i*149+t*(.018+(i%4)*.008))%(H+4);ctx.fillStyle=i%7===0?'#9feaff':'#d8e8ff';ctx.globalAlpha=.35+(i%5)*.12;ctx.fillRect(x,y,i%7===0?2:1, i%7===0?3:1)}ctx.globalAlpha=1;
  if(keys.left)ship-=6.2*dt;if(keys.right)ship+=6.2*dt;ship=Math.max(25,Math.min(W-25,ship));
  if(keys.fire){fireClock+=dt;if(fireClock>7){fire();fireClock=0}}else fireClock=0;
  spawn+=dt;if(spawn>43){spawn=0;const x=30+Math.random()*Math.max(1,W-60);targets.push({x,y:-36,hp:1,s:1.05+Math.random()*1.15,scale:.78+Math.random()*.22});if(score>100&&Math.random()>.68)targets.push({x:Math.max(25,Math.min(W-25,x+(Math.random()>.5?1:-1)*42)),y:-72,hp:1,s:1.25,scale:.7})}
  shots.forEach(b=>b.y-=11*dt);shots=shots.filter(b=>b.y>-25);
  targets.forEach(a=>a.y+=a.s*dt);
  // Render clearly visible energy rounds over the background
  shots.forEach(bullet);
  for(let i=targets.length-1;i>=0;i--){const a=targets[i];jet(a.x,a.y,a.scale,true);
   for(let j=shots.length-1;j>=0;j--){if(Math.hypot(a.x-shots[j].x,a.y-shots[j].y)<18*a.scale){targets.splice(i,1);shots.splice(j,1);score+=10;scoreEl.textContent=score;break}}
   if(a.y>H-42){targets.splice(i,1);lives--;if(lives<=0){running=false;$('#am-over').hidden=false;$('#am-over').innerHTML=`<b>Mission ended · ${score} points</b><button id="am-restart">↻ Fly again</button>`;$('#am-restart').onclick=reset}}
  }
  // Player jet and cockpit highlights
  jet(ship,H-48,1.08,false);
  ctx.fillStyle='#fff';ctx.font='700 14px system-ui';ctx.fillText('HULL: '+lives,14,23);ctx.textAlign='right';ctx.fillText('SCORE '+score,W-14,23);ctx.textAlign='left';
  if(running)raf=requestAnimationFrame(loop);
 }
 function hold(id,k){const b=$(id);const down=e=>{e.preventDefault();keys[k]=true;if(k==='fire')fire()};const up=e=>{if(e)e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',down);['pointerup','pointerleave','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,up));}
 hold('#am-left','left');hold('#am-right','right');hold('#am-fire','fire');
 c.addEventListener('pointerdown',e=>{dragging=true;c.setPointerCapture?.(e.pointerId);const r=c.getBoundingClientRect();ship=e.clientX-r.left;fire()});
 c.addEventListener('pointermove',e=>{if(dragging){const r=c.getBoundingClientRect();ship=e.clientX-r.left}});
 ['pointerup','pointercancel','lostpointercapture'].forEach(n=>c.addEventListener(n,()=>dragging=false));
 function keyDown(e){if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.code==='Space'){e.preventDefault();keys.fire=true;fire()}}
 function keyUp(e){if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;if(e.code==='Space')keys.fire=false}
 window.addEventListener('keydown',keyDown);window.addEventListener('keyup',keyUp);
 const oldBack=()=>{running=false;cancelAnimationFrame(raf);ro.disconnect();window.removeEventListener('keydown',keyDown);window.removeEventListener('keyup',keyUp);go('games')};
 document.querySelector('[data-am="games-back"]').onclick=oldBack;reset();
}

<script>

const nsetOld=nset;
nset=async function(){
  const j=await A('nsget');let sounds={};try{sounds=await A('notificationsounds')||{}}catch(e){}
  const row=(k,t,s,on)=>`<div class="row"><div>${t}<small>${s}</small></div><label class="sw"><input type="checkbox" data-a="nst" data-k="${k}"${on?' checked':''}><span></span></label></div>`;
  const cats=[['default','Default alerts'],['messages','Messages'],['social','Likes and comments'],['followers','New followers'],['live','Live events'],['games','Game invitations'],['communities','Community activity']];
  const opts=[['default','Amlink default'],['chime','Chime'],['soft','Soft'],['pulse','Pulse'],['bell','Bell'],['off','Off']];
  modal('<h3>Notifications & sounds</h3><p class="sub">Choose what Amlink alerts you about and preview a tone before saving. Safety and account notices stay enabled.</p>'+row('likes','Likes and reactions','Likes on your posts',!j.Off.likes)+row('comments','Comments and replies','On your posts and comments',!j.Off.comments)+row('follows','Follows and requests','New followers and requests',!j.Off.follows)+row('messages','Message alerts','New private messages',!j.Off.messages)+row('mentions','Mentions','When someone tags you',!j.Off.mentions)+row('reposts','Reposts','When someone shares your post',!j.Off.reposts)+'<p class="sg">Notification sounds</p>'+cats.map(([k,t])=>`<div class="row"><div>${t}<small>Choose a sound for this category</small></div><select data-sound="${k}" style="max-width:145px;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg)">${opts.map(([v,l])=>`<option value="${v}" ${(sounds[k]||'default')===v?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')+'<button class="pri" id="am-sound-preview">Preview selected sound</button><p class="sub">Sound choices are saved to your Amlink account and apply to in-app alerts where supported. Browser and Android system push sounds are controlled by device/browser notification settings.</p><p class="sg">Privacy</p>'+row('RR','Read receipts','Show ✓✓ when you read messages',j.RR));
  const play=tone=>{if(tone==='off')return toast('Sounds are turned off for this category');try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return toast('Audio preview is not supported');const c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);const f={default:660,chime:880,soft:440,pulse:520,bell:990}[tone]||660;o.frequency.value=f;o.type=tone==='pulse'?'square':'sine';g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.12,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.28);o.start();o.stop(c.currentTime+.3);o.onended=()=>c.close()}catch(e){toast('Could not play preview')}};
  $('#am-sound-preview').onclick=()=>{const tone=document.querySelector('[data-sound="default"]')?.value||'default';play(tone)};
  document.querySelectorAll('[data-sound]').forEach(sel=>sel.onchange=async()=>{try{await A('notificationsounds',{category:sel.dataset.sound,tone:sel.value});play(sel.value);toast('Sound preference saved')}catch(e){toast(e.message)}});
};

 let groups=[];try{groups=await A('comms')}catch(e){toast(e.message)}
 amPage('Communities','Discover your people, build a space, and keep the conversation moving.',
 `<section class="am-community-hero"><small>AMLINK COMMUNITIES</small><h2>Find your people.</h2><p>Build groups around ideas, interests, learning, games and creativity.</p><button class="pri" id="am-new-group">＋ Create community</button></section>

 <div class="am-comm-tabs"><button class="on" data-comm-scope="discover">Discover</button><button data-comm-scope="joined">My communities</button></div>
 <div id="am-groups" class="am-community-grid"></div>`);

 $('#am-new-group').onclick=()=>{modal(`<h3>Create your community</h3><p class="sub">Give members a clear reason to join. You can update these details later.</p><label class="fl2">Community name<input id="am-c-name" maxlength="40" placeholder="e.g. Amlink Creators"></label><label class="fl2">Category<select id="am-c-category">${AM_COMM_CATS.slice(1).map(x=>`<option>${x}</option>`).join('')}</select></label><label class="fl2">Description<textarea id="am-c-desc" maxlength="200" placeholder="What will members share or discuss?"></textarea></label><label class="fl2">Topics / tags<input id="am-c-tags" maxlength="240" placeholder="design, coding, football"></label><label class="fl2">Welcome message<textarea id="am-c-welcome" maxlength="300" placeholder="Welcome new members…"></textarea></label><label class="fl2">Community rules<textarea id="am-c-rules" maxlength="500" placeholder="Be respectful. Keep discussions relevant…"></textarea></label><p class="er" id="am-c-error"></p><button class="pri" id="am-c-create">Create community</button><button class="ed" id="am-c-cancel">Cancel</button>`);$('#am-c-cancel').onclick=closeM;$('#am-c-create').onclick=async()=>{const b=$('#am-c-create');b.disabled=true;try{await A('commcreate',{name:$('#am-c-name').value.trim(),desc:$('#am-c-desc').value.trim(),rules:$('#am-c-rules').value.trim(),category:$('#am-c-category').value,tags:$('#am-c-tags').value.trim(),welcome:$('#am-c-welcome').value.trim()});closeM();groups=await A('comms');scope='joined';draw();toast('Community created — welcome aboard!')}catch(e){$('#am-c-error').textContent=e.message;b.disabled=false}}};
 $('#am-groups').onclick=async e=>{const open=e.target.closest('[data-open-community]'),join=e.target.closest('[data-join-community]');if(open){await openCommunity(open.dataset.openCommunity);return}if(join){try{await A('commjoin',{id:join.dataset.joinCommunity});groups=await A('comms');draw()}catch(err){toast(err.message)}}};draw();
}
async function openCommunity(id){
 let c;try{c=await A('comm?id='+encodeURIComponent(id))}catch(e){toast(e.message);return}
 let election=null;try{election=await A('commelection?id='+encodeURIComponent(id))}catch(e){}
 const member=!!c.Joined,mod=!!c.Mod;let feed=[...(c.Posts||[])];
 const render=()=>{
  const pinned=feed.find(p=>p.ID===c.Pinned),ordered=feed.filter(p=>p.ID!==c.Pinned);if(pinned)ordered.unshift(pinned);
  amPage(c.Name,'Community space · share ideas, ask questions and build together.',
  `<button class="ed" id="am-comm-back">‹ All communities</button><header class="am-comm-detail-head"><div class="am-comm-cover-label">AMLINK COMMUNITY · ${amEsc(c.Category||'GENERAL')}</div><h2>${amEsc(c.Name)}</h2><p>${amEsc(c.Desc||'A place to connect and share.')}</p><div class="am-comm-stat"><span>♧ ${c.N||0} members</span><span>${mod?(c.Owner?'Owner':'Moderator'):member?'Member':'Public community'}</span><span>${amEsc(c.Tags||'Community')}</span></div><div class="am-comm-actions" style="margin-top:13px">${member?'':`<button class="pri" id="am-comm-join">Join community</button>`}${member&&!c.Owner?'<button class="ed" id="am-comm-leave">Leave</button>':''}${mod?'<button class="ed" id="am-comm-manage">⚙ Manage</button><button class="ed" id="am-comm-members">♧ Members</button>':''}<button class="ed" id="am-comm-rules">Community rules</button></div></header>
  ${c.Announcement?`<section class="am-comm-announcement am-comm-announcement-large"><b>📢 Community announcement</b><p>${amEsc(c.Announcement)}</p></section>`:''}
  ${c.Welcome?`<section class="am-comm-welcome"><b>Welcome message</b><p>${amEsc(c.Welcome)}</p></section>`:''}
  <section id="am-election-panel"></section>
  ${member?`<section class="am-comm-compose"><div class="am-comm-compose-title"><b>Start a discussion</b><small>Share an update with ${amEsc(c.Name)}</small></div><textarea id="am-comm-text" maxlength="2000" placeholder="What would you like the community to know?"></textarea><label class="fb" style="display:inline-flex;margin-top:8px">📷 Add photos or a video<input id="am-comm-files" type="file" accept="image/*,video/*" multiple hidden></label><div class="pvg" id="am-comm-preview"></div><div class="am-comm-compose-foot"><small>Keep it useful and respectful · 2,000 characters max</small><button class="pri" id="am-comm-publish">Publish post</button></div></section>`:'<section class="am-comm-join-note"><b>Join the conversation</b><p>Become a member to publish posts, vote in community elections and connect with other members.</p></section>'}
  <div class="am-comm-feed-head"><h3>Community discussions</h3><span>${feed.length} posts</span></div><div id="am-comm-feed">${ordered.map(p=>`<div class="${p.ID===c.Pinned?'am-pinned-post':''}">${p.ID===c.Pinned?'<div class="am-pinned-label">📌 Pinned by moderators</div>':''}${postH(p)}${mod?`<div class="am-comm-post-tools"><button class="ed" data-comm-pin="${amEsc(p.ID)}">${p.ID===c.Pinned?'Unpin post':'Pin post'}</button>${p.U?.ID!==ME.ID?`<button class="ed" data-comm-remove="${amEsc(p.ID)}">Remove post</button>`:''}</div>`:''}</div>`).join('')||'<div class="am-comm-empty"><b>It starts here.</b><p>No discussions yet. Be the first to share something useful.</p></div>'}</div>`);
  $('#am-comm-back').onclick=communitiesPage;
  $('#am-comm-join')?.addEventListener('click',async()=>{try{await A('commjoin',{id});await openCommunity(id)}catch(e){toast(e.message)}});
  $('#am-comm-leave')?.addEventListener('click',async()=>{if(!confirm('Leave this community?'))return;try{await A('commjoin',{id});communitiesPage()}catch(e){toast(e.message)}});
  $('#am-comm-rules').onclick=()=>modal(`<h3>Community rules</h3><p class="am-rule-copy">${amEsc(c.Rules||'The owner has not added community rules yet.')}</p><button class="pri" id="am-rule-close">Close</button>`),$('#am-rule-close').onclick=closeM;
  XF=[];
  $('#am-comm-files')?.addEventListener('change',e=>{XF=[...XF,...e.target.files].slice(0,10);e.target.value='';const box=$('#am-comm-preview');if(box)box.innerHTML=XF.map((f,i)=>`<div class="pvi">${f.type.startsWith('video')?`<video src="${URL.createObjectURL(f)}#t=0.1" muted playsinline></video>`:`<img src="${URL.createObjectURL(f)}" alt="">`}<button type="button" data-am-file-remove="${i}">✕</button></div>`).join('')});
  $('#am-comm-preview')?.addEventListener('click',e=>{const b=e.target.closest('[data-am-file-remove]');if(!b)return;XF.splice(Number(b.dataset.amFileRemove),1);$('#am-comm-preview').innerHTML=XF.map((f,i)=>`<div class="pvi">${f.type.startsWith('video')?`<video src="${URL.createObjectURL(f)}#t=0.1" muted playsinline></video>`:`<img src="${URL.createObjectURL(f)}" alt="">`}<button type="button" data-am-file-remove="${i}">✕</button></div>`).join('')});
  $('#am-comm-publish')?.addEventListener('click',async()=>{const text=$('#am-comm-text').value.trim(),b=$('#am-comm-publish');if(!text&&!XF.length)return toast('Write something or add media');if(XF.length>1&&XF.some(f=>!f.type.startsWith('image')))return toast('Several files must all be photos');b.disabled=true;try{const urls=[];for(let i=0;i<XF.length;i++){b.textContent=`Uploading ${i+1}/${XF.length}…`;urls.push(await up(XF[i]))}b.textContent='Publishing…';await A('commpost',{id,text,media:urls.join(','),kind:XF[0]?(XF[0].type.startsWith('video')?'video':'image'):''});toast('Posted to community');await openCommunity(id)}catch(e){toast(e.message);b.disabled=false;b.textContent='Publish post'}});
  $('#am-comm-manage')?.addEventListener('click',()=>modal(`<h3>Community settings</h3><label class="fl2">Name<input id="am-edit-name" maxlength="40" value="${amEsc(c.Name)}"></label><label class="fl2">Category<select id="am-edit-category">${AM_COMM_CATS.slice(1).map(x=>`<option ${x===(c.Category||'General')?'selected':''}>${x}</option>`).join('')}</select></label><label class="fl2">Description<textarea id="am-edit-desc" maxlength="200">${amEsc(c.Desc||'')}</textarea></label><label class="fl2">Topics / tags<input id="am-edit-tags" maxlength="240" value="${amEsc(c.Tags||'')}"></label><label class="fl2">Welcome message<textarea id="am-edit-welcome" maxlength="300">${amEsc(c.Welcome||'')}</textarea></label><label class="fl2">Rules<textarea id="am-edit-rules" maxlength="500">${amEsc(c.Rules||'')}</textarea></label><button class="pri" id="am-edit-save">Save settings</button><hr><label class="fl2">Announcement<textarea id="am-edit-announcement" maxlength="500" placeholder="Share an important update…">${amEsc(c.Announcement||'')}</textarea></label><button class="ed" id="am-announcement-save">Publish announcement</button>${c.Owner?'<button class="dl" id="am-comm-delete">Delete community</button>':''}`));
  $('#am-comm-members')?.addEventListener('click',()=>{const members=c.M||[];modal(`<h3>Community members · ${members.length}</h3><div class="am-comm-member-list">${members.map(m=>`<div class="am-comm-member">${AV(m.U)}<div><b>${nm(m.U)}</b><small>${amEsc(m.Role)}</small></div>${c.Owner&&m.Role!=='owner'?`<button class="ed" data-member-role="${amEsc(m.U.ID)}">${m.Role==='mod'?'Remove mod':'Make mod'}</button>`:''}${mod&&m.Role!=='owner'&&m.U.ID!==ME.ID?`<button class="dl" data-member-kick="${amEsc(m.U.ID)}">Remove</button>`:''}</div>`).join('')||'<p>No members found.</p>'}</div>`)});
  $('#am-comm-feed')?.addEventListener('click',async e=>{const pin=e.target.closest('[data-comm-pin]'),remove=e.target.closest('[data-comm-remove]');try{if(pin){await A('commact',{id,op:pin.dataset.commPin===c.Pinned?'unpin':'pin',post:pin.dataset.commPin});await openCommunity(id)}if(remove&&confirm('Remove this post from the community?')){await A('delpost',{id:remove.dataset.commRemove});await openCommunity(id)}}catch(err){toast(err.message)}});
  const ep=$('#am-election-panel');if(election&&ep){const president=election.President;ep.innerHTML=`<section class="am-election"><div class="am-election-head"><div><small>COMMUNITY GOVERNANCE</small><h3>♛ Member election</h3></div><span>${amEsc(election.Period||'This month')}</span></div><p class="am-election-note">Members can nominate eligible candidates and vote for a representative.</p><div class="am-election-president">${president?.Username?'@'+amEsc(president.Username):'No president elected yet'}</div>${member?`<p class="am-election-note">Your eligibility: ${election.Followers||0}/100 followers · ${election.Engagement||0}/500 engagement points.</p>${election.CanNominate?'<button class="pri" id="am-comm-nominate">Nominate myself</button>':!election.Eligible?'<p class="am-election-note">Meet the eligibility requirements to nominate.</p>':election.Candidates?.some(x=>x.U?.ID===ME.ID)?'<p class="am-election-note">You are already nominated this month.</p>':''}`:'<p class="am-election-note">Join to participate in elections.</p>'}<div id="am-election-candidates">${(election.Candidates||[]).map(x=>`<div class="am-election-row"><div class="am-el-person">${AV(x.U)}<span><b>${amEsc(x.U?.Username||'Member')}</b><small style="display:block;color:var(--mut)">${x.Votes||0} votes</small></span></div>${member&&x.U?.ID!==ME.ID?`<button data-election-vote="${amEsc(x.U?.ID||'')}" ${election.MyVote===x.U?.ID?'disabled':''}>${election.MyVote===x.U?.ID?'Your vote':'Vote'}</button>`:''}</div>`).join('')||'<p class="am-election-note">No candidates yet.</p>'}</div></section>`;
   $('#am-comm-nominate')?.addEventListener('click',async()=>{try{await A('commelection',{id,op:'nominate'});toast('You are nominated');await openCommunity(id)}catch(e){toast(e.message)}});
   ep.querySelectorAll('[data-election-vote]').forEach(b=>b.onclick=async()=>{try{await A('commelection',{id,op:'vote',candidate:b.dataset.electionVote});toast('Vote recorded');await openCommunity(id)}catch(e){toast(e.message)}});
  }
 };
 render();
 // Settings and member actions are delegated because their dialogs are created dynamically.
 if(window.AM_COMM_DIALOG_HANDLER)document.removeEventListener('click',window.AM_COMM_DIALOG_HANDLER);
 window.AM_COMM_DIALOG_HANDLER=async function communityDialogActions(e){const b=e.target.closest('#am-edit-save,#am-announcement-save,#am-comm-delete,[data-member-role],[data-member-kick]');if(!b)return;try{
  if(b.id==='am-edit-save'){await A('commact',{id,op:'edit',name:$('#am-edit-name').value.trim(),category:$('#am-edit-category').value,desc:$('#am-edit-desc').value.trim(),tags:$('#am-edit-tags').value.trim(),welcome:$('#am-edit-welcome').value.trim(),rules:$('#am-edit-rules').value.trim()});closeM();toast('Community settings saved');await openCommunity(id)}
  else if(b.id==='am-announcement-save'){await A('commact',{id,op:'announce',text:$('#am-edit-announcement').value.trim()});closeM();toast('Announcement updated');await openCommunity(id)}
  else if(b.id==='am-comm-delete'){if(confirm('Delete this community and its community posts?')){await A('commact',{id,op:'del'});closeM();communitiesPage()}}
  else if(b.dataset.memberRole){await A('commact',{id,op:'mod',uid:b.dataset.memberRole});await openCommunity(id)}
  else if(b.dataset.memberKick){if(confirm('Remove this member from the community?')){await A('commact',{id,op:'kick',uid:b.dataset.memberKick});await openCommunity(id)}}
 }catch(err){toast(err.message)}
 };document.addEventListener('click',window.AM_COMM_DIALOG_HANDLER);
}

<script>
/* Amlink 3D arcade: lightweight solo runs + asynchronous multiplayer score competition. */
(()=>{
 const games=[
  {id:'streetracer',name:'Amlink Street Racer',icon:'🏎️',desc:'Drive a supercar through a 3D city, dodge traffic and set a record.',mode:'Avoid traffic and build distance.'},
  {id:'skyparkour',name:'Sky Parkour',icon:'🏃',desc:'Jump across floating platforms above the clouds.',mode:'Time your jumps and reach as many platforms as possible.'},
  {id:'lostisland',name:'Lost Island',icon:'🏝️',desc:'Explore a 3D island, collect crystals and discover hidden places.',mode:'Explore and collect as many crystals as you can.'},
  {id:'neonrunner',name:'Neon Runner',icon:'🌌',desc:'Sprint through a futuristic neon track and avoid barriers.',mode:'Switch lanes, dodge barriers and beat your distance record.'}
 ];
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 window.X3D_HOME=()=>`<section style="padding:12px"><div class="rpc" style="margin-bottom:12px"><b>🌐 Amlink 3D Worlds</b><p class="am-sub">Play solo, race live with up to three other players, or compete for global records.</p><small>Top player in each game receives the live 🥇 Top 1 badge.</small><div class="gcb" style="margin-top:10px"><button class="pri" data-a="am3d-roomlist">🌐 Find live rooms</button><button class="ed" data-a="am3d-roomjoin">🔑 Join with code</button></div></div><div class="am-feature-grid">${games.map(g=>`<article class="rpc am-feature-card"><div style="font-size:30px">${g.icon}</div><b>${g.name}</b><small>${g.desc}</small><button class="pri" data-a="am3d" data-g="${g.id}">▶ Solo play</button><button class="ed" data-a="am3d-roomcreate" data-g="${g.id}">👥 Create live room</button><button class="ed" data-a="am3drank" data-g="${g.id}">🏆 Leaderboard</button></article>`).join('')}</div><div class="rpc" style="margin-top:12px"><b>🛍 3D Garage & cosmetics</b><p class="am-sub">Unlock visual game skins with Ran Coins. Prices are shown before purchase; no random loot boxes.</p><button class="ed" data-a="shop">Open Shop</button></div></section>`;
 const origGbody=window.gbody;
 if(typeof origGbody==='function')window.gbody=async function(){await origGbody();if(window.GT==='3d'||typeof GT!=='undefined'&&GT==='3d'){const box=document.querySelector('#gbody');if(box)box.innerHTML=window.X3D_HOME()}};
 document.addEventListener('click',e=>{
  const play=e.target.closest('[data-a="am3d"]'),rank=e.target.closest('[data-a="am3drank"]'),create=e.target.closest('[data-a="am3d-roomcreate"]'),browse=e.target.closest('[data-a="am3d-roomlist"]'),join=e.target.closest('[data-a="am3d-roomjoin"]');
  if(play){e.preventDefault();launch(play.dataset.g)}
  if(rank){e.preventDefault();leaderboard(rank.dataset.g)}
  if(create){e.preventDefault();createRoom(create.dataset.g)}
  if(browse){e.preventDefault();browseRooms()}
  if(join){e.preventDefault();modal('<h3>Join a live room</h3><p class="sub">Enter the six-character room code.</p><input id="am3d-code" class="amx-dialog-input" maxlength="6" autocomplete="off" placeholder="ABC123"><button class="amx-action amx-primary" id="am3d-code-go">Join room</button>');document.getElementById('am3d-code-go').onclick=()=>{const code=document.getElementById('am3d-code').value.trim().toUpperCase();if(code.length!==6){toast('Enter a valid six-character code');return}joinRoom(code)}}
 });
 async function leaderboard(id){
  try{let scope='all';const title=games.find(x=>x.id===id)?.name||id;let rows=await A('gboard?g='+encodeURIComponent(id));const htmlHead=`<h3>🏆 ${esc(title)} leaderboard</h3><p class="sub">Top 1 earns the current 🥇 badge. Players compete asynchronously using shared rankings.</p><div class="atb"><button id="am3d-all" class="on">🌍 Everyone</button><button id="am3d-friends">👥 Following</button></div>`;const draw=rows=>{const box=document.querySelector('#md .box');if(!box)return;let list=box.querySelector('#am3d-ranks');if(!list){box.insertAdjacentHTML('beforeend','<div id="am3d-ranks"></div>');list=box.querySelector('#am3d-ranks')}list.innerHTML=(rows.map((r,i)=>`<div class="pr"><b>${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</b>${AV(r.U)}<div class="nm">${esc(r.U.Username||'Player')}</div><b>${Number(r.V).toLocaleString()}</b></div>`).join('')||'<p class="empty">No scores yet. Be the first to set a record.</p>')};modal(htmlHead);draw(rows);document.getElementById('am3d-all').onclick=async()=>{scope='all';document.getElementById('am3d-all').classList.add('on');document.getElementById('am3d-friends').classList.remove('on');draw(await A('gboard?g='+encodeURIComponent(id)))};document.getElementById('am3d-friends').onclick=async()=>{scope='friends';document.getElementById('am3d-friends').classList.add('on');document.getElementById('am3d-all').classList.remove('on');draw(await A('gboard?g='+encodeURIComponent(id)+'&f=1'))}}catch(err){toast(err.message)}
 }
 async function createRoom(game){try{const room=await A('roomcreate',{game});roomLobby(room)}catch(e){toast(e.message)}}
 async function joinRoom(code){try{const room=await A('roomjoin',{code});roomLobby(room)}catch(e){toast(e.message)}}
 async function browseRooms(){
  try{const rows=await A('roomlist');const html=`<h3>🌐 Live multiplayer rooms</h3><p class="sub">Join a waiting room. Each room supports up to four players.</p><div id="am3d-room-list"></div>`;modal(html);const box=document.getElementById('am3d-room-list');box.innerHTML=rows.map(r=>`<div class="pr"><div class="nm"><b>${esc(games.find(g=>g.id===r.Game)?.name||r.Game)}</b><br><small>${r.Players.length}/4 players · Room ${esc(r.Code)}</small></div><button class="ed" data-roomjoin="${esc(r.Code)}">Join</button></div>`).join('')||'<p class="empty">No open rooms right now. Create one and invite friends.</p>';box.onclick=e=>{const b=e.target.closest('[data-roomjoin]');if(b)joinRoom(b.dataset.roomjoin)}}catch(e){toast(e.message)}
 }
 function roomLobby(initial){
  let room=initial,poll=null,closed=false;
  const render=()=>{const g=games.find(x=>x.id===room.Game);const box=document.querySelector('#md .box');if(!box)return;box.innerHTML=`<div class="am3d-head"><div><small>AMLINK LIVE MULTIPLAYER</small><h3>${g?.icon||'🎮'} ${esc(g?.name||room.Game)}</h3></div><button class="ed" id="am3d-room-close">Leave</button></div><div class="rpc"><small>ROOM CODE</small><h2 style="letter-spacing:5px">${esc(room.Code)}</h2><p class="sub">Share this code with friends. Up to four players can join.</p></div><p class="sub">Status: <b>${esc(room.Status)}</b> ${room.Status==='countdown'?'· Race starting…':''}</p><div id="am3d-room-players">${room.Players.map(p=>`<div class="pr">${AV(p.U)}<div class="nm">${nm(p.U)}<br><small>${p.U.ID===room.Host?'Host · ':''}${p.Ready?'Ready':'Not ready'}</small></div>${p.Ready?'✅':'⌛'}</div>`).join('')}</div><div class="gcb"><button class="pri" id="am3d-room-ready">I'm ready</button>${room.Host===ME.ID?'<button class="ed" id="am3d-room-start">Start race</button>':''}</div><small class="sub">The host can start when at least two players have joined and everyone is ready.</small>`;
   document.getElementById('am3d-room-close').onclick=async()=>{closed=true;clearInterval(poll);try{await A('roomleave',{id:room.ID})}catch(e){}closeM()};
   document.getElementById('am3d-room-ready').onclick=async()=>{try{room=await A('roomready',{id:room.ID});render()}catch(e){toast(e.message)}};
   document.getElementById('am3d-room-start')?.addEventListener('click',async()=>{try{room=await A('roomstart',{id:room.ID});render()}catch(e){toast(e.message)}});
  };
  render();poll=setInterval(async()=>{if(closed)return;try{room=await A('roomstate?id='+encodeURIComponent(room.ID));if(room.Status==='racing'){closed=true;clearInterval(poll);launch(room.Game,room.ID,true);return}if(room.Status==='finished'){closed=true;clearInterval(poll);const box=document.querySelector('#md .box');if(box)box.innerHTML='<h3>Room ended</h3><p class="sub">This room is no longer active.</p><button class="pri" onclick="closeM()">Close</button>';return}render()}catch(e){closed=true;clearInterval(poll);toast(e.message)}},1000);
 }

 const troops=[['spearmen','🛡️','Spearmen',3],['swordsmen','⚔️','Swordsmen',4],['archers','🏹','Archers',3],['knights','🐎','Knights',6],['guards','🏰','Shield guards',5]];
 let empireAudio=null;function empireSound(kind='clash'){try{empireAudio=empireAudio||new(window.AudioContext||window.webkitAudioContext)();if(empireAudio.state==='suspended')empireAudio.resume();const o=empireAudio.createOscillator(),g=empireAudio.createGain(),t=empireAudio.currentTime;o.type=kind==='clash'?'sawtooth':'triangle';o.frequency.setValueAtTime(kind==='clash'?145:kind==='recruit'?480:320,t);o.frequency.exponentialRampToValueAtTime(kind==='clash'?58:180,t+.28);g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(empireAudio.destination);o.start(t);o.stop(t+.31)}catch(e){}}
 function empireBattle(initial){
  let g=initial,interval,lastVersion=Number(initial.Version||initial.Updated||0),closed=false,deployLane=0;
  const draw=()=>{
   const me=g.Me||ME?.ID, rival=g.Host===me?g.Opponent:g.Host;
   const mine=(g.Army||{})[me]||{},enemy=(g.Army||{})[rival]||{};

   const box=$('#md .box');if(!box)return;
   const unitSet=(army,side)=>{const defs=[['spearmen','🛡️'],['swordsmen','⚔️'],['archers','🏹'],['knights','🐎'],['guards','🏰']];let out='';defs.forEach(([k,ico])=>{const n=Math.min(2,Number(army[k]||0));for(let i=0;i<n;i++)out+=`<span class="empire-unit ${side}" aria-hidden="true">${ico}</span>`});return out};
   const liveSet=()=> (g.LiveUnits||[]).filter(u=>Number(u.hp)>0).map(u=>{const left=Math.max(3,Math.min(97,50+(Number(u.x)||0)*2.0)),top=Math.max(12,Math.min(88,50+(Number(u.z)||0)*2.7));const ico=({spearmen:'🛡️',swordsmen:'⚔️',archers:'🏹',knights:'🐎',guards:'🏰'})[u.type]||'⚔️';return `<span class="empire-live-unit team-${Number(u.team)||0}" style="left:${left}%;top:${top}%" title="${esc(u.type)} · ${Number(u.hp)||0} HP">${ico}</span>`}).join('');
   const total=a=>Object.values(a).reduce((x,y)=>x+Number(y||0),0);
   let note=g.Status==='waiting'?'Your kingdom is ready. Share the room code below, or use Find battle on another account to join. The raid starts when a rival joins.':g.Status==='finished'?'Raid complete. See the battle log for the result.':'Recruit and deploy troops. Your armies move and fight continuously while the raid is active.';
   box.innerHTML=`<div class="amx-card empire-cinematic" style="text-align:center;background:radial-gradient(circle at 50% 10%,#526d9a,#151b2a 55%,#090b12)">
    <small>AMLINK STRATEGY ARENA</small><h2 style="font-size:34px;letter-spacing:.08em">EMPIRE</h2>
    <p>Room ${esc(g.Code)} · ${g.Status==='waiting'?'WAITING FOR RIVAL':esc(g.Status.toUpperCase())} · Turn ${Number(g.Turn)||1}</p>
    <div class="empire-statusbar"><span>${g.Status==='waiting'?'KINGDOM LOBBY':'LIVE RAID'}</span><b>${g.Status==='waiting'?'INVITE A RIVAL':'REAL-TIME COMBAT'}</b><span>${g.Players||0}/2 PLAYERS</span></div>${g.Status==='waiting'?`<div class="empire-invite-box"><b>YOUR BATTLE CODE</b><strong>${esc(g.Code)}</strong><button class="amx-action amx-primary" data-empire-copy>Copy invite code</button><small>On the other account: Games → Empire → Join with code.</small></div>`:''}
    <div class="empire-battlefield" data-empire-mine="${esc(JSON.stringify(mine))}" data-empire-enemy="${esc(JSON.stringify(enemy))}" data-empire-turn="${Number(g.Turn)||1}" data-empire-live="${esc(JSON.stringify(g.LiveUnits||[]))}" aria-label="Interactive real-time 3D kingdom battlefield">
     <div class="empire-castle empire-castle-left"><span>♜</span><b>YOUR KEEP</b></div>
     <div class="empire-lane"><i>⚔</i><i>◆</i><i>⚔</i></div>
     <div class="empire-castle empire-castle-right"><span>♜</span><b>RIVAL KEEP</b></div>
     <div class="empire-units">${liveSet()}${(g.LiveUnits||[]).length? '':unitSet(mine,'left')+unitSet(enemy,'right')}</div>
    </div>
    <div class="amx-game-grid"><div><b>Your kingdom</b><p>❤️ ${g.HP?.[me]??100} health</p><p>🪙 ${g.Gold?.[me]??0} gold</p><p>Army: ${total(mine)}</p></div><div><b>Rival kingdom</b><p>❤️ ${g.HP?.[rival]??100} health</p><p>Army: ${total(enemy)}</p><p>${rivalSubmitted?'Tactic submitted':'Awaiting tactic'}</p></div></div>
   </div>
   <div class="empire-turn-note" role="status">${esc(note)}</div>
   <div class="amx-card"><h3>Recruit troops</h3><div class="amx-game-grid">${troops.map(([id,ico,n,c])=>`<div class="amx-card"><div style="font-size:26px">${ico}</div><b>${n}</b><small>${c} gold each · You: ${mine[id]||0}</small><button class="amx-action" data-empire-act="recruit" data-unit="${id}" ${g.Status!=='active'||mineSubmitted?'disabled':''}>Recruit 1</button></div>`).join('')}</div></div>
   <div class="amx-card"><h3>⚔️ Live troop deployment</h3><p class="sub">Choose a lane, then deploy recruited units. Troops move on the server, route around walls, engage enemies and damage the rival keep in real time.</p><div class="gcb"><button class="amx-action amx-primary" data-empire-lane="-1">North lane</button><button class="amx-action" data-empire-lane="0">Central gate</button><button class="amx-action" data-empire-lane="1">South lane</button></div><div class="amx-game-grid">${troops.map(([id,ico,n])=>`<div class="amx-card"><b>${ico} ${n}</b><small>Ready: ${mine[id]||0}</small><button class="amx-action amx-primary" data-empire-deploy="${id}" ${g.Status!=='active'||Number(mine[id]||0)<1?'disabled':''}>Deploy troop</button></div>`).join('')}</div><small class="sub">Deployed troops are committed to the raid. Defeated troops are not returned to your reserve.</small></div>
   <div class="amx-card"><h3>🏗️ Kingdom construction</h3><p class="sub">Upgrade your Town Hall, barracks, gold mine, walls and defences. Structures persist for this battle and affect defence and gold income.</p><div class="amx-game-grid">${[['town_hall','🏰','Town Hall',30],['barracks','⚔️','Barracks',12],['gold_mine','🪙','Gold Mine',10],['cannon','💥','Cannon',14],['archer_tower','🏹','Archer Tower',14],['wall','🧱','Wall',8]].map(([id,ico,label,cost])=>`<div class="amx-card"><b>${ico} ${label}</b><p>Level ${Number((g.Buildings||{})[me]?.[id]||0)} · Next upgrade ${cost*(Number((g.Buildings||{})[me]?.[id]||0)+1)} gold</p><button class="amx-action" data-empire-build="${id}" ${g.Status!=='active'||mineSubmitted?'disabled':''}>Upgrade</button></div>`).join('')}</div></div>
   <div class="amx-card"><b>Battle log</b><div>${(g.Log||[]).slice(-8).map(x=>`<p class="sub">${esc(x)}</p>`).join('')||'<p class="sub">Your kingdom awaits its rival.</p>'}</div><b>Room code: ${esc(g.Code)}</b></div>`;
   box.onclick=async e=>{const copy=e.target.closest('[data-empire-copy]');if(copy){try{await navigator.clipboard.writeText(g.Code);toast('Battle code copied')}catch(_){toast('Your battle code is '+g.Code)}return}const lane=e.target.closest('[data-empire-lane]');if(lane){deployLane=Number(lane.dataset.empireLane)||0;box.querySelectorAll('[data-empire-lane]').forEach(x=>x.classList.toggle('amx-primary',x===lane));return}const deploy=e.target.closest('[data-empire-deploy]');if(deploy&&!deploy.disabled){try{deploy.disabled=true;g=await A('empiredeploy',{id:g.ID,unit:deploy.dataset.empireDeploy,lane:String(deployLane)});empireSound('clash');lastVersion=Number(g.Updated||0);draw()}catch(err){toast(err.message);deploy.disabled=false}return}const build=e.target.closest('[data-empire-build]');if(build&&!build.disabled){try{build.disabled=true;g=await A('empireact',{id:g.ID,action:'build',building:build.dataset.empireBuild});empireSound('recruit');lastVersion=Number(g.Version||g.Updated||0);draw()}catch(err){toast(err.message);build.disabled=false}return}const b=e.target.closest('[data-empire-act]');if(!b||b.disabled)return;try{b.disabled=true;empireSound(b.dataset.empireAct==='attack'?'clash':'recruit');const oldTurn=Number(g.Turn||1);g=await A('empireact',{id:g.ID,action:b.dataset.empireAct,unit:b.dataset.unit||'',tactic:b.dataset.tactic||''});lastVersion=Number(g.Version||g.Updated||0);if(Number(g.Turn||1)>oldTurn)empireSound('clash');draw()}catch(err){toast(err.message);b.disabled=false}};
   lastVersion=Number(g.Version||g.Updated||lastVersion);
  };
  draw();
  interval=setInterval(async()=>{if(closed)return;try{const next=await A('empirestate?id='+encodeURIComponent(g.ID));const oldKey=JSON.stringify({HP:g.HP,Gold:g.Gold,Army:g.Army,Buildings:g.Buildings,LiveUnits:g.LiveUnits,Status:g.Status,Turn:g.Turn,Pending:g.Pending});const newKey=JSON.stringify({HP:next.HP,Gold:next.Gold,Army:next.Army,Buildings:next.Buildings,LiveUnits:next.LiveUnits,Status:next.Status,Turn:next.Turn,Pending:next.Pending});g=next;lastVersion=Number(g.Updated||0);const battleBox=document.querySelector('#md .box');const stage=battleBox?.querySelector('.empire-battlefield');if(stage){stage.dataset.empireLive=JSON.stringify(g.LiveUnits||[]);if(stage._empire3dUpdate)stage._empire3dUpdate();}if(oldKey!==newKey||next.Status!==initial.Status)draw();if(g.Status==='finished'){clearInterval(interval)}}catch(e){const note=document.querySelector('#md .empire-turn-note');if(note)note.textContent='Connection to the kingdom server was interrupted. Reconnecting…';console.warn('Empire state polling failed:',e)}},700);
  const close=$('#md .close');if(close)close.addEventListener('click',()=>{closed=true;clearInterval(interval)},{once:true});
  const mo=new MutationObserver(()=>{if($('#md')?.hidden){closed=true;clearInterval(interval);mo.disconnect()}});if($('#md'))mo.observe($('#md'),{attributes:true,attributeFilter:['hidden']});
 }
})();
</script>

<script>
/* Lost Island shared-world client. Voice is deliberately deferred. */
(()=>{
 const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let active=false;
 document.addEventListener('click',e=>{const b=e.target.closest('[data-a="am3d"][data-g="lostisland"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();lobby()},true);
 async function lobby(){let list=[];try{list=await A('islandlist')}catch(e){toast(e.message);return}
 modal(`<div class="am3d-head"><div><small>AMLINK SHARED WORLD</small><h3>🏝️ Lost Island</h3></div><button class="ed" id="li-close">Close</button></div><p class="sub">Explore a persistent island, gather resources and build with other players. Microphone chat is not included yet.</p><div class="amx-card"><h3>Create an island</h3><input id="li-name" class="amx-dialog-input" maxlength="32" placeholder="Island name"><label style="display:flex;gap:8px;margin:10px 0"><input type="checkbox" id="li-private"> Private island (invite code only)</label><button class="amx-action amx-primary" id="li-create">Create island</button></div><div class="amx-card"><h3>Join by invite code</h3><div style="display:flex;gap:8px"><input id="li-code" class="amx-dialog-input" placeholder="6-character code" maxlength="12"><button class="amx-action" id="li-join">Join</button></div></div><div class="amx-card"><h3>🌍 Public islands</h3><div id="li-list">${list.map(w=>`<div class="pr"><div class="nm"><b>${esc(w.Name)}</b><br><small>${w.Players||0}/30 online</small></div><button class="amx-action amx-primary" data-li-visit="${esc(w.Code)}">Visit</button></div>`).join('')||'<p class="empty">No active public islands yet. Create one to get started.</p>'}</div></div>`);
 const box=$('#md .box');$('#li-close').onclick=closeM;
 const join=async code=>{try{const w=await A('islandjoin',{code});play(w)}catch(e){toast(e.message)}};
 $('#li-create').onclick=async()=>{try{const w=await A('islandcreate',{name:$('#li-name').value.trim(),private:String($('#li-private').checked)});play(w)}catch(e){toast(e.message)}};
 $('#li-join').onclick=()=>join($('#li-code').value.trim());$('#li-list').onclick=e=>{const b=e.target.closest('[data-li-visit]');if(b)join(b.dataset.liVisit)};
 }
 async function play(initial){let w=initial,closed=false,interval=null,moveTimer=null,three=null,scene=null,cam=null,renderer=null,me=null,remote={},objects={},pos={x:(initial.Players.find(p=>p.U?.ID===ME.ID)?.X||0),z:(initial.Players.find(p=>p.U?.ID===ME.ID)?.Z||0)},selected='cabin',busy=false,fallbackDraw=null;
 const cost={cabin:'20 wood + 5 stone',house:'35 wood + 20 stone',farm:'15 wood + 5 stone',bridge:'25 wood + 10 stone',dock:'30 wood + 15 stone',village:'60 wood + 45 stone',decoration:'5 wood + 2 stone'};
 modal(`<div class="am3d-head"><div><small>SHARED ISLAND · ${esc(w.Name)}</small><h3>🏝️ ${esc(w.Name)}</h3></div><button class="ed" id="li-leave">Leave</button></div><div id="li-stage" style="height:100dvh;width:100%;overflow:hidden;background:#8bd2e8;position:absolute;inset:0"><div style="padding:30px;text-align:center">Loading island…</div></div><div class="amx-card"><b id="li-res"></b><p id="li-people" class="sub"></p></div><div class="amx-card"><b>Gather resources</b><div class="gcb"><button class="amx-action" data-li-gather="wood">🪵 Wood +5</button><button class="amx-action" data-li-gather="stone">🪨 Stone +5</button><button class="amx-action" data-li-gather="food">🥥 Food +5</button><button class="amx-action" data-li-gather="crystal">💎 Crystal +1</button></div></div><div class="amx-card"><b>Build on your island</b><div class="gcb" id="li-builds">${Object.keys(cost).map(k=>`<button class="amx-action ${k==='cabin'?'amx-primary':''}" data-li-build="${k}">${({cabin:'🛖 Cabin',house:'🏠 House',farm:'🌱 Farm',bridge:'🌉 Bridge',dock:'🛶 Dock',village:'🏘️ Village',decoration:'🌼 Decor'})[k]}</button>`).join('')}</div><p class="sub" id="li-cost">Cabin · ${cost.cabin}</p><button class="amx-action amx-primary" id="li-place">＋ Place nearby</button></div><div class="amx-card"><b>Move around</b><div class="gcb" style="justify-content:center"><button class="amx-action" data-li-move="up">▲</button></div><div class="gcb" style="justify-content:center"><button class="amx-action" data-li-move="left">◀</button><button class="amx-action" data-li-move="down">▼</button><button class="amx-action" data-li-move="right">▶</button></div><small class="sub">Keyboard: WASD or arrow keys. Up to 30 players per island.</small></div><p class="sub">Invite code: <b style="letter-spacing:3px">${esc(w.Code)}</b> · Your island progress is saved. Voice chat will be added later.</p>`);
 const box=$('#md .box'),stage=$('#li-stage');stage.insertAdjacentHTML('beforeend',`<div class="li-live-hud"><b>ISLAND EXPLORER</b><span id="li-mini-res">Loading resources…</span></div><div class="li-touch-pad"><button data-li-move="up" aria-label="Move forward">▲</button><div><button data-li-move="left" aria-label="Move left">◀</button><button data-li-move="down" aria-label="Move backward">▼</button><button data-li-move="right" aria-label="Move right">▶</button></div></div>`);
 const leave=async()=>{if(closed)return;closed=true;clearInterval(interval);clearInterval(moveTimer);window.removeEventListener('keydown',keys);try{await A('islandleave',{id:w.ID})}catch(e){}if(renderer){renderer.dispose()}closeM()};$('#li-leave').onclick=leave;
 function hud(){const r=w.Resources||{};if($('#li-mini-res'))$('#li-mini-res').textContent=`🪵 ${r.wood||0} · 🪨 ${r.stone||0} · 🥥 ${r.food||0} · 💎 ${r.crystal||0}`;$('#li-res').textContent=`🪵 ${r.wood||0}   🪨 ${r.stone||0}   🥥 ${r.food||0}   💎 ${r.crystal||0}   ⭐ ${w.Reputation||0}`;$('#li-people').textContent=`${(w.Players||[]).length} players currently on this island · ${(w.Builds||[]).length} shared buildings`}
 hud();
 $('#li-builds').onclick=e=>{const b=e.target.closest('[data-li-build]');if(!b)return;selected=b.dataset.liBuild;$('#li-cost').textContent=`${selected} · ${cost[selected]}`;$('#li-builds').querySelectorAll('button').forEach(x=>x.classList.toggle('amx-primary',x===b))};
 box.addEventListener('click',async e=>{const g=e.target.closest('[data-li-gather]');if(g){try{w=await A('islandgather',{id:w.ID,kind:g.dataset.liGather});hud()}catch(err){toast(err.message)}return}const m=e.target.closest('[data-li-move]');if(m)step(m.dataset.liMove)});

 const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};function step(d){const v=dirs[d];if(!v)return;pos.x=Math.max(-47,Math.min(47,pos.x+v[0]*1.5));pos.z=Math.max(-47,Math.min(47,pos.z+v[1]*1.5));if(me)me.position.set(pos.x,0,pos.z);if(fallbackDraw)fallbackDraw()}
