#main,.ms,#sl,#st,#dr{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#login{overflow-y:auto}
input,textarea{font-size:16px!important}
.rl,.reel{background:#000}
.reel video{object-fit:contain;background:#000}
#app.fs .bar{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
@media(max-width:899px){#app.fs nav,#app.fs #tb,#app.fs #ann{display:none}}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="vf" viewBox="0 0 24 24"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5" fill="#1877f2"/><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5" fill="#1877f2" transform="rotate(45 12 12)"/><circle cx="12" cy="12" r="8.6" fill="#1877f2"/><path d="M7.4 12.4l3.1 3.1 6.2-6.6" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>
<div id="app" class="out">
  <div id="login"><h1 class="lg" aria-label="Amlink"><span style="--i:0">A</span><span style="--i:1">m</span><span style="--i:2">l</span><span style="--i:3">i</span><span style="--i:4">n</span><span style="--i:5">k</span></h1><p>Share, chat and connect.</p><div id="gbtn" style="justify-self:center"></div><button class="pri" data-a="su">Create account with email</button><button class="pri sec" data-a="li">Log in with email</button><p class="er" id="le"></p></div>
  <div id="tb"><b>Amlink</b><div class="seg"><button data-a="nv" data-t="feed">Feed</button><button data-a="nv" data-t="reels">Reels</button></div><button data-a="dr" aria-label="Settings and privacy">☰</button></div>
  <div id="main"></div>
  <nav><button data-t="feed"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg>Home</button><button data-t="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.8 0 4.5 1.8 4.5 4.5"/></svg>Friends</button><button class="pl2" data-a="plus" aria-label="Create">+</button><button data-t="alerts"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H9l-5 4z"/></svg>Inbox<b id="nb" hidden></b></button><button data-t="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Profile</button></nav>
  <div id="scrim" data-a="cs"></div>
  <section id="sh" aria-label="Comments">
    <div class="top"><span id="sc">Comments</span><button data-a="cs" aria-label="Close comments">×</button></div>
    <div id="sl"></div>
    <div class="bar"><input id="ci" placeholder="Add a comment…" maxlength="300" autocomplete="off"><button data-a="pc">Post</button></div>
  </section>
  <div id="dsc" data-a="dc"></div>
  <aside id="dr" aria-label="Menu"></aside>
  <div id="au" hidden><div class="ah"><button data-a="ab2" aria-label="Back">‹</button><div class="dots" id="dots"></div></div><div id="st"></div></div>
  <div id="md" hidden></div>
  <div id="ts" hidden></div>
</div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const VB='<svg class="vb" aria-label="Verified"><use href="#vf"/></svg>';
let T=null,ME,tab='feed',posts=[],cur,ppl=[],peer,poll,th='dark',gid,mut=true,rf='y',SG={};
try{T=localStorage.getItem('tk');th=localStorage.getItem('th')||th}catch(e){}
document.documentElement.dataset.t=th;
let CS={snd:1,pop:1,con:1};try{CS=Object.assign(CS,JSON.parse(localStorage.getItem('cs')||'{}'))}catch(e){}
const nm=u=>E(u.Username||'user')+(u.Verified?VB:'');
const ago=t=>{const m=(Date.now()/1000-t)/60|0;return m<1?'now':m<60?m+'m':m<1440?(m/60|0)+'h':(m/1440|0)+'d'};
async function A(p,b){const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'X-Token':T||'','Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json();if(r.status==401&&T)out();if(j&&j.error)throw new Error(j.error);return j}
function toast(m){const t=$('#ts');t.textContent=m;t.hidden=false;clearTimeout(t.x);t.x=setTimeout(()=>t.hidden=true,2200)}
function out(){try{localStorage.removeItem('tk')}catch(e){}location.reload()}
function modal(h,keep){const m=$('#md');m.innerHTML='<div class="box">'+h+'</div>';m.dataset.k=keep?1:'';m.hidden=false}
const closeM=()=>$('#md').hidden=true;
$('#md').onclick=e=>{if(e.target.id=='md'&&!e.target.dataset.k)closeM()};

async function boot(){
  let c={};try{c=await A('config')}catch(e){}
  try{if(window.firebase&&c.Fb&&c.Fb.apiKey){firebase.initializeApp(c.Fb);FB=firebase.auth()}}catch(e){}
  if(T){try{ME=await A('me');return app()}catch(e){}}
  if(!window.google){$('#le').textContent='Google sign-in could not load. Check your connection and refresh.';return}
  google.accounts.id.initialize({client_id:c.Client,callback:async r=>{try{const j=await A('login',{credential:r.credential});T=j.token;try{localStorage.setItem('tk',T)}catch(e){}ME=j.me;app()}catch(e){$('#le').textContent=e.message}}});
  google.accounts.id.renderButton($('#gbtn'),{theme:'outline',size:'large',shape:'pill'});
}
function app(){$('#login').hidden=true;$('#app').classList.remove('out');ME.Username?go('feed'):askName(1);bell()}
function askName(first){
  modal(`<h3>${first?'Choose a username':'Change username'}</h3><input id="un" placeholder="letters, numbers and _" maxlength="20" autocomplete="off"><p class="er" id="er"></p><button class="pri" id="sv">Save</button>`,first);
  $('#sv').onclick=async()=>{try{ME=await A('username',{u:$('#un').value});closeM();go(first?'feed':tab)}catch(e){$('#er').textContent=e.message}};
}
async function go(t){
  tab=t;clearInterval(poll);$('#app').classList.remove('cs','dro');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==(t=='reels'?'feed':t)));
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
  $('#main').innerHTML='';
  try{if(t=='feed'||t=='reels'){posts=await A('feed');t=='feed'?home():reels()}else if(t=='people')people();else if(t=='alerts')alerts();else if(t=='circles')await circles();else if(t=='bc')await bcs();else await profile()}catch(e){toast(e.message)}
}
document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.t)go(b.dataset.t)};

function openDr(){
  const r=(a,i,t,x)=>`<button class="sr" data-a="${a}"${x||''}><i>${i}</i>${t}<em>›</em></button>`,nv=(t,i,l)=>r('nv',i,l,` data-t="${t}"`);
  $('#dr').innerHTML='<div class="dt"><button data-a="dc" aria-label="Close">←</button><span>Settings and privacy</span></div>'+
  '<p class="sg">Account</p><div class="cd">'+r('ep','👤','Edit profile')+r('un','✏️','Change username')+'</div>'+
  '<p class="sg">Content &amp; display</p><div class="cd">'+r('cset','🔔','Chat settings')+r('th','🌓','Display')+nv('circles','👥','Circles')+r('gn','➕','Create group chat')+nv('bc','📢','Broadcasts')+nv('reels','🎬','Reels')+'</div>'+
  '<p class="sg">Support and about</p><div class="cd">'+r('ab','ℹ️','About me')+r('lt','📄','Terms and Conditions')+r('lp','🔒','Privacy Policy')+'</div>'+
  (ME.Admin?'<p class="sg">Admin</p><div class="cd">'+r('adm','🛡️','Admin panel')+'</div>':'')+
  '<p class="sg">Login</p><div class="cd">'+r('out','🚪','Log out')+'</div>';
  $('#app').classList.add('dro');
}

var mediaH=p=>p.Media?(p.Kind=='video'?`<video src="${E(p.Media)}" controls playsinline preload="metadata"></video>`:`<img src="${E(p.Media)}" loading="lazy" alt="">`):'';
const folB=u=>u.ID==ME.ID?'':`<button class="fl" data-a="fol" data-i="${u.ID}"></button>`;
var postH=p=>`<article class="post"><header>${AV(p.U)}<div><div class="nm">${nm(p.U)}</div><small>${ago(p.TS)}</small></div>${folB(p.U)}${p.U.ID==ME.ID||ME.Admin?`<button class="dl" data-a="delp" data-i="${p.ID}">Delete</button>`:''}</header>${p.Text?`<p>${tg(p.Text)}</p>`:''}${mediaH(p)}<footer><button class="lk" data-a="like" data-i="${p.ID}">♥ <span></span></button><button class="cm" data-a="cm" data-i="${p.ID}">💬 <span></span></button></footer></article>`;
function paint(){
  posts.forEach(p=>{
    document.querySelectorAll(`.lk[data-i="${p.ID}"]`).forEach(b=>{b.classList.toggle('on',(p.Likes||[]).includes(ME.ID));b.querySelector('span').textContent=(p.Likes||[]).length||''});
    document.querySelectorAll(`.cm[data-i="${p.ID}"] span`).forEach(s=>s.textContent=p.C.length||'');
  });
  document.querySelectorAll('.fl').forEach(b=>{const f=(ME.Following||[]).includes(b.dataset.i);b.textContent=f?'Following':'Follow';b.classList.toggle('on',f)});
}
function upd(p){posts=posts.map(x=>x.ID==p.ID?p:x);if(cur&&cur.ID==p.ID)cur=p;paint()}
function home(){$('#main').innerHTML=`<div class="comp" data-a="new">What’s on your mind, ${E(ME.Username)}?</div>`+(posts.map(postH).join('')||'<p class="empty">No posts yet. Be the first to share something.</p>');paint();strip()}

/* Moments (24h status) */
async function strip(){
  try{
    const l=await A('statuses');SG={};
    l.forEach(s=>(SG[s.U.ID]=SG[s.U.ID]||{U:s.U,L:[]}).L.push(s));
    const h='<div class="ms2"><button class="mo" data-a="sa"><b class="av">＋</b><span>Your moment</span></button>'+Object.values(SG).map(x=>`<button class="mo" data-a="sv" data-i="${x.U.ID}"><b class="av">${E((x.U.Username||'?')[0])}</b><span>${E(x.U.Username)}</span></button>`).join('')+'</div>';
    const c=$('.comp');if(c&&tab=='feed')c.insertAdjacentHTML('beforebegin',h);
  }catch(e){}
}
function sview(id){
  const L=SG[id].L;let i=0;
  const show=()=>{if(i>=L.length){closeM();return}const s=L[i];
    modal(`<div style="display:grid;gap:10px"><b>${nm(s.U)} <small>${ago(s.TS)} · ${i+1}/${L.length}</small></b>${mediaH(s)}${s.Text?`<p style="font-size:18px;white-space:pre-wrap">${E(s.Text)}</p>`:''}<small>Tap to continue</small></div>`);
    $('#md .box').onclick=()=>{i++;show()}};
  show();
}
function sadd(){
  modal('<h3>New moment</h3><textarea id="tx" placeholder="What’s happening? It disappears in 24 hours." maxlength="300"></textarea><input id="fi" type="file" accept="image/*,video/*"><p class="er" id="er"></p><button class="pri" id="pub">Share moment</button>');
  $('#pub').onclick=async()=>{const f=$('#fi').files[0],b=$('#pub');b.disabled=true;
    try{let m='',k='';if(f){m=await up(f);k=f.type.startsWith('video')?'video':'image'}
      await A('status',{text:$('#tx').value,media:m,kind:k});closeM();go('feed')}
    catch(e){$('#er').textContent=e.message;b.disabled=false}};
}

/* Reels */
function reels(){
  let v=posts.filter(p=>p.Kind=='video');
  if(rf=='f')v=v.filter(p=>(ME.Following||[]).includes(p.U.ID)||p.U.ID==ME.ID);
  $('#main').innerHTML=`<div class="rt"><button data-a="rf" data-v="f" class="${rf=='f'?'on':''}">Following</button><button data-a="rf" data-v="y" class="${rf=='y'?'on':''}">For You</button></div><div class="rl">`+(v.length?v.map(p=>`<section class="reel"><video data-a="pp" src="${E(p.Media)}" loop ${mut?'muted ':''}playsinline preload="metadata"></video><div class="shade"></div><div class="info"><b>@${E(p.U.Username)}${p.U.Verified?VB:''}</b><span>${E(p.Text)}</span></div><div class="rail"><div class="ra">${AV(p.U)}${p.U.ID==ME.ID||(ME.Following||[]).includes(p.U.ID)?'':`<button class="pl" data-a="rfol" data-i="${p.U.ID}" aria-label="Follow">＋</button>`}</div><button class="lk" data-a="like" data-i="${p.ID}">♥<span></span></button><button class="cm" data-a="cm" data-i="${p.ID}">💬<span></span></button><button data-a="sh" data-i="${p.ID}">↪<span>Share</span></button><button data-a="mu">${mut?'🔇':'🔊'}</button></div></section>`).join(''):'<p class="empty" style="color:#fff;padding-top:30vh">No reels here yet. Post a video from Home.</p>')+'</div>';
  paint();
  const io=new IntersectionObserver(es=>es.forEach(e=>{const vd=e.target.querySelector('video');e.isIntersecting?vd.play().catch(()=>{}):vd.pause()}),{threshold:.7});
  document.querySelectorAll('.reel').forEach(r=>io.observe(r));
}

/* Comments */
function sheet(id){cur=posts.find(p=>p.ID==id);$('#app').classList.add('cs');sl()}
function sl(){
  $('#sc').textContent=cur.C.length+' comments';
  $('#sl').innerHTML=cur.C.map((c,i)=>{const n=(c.Likes||[]).length,on=(c.Likes||[]).includes(ME.ID);
    return `<div class="c"><b class="av">${E((c.U.Username||'?')[0])}</b><div class="cb"><div class="nm">${nm(c.U)}</div><div>${E(c.Text)}</div><small>${ago(c.TS)} </small><button class="rp" data-a="rp" data-n="${E(c.U.Username)}">Reply</button></div><button class="cl${on?' on':''}" data-a="cl" data-i="${i}" aria-label="Like comment"><b>${on?'♥':'♡'}</b>${n||''}</button></div>`}).join('')||'<p class="empty">No comments yet. Start the conversation.</p>';
}

const stat=u=>u.On?'Online':u.Seen?'Last seen '+(ago(u.Seen)=='now'?'just now':ago(u.Seen)+' ago'):'';
function people(){
  $('#main').innerHTML='<div class="ch2"><b>Friends</b><button data-a="cset" aria-label="Chat settings">⋯</button></div><div class="sb"><input id="q" placeholder="Search people by username" autocomplete="off"></div><div id="pl"></div>';
  let t;$('#q').oninput=()=>{clearTimeout(t);t=setTimeout(pl,250)};pl();
}
async function pl(){try{const q=$('#q').value;ppl=(!CS.con&&!q)?[]:await A(q?'search?q='+encodeURIComponent(q):'friends');drawP()}catch(e){toast(e.message)}}
function drawP(){
  const on=ppl.filter(u=>u.On),off=ppl.filter(u=>!u.On).sort((a,b)=>(b.Seen||0)-(a.Seen||0)),q=$('#q')&&$('#q').value;
  const row=u=>`<div class="pr"><span class="avw" data-a="pf" data-i="${u.ID}">${AV(u)}${u.On?'<i class="od"></i>':''}</span><div class="nm" data-a="pf" data-i="${u.ID}">${nm(u)}<br><small>${stat(u)}</small></div><button class="fl" data-a="fol" data-i="${u.ID}"></button><button data-a="dm" data-i="${u.ID}">Message</button>${ME.Admin?`<button data-a="ver" data-i="${u.ID}">${u.Verified?'Unverify':'Verify'}</button>`:''}</div>`;
  const h=(t,n)=>n?`<p class="sg" style="padding:14px 16px 4px">${t} (${n})</p>`:'';
  $('#pl').innerHTML=(ppl.length?'':'<p class="empty">Search a username to find people. People you follow and anyone online show up here.</p>')+(q?ppl.map(row).join(''):h('Online now',on.length)+on.map(row).join('')+h('Offline',off.length)+off.map(row).join(''));
  paint();
}
async function L(){const m=await A('msgs?w='+peer.ID),b=$('#ms');if(!b)return;b.innerHTML=m.map(x=>`<div class="m ${x.From==ME.ID?'me':''}">${msgM(x)}${E(x.Text)}</div>`).join('');b.scrollTop=b.scrollHeight}
async function chat(u){
  peer=u;$('#main').innerHTML=`<div class="ch"><div class="chh"><button data-a="back" aria-label="Back">‹</button><div><b>${nm(u)}</b><br><small>${stat(u)}</small></div></div><div class="ms" id="ms"></div><div class="bar"><label class="at" aria-label="Attach photo or video">📎<input id="mf" type="file" accept="image/*,video/*" hidden></label><input id="mi" placeholder="Message…" autocomplete="off"><button data-a="mic" id="mic" aria-label="Record voice note">🎤</button><button data-a="send">Send</button></div></div>`;
  $('#mi').onkeydown=e=>{if(e.key=='Enter')send()};$('#mf').onchange=()=>sendFile($('#mf').files[0]);
  await L();poll=setInterval(()=>L().catch(()=>{}),3000);
}
async function send(){const i=$('#mi'),t=i.value.trim();if(!t)return;i.value='';await A('msg',{to:peer.ID,text:t});await L()}

/* Circles (group chats) */
async function circles(){
  const g=await A('groups');
  $('#main').innerHTML='<div class="ch2"><b>Circles</b><button data-a="gn" aria-label="New circle">＋</button></div>'+(g.map(x=>`<button class="di" style="padding:10px 16px" data-a="go" data-i="${x.ID}" data-n="${E(x.Name)}"><i style="background:#7c5cff">${E(x.Name[0].toUpperCase())}</i><span>${E(x.Name)}<small>${x.N} members${x.Last?' · '+E(x.Last):''}</small></span></button>`).join('')||'<p class="empty">No circles yet. Tap ＋ to start a group chat.</p>');
}
function gnew(){
  const sel=new Set();
  modal('<h3>New circle</h3><input id="gnm" placeholder="Circle name" maxlength="40" autocomplete="off"><input id="gq" placeholder="Search people to add" autocomplete="off"><div id="gls" style="max-height:200px;overflow:auto"></div><p class="er" id="er"></p><button class="pri" id="gc">Create circle</button>');
  const draw=async()=>{try{const l=await A('search?q='+encodeURIComponent($('#gq').value));
    $('#gls').innerHTML=l.map(u=>`<label class="row"><span>${nm(u)}</span><input type="checkbox" data-id="${u.ID}"${sel.has(u.ID)?' checked':''}></label>`).join('')||'<p class="empty">Follow people or search a username.</p>'}catch(e){}};
  $('#gls').onchange=e=>{e.target.checked?sel.add(e.target.dataset.id):sel.delete(e.target.dataset.id)};
  let t;$('#gq').oninput=()=>{clearTimeout(t);t=setTimeout(draw,250)};draw();
  $('#gc').onclick=async()=>{const n=$('#gnm').value;try{const j=await A('gcreate',{name:n,members:[...sel].join(',')});closeM();gopen(j.id,n)}catch(e){$('#er').textContent=e.message}};
}
async function gload(){const m=await A('gmsgs?g='+gid),b=$('#ms');if(!b)return;b.innerHTML=m.map(x=>`<div class="m ${x.Me?'me':''}">${x.Me?'':'<small>'+nm(x.U)+'</small><br>'}${E(x.Text)}</div>`).join('');b.scrollTop=b.scrollHeight}
async function gopen(id,n){
  gid=id;tab='circles';clearInterval(poll);
  $('#main').innerHTML=`<div class="ch"><div class="chh"><button data-a="cb" aria-label="Back">‹</button><b>${E(n)}</b></div><div class="ms" id="ms"></div><div class="bar"><input id="mi" placeholder="Message the circle…" autocomplete="off"><button data-a="gs">Send</button></div></div>`;
  $('#mi').onkeydown=e=>{if(e.key=='Enter')gsend()};
  try{await gload()}catch(e){toast(e.message)}poll=setInterval(()=>gload().catch(()=>{}),3000);
}
async function gsend(){const i=$('#mi'),t=i.value.trim();if(!t)return;i.value='';await A('gmsg',{g:gid,text:t});await gload()}

/* Broadcasts (channels) */
async function bcs(){
  const l=await A('channels');
  $('#main').innerHTML='<div class="ch2"><b>Broadcasts</b><button data-a="bn" aria-label="New broadcast">＋</button></div>'+(l.map(c=>`<div class="pr"><b class="av" style="border-radius:14px;background:#ff7a1a">${E(c.Name[0].toUpperCase())}</b><button class="di" style="flex:1;padding:0" data-a="bo" data-i="${c.ID}"><span>${E(c.Name)}<small>${c.N} following${c.Last?' · '+E(c.Last):''}</small></span></button>${c.Mine?'':`<button class="fl${c.Sub?' on':''}" data-a="bf" data-i="${c.ID}">${c.Sub?'Following':'Follow'}</button>`}</div>`).join('')||'<p class="empty">No broadcasts yet. Tap ＋ to start one.</p>');
}
async function bopen(id){
  const c=await A('channels?id='+id);
  $('#main').innerHTML=`<div class="chh"><button data-a="bb" aria-label="Back">‹</button><b>${E(c.Name)}</b></div><p class="about" style="margin:12px;text-align:center;color:var(--mut)">${E(c.Desc)}</p>`+(c.Mine?`<div class="sb"><input id="bt" placeholder="Share an update…" maxlength="500" autocomplete="off"><button class="pri" style="width:100%;margin-top:8px" data-a="bp" data-i="${id}">Send update</button></div>`:'')+(c.Posts.map(p=>`<div class="post" style="padding:12px"><p style="padding:0 0 6px">${E(p.Text)}</p><small>${ago(p.TS)}</small></div>`).join('')||'<p class="empty">No updates yet.</p>');
}
function bnew(){
  modal('<h3>New broadcast</h3><input id="bnm" placeholder="Name" maxlength="40" autocomplete="off"><input id="bd" placeholder="What is it about?" maxlength="200" autocomplete="off"><p class="er" id="er"></p><button class="pri" id="bcr">Create broadcast</button>');
  $('#bcr').onclick=async()=>{try{await A('chcreate',{name:$('#bnm').value,desc:$('#bd').value});closeM();bcs()}catch(e){$('#er').textContent=e.message}};
}

/* Profile */
let PF,ptab='p';
async function profile(id){
  PF=await A('profile'+(id?'?id='+id:''));ptab='p';
  if(!ppl.some(x=>x.ID==PF.U.ID))ppl.push(PF.U);
  pfDraw();
}
function opf(id){tab='pf';clearInterval(poll);document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));$('#main').innerHTML='';profile(id).catch(e=>toast(e.message))}
function pfDraw(){
  const j=PF,u=j.U,me=j.IsMe,L=j.Posts.filter(p=>ptab=='p'||p.Kind=='video');
  const tb=(v,svg)=>`<button class="${ptab==v?'on':''}" data-a="pt" data-v="${v}" aria-label="${v=='p'?'Posts':'Reels'}">${svg}</button>`;

    modal(`<div style="display:grid;gap:10px"><b>${nm(s.U)} <small>${ago(s.TS)} · ${i+1}/${L2.length}</small></b>${mediaH(s)}${s.Text?`<p style="font-size:18px;white-space:pre-wrap">${E(s.Text)}</p>`:''}`+
    (mine?`<button class="ed" data-a="mst" data-i="${s.ID}">👁 Viewers and reactions</button>`:`<div class="act">${['❤️','😂','😮','😢','🔥','👏'].map(e=>`<button class="ed" style="padding:8px 10px" data-a="mrx" data-i="${s.ID}" data-e="${e}">${e}</button>`).join('')}</div><div class="bar" style="padding:0"><input id="mrp" placeholder="Reply…" autocomplete="off"><button data-a="mrp" data-i="${s.ID}">Send</button></div>`)+
    `<button class="pri" id="mnx">${i+1<L2.length?'Next':'Close'}</button></div>`);$('#mnx').onclick=()=>{i++;show()}};
  show()
};
async function xms(id){const j=await A('mstats',{id});modal(`<h3>Moment activity</h3><b>👁 ${j.V.length} views</b><div style="max-height:30vh;overflow:auto">${j.V.map(u=>`<div class="pr">${AV(u)}<div class="nm">${nm(u)}</div></div>`).join('')||'<small>No views yet</small>'}</div><b>Reactions</b><div style="max-height:25vh;overflow:auto">${j.R.map(r=>`<div class="pr">${AV(r.U)}<div class="nm">${nm(r.U)}</div><span>${r.E}</span></div>`).join('')||'<small>None yet</small>'}</div><button class="pri" data-a="mc">Close</button>`)}

/* circle management */
const go1=gopen;
gopen=async function(id,n){await go1(id,n);const h=$('.chh');if(h)h.insertAdjacentHTML('beforeend','<button data-a="gset" style="margin-left:auto" aria-label="Circle settings">⚙</button>')};
async function xg(){
  const j=await A('ginfo?g='+gid);
  modal(`<h3>${E(j.Name)}</h3><input id="gnn" value="${E(j.Name)}" maxlength="40"${j.CanEdit?'':' disabled'}>`+(j.CanEdit?'<button class="pri sec" data-a="gop" data-o="rename">Rename</button>':'')+
  '<div style="max-height:30vh;overflow:auto">'+j.M.map(m=>`<div class="pr">${AV(m.U)}<div class="nm">${nm(m.U)}<br><small>${m.Role}</small></div>`+(j.CanEdit&&m.U.ID!=ME.ID&&m.Role!='owner'&&(j.Owner||m.Role=='member')?`<button data-a="gop" data-o="remove" data-i="${m.U.ID}">Remove</button>`:'')+(j.Owner&&m.Role!='owner'?`<button data-a="gop" data-o="admin" data-i="${m.U.ID}">${m.Role=='admin'?'Demote':'Make admin'}</button>`:'')+'</div>').join('')+'</div>'+
  (j.CanEdit?'<input id="gaq" placeholder="Search people to add" autocomplete="off"><div id="gar"></div>':'')+'<button class="pri sec" data-a="gop" data-o="leave">Leave circle</button><button class="pri" data-a="mc">Close</button>');
  if(j.CanEdit){let t;$('#gaq').oninput=()=>{clearTimeout(t);t=setTimeout(async()=>{const l=await A('search?q='+encodeURIComponent($('#gaq').value));$('#gar').innerHTML=l.filter(u=>!j.M.some(m=>m.U.ID==u.ID)).map(u=>`<div class="pr">${AV(u)}<div class="nm">${nm(u)}</div><button data-a="gop" data-o="add" data-i="${u.ID}">Add</button></div>`).join('')},250)}}
}

/* private accounts, reports, discovery, profile extras */
async function reqs(){await xm();modal('<h3>Follow requests</h3><div style="max-height:50vh;overflow:auto">'+(XM.Req.map(u=>`<div class="pr">${AV(u)}<div class="nm">${nm(u)}</div><button data-a="ra" data-i="${u.ID}" data-v="1">Accept</button><button data-a="ra" data-i="${u.ID}" data-v="0">Decline</button></div>`).join('')||'<p class="empty">No pending requests.</p>')+'</div><button class="pri" data-a="mc">Close</button>')}
async function xur(){const l=await A('ureports');modal('<h3>Reports</h3><div style="max-height:55vh;overflow:auto">'+(l.map(r=>`<div class="pr"><div class="nm">${nm(r.By)} reported ${r.Kind} by ${nm(r.To)}<br><small>${E(r.Text||'')} ${E(r.Reason||'')}</small></div><button data-a="uca" data-i="${r.ID}" data-v="dismiss">Dismiss</button><button data-a="uca" data-i="${r.ID}" data-v="ban">Ban user</button>${r.Kind=='comment'?`<button data-a="uca" data-i="${r.ID}" data-v="delc">Delete comment</button>`:''}</div>`).join('')||'<p class="empty">No reports.</p>')+'</div><button class="pri" data-a="mc">Close</button>')}
const sl0=sl;
sl=function(){sl0();document.querySelectorAll('#sl .c').forEach((el,i)=>{if(cur.C[i]&&cur.C[i].U.ID!=ME.ID)el.querySelector('.cb').insertAdjacentHTML('beforeend',`<button class="rp" data-a="rcm" data-i="${i}">Report</button>`)})};
const pf0=pfDraw;
pfDraw=function(){pf0();const u=PF.U,me=PF.IsMe,a=$('#main .act');
  if(a)a.insertAdjacentHTML('beforeend',(me?'':`<button class="ed" data-a="rus" data-i="${u.ID}">Report</button><button class="ed" data-a="mut" data-i="${u.ID}">Mute</button>`)+'<button class="ed" data-a="plink">Copy link</button>');
  if(u.Pin){const l=document.querySelector(`#main .post .lk[data-i="${u.Pin}"]`);if(l){const p=l.closest('.post'),f=$('#main .post');if(f&&f!==p)f.before(p);p.insertAdjacentHTML('afterbegin','<small style="padding:8px 12px 0;display:block">📌 Pinned</small>')}}
  if(!me&&u.Priv&&!(ME.Following||[]).includes(u.ID)){const e=$('#main .empty');if(e)e.textContent='🔒 This account is private. Follow to see their posts.'}};
async function disc(){try{const j=await A('discover');
  const h='<h4>Who to follow</h4>'+(j.People.map(u=>`<div class="pr"><span data-a="pf" data-i="${u.ID}">${AV(u)}</span><div class="nm" data-a="pf" data-i="${u.ID}">${nm(u)}</div><button class="fl" data-a="fol" data-i="${u.ID}"></button></div>`).join('')||'<small>No suggestions yet.</small>')+'<h4>Trending</h4>'+(j.Tags.map(t=>`<button class="ht tgb" data-a="tag" data-q="${E(t.T)}">${E(t.T)} <small>${t.N} post${t.N==1?'':'s'}</small></button>`).join('')||'<small>No hashtags yet.</small>');
  document.querySelectorAll('.dv').forEach(e=>e.innerHTML=h);paint()}catch(e){}}
const pe0=people;
people=function(){pe0();$('#pl').insertAdjacentHTML('beforebegin','<div class="dv"></div>');disc()};
const go0=go;
go=async function(t){await go0(t);if(innerWidth>=900)disc()};
const od0=openDr;
openDr=function(){od0();const r=(a,i,t)=>`<button class="sr" data-a="${a}"><i>${i}</i>${t}<em>›</em></button>`;
  $('#dr').insertAdjacentHTML('beforeend','<p class="sg">Privacy and app</p><div class="cd"><div class="row" style="padding:12px 16px"><div>Private account<small>Approve who can follow you</small></div><label class="sw"><input type="checkbox" data-a="xpriv"'+(XM.Priv?' checked':'')+'><span></span></label></div>'+r('reqs','👋','Follow requests'+(XM.Req.length?' ('+XM.Req.length+')':''))+r('ntf','🔔','Enable alerts')+(xdp?r('inst','📲','Install app'):'')+(ME.Admin?r('urep','🚩','User and comment reports'):'')+'</div>')};
const ap0=app;
app=function(){ap0();live();xm().then(()=>paint());if(!$('#rp'))$('#app').insertAdjacentHTML('beforeend','<aside id="rp" class="dv" aria-label="Suggestions"></aside>');disc()};

/* click handlers for the new actions */
$('#app').addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i,d=b.dataset;
  try{
    if(a=='vote'){const p=await A('vote',{id:i,i:d.o});upd(p);document.querySelectorAll(`.poll[data-p="${i}"]`).forEach(el=>el.outerHTML=xpoll(p))}
    else if(a=='nrow'){const x=NL[+d.n];if(x.Type=='freq')reqs();else if(x.Type=='msg')chat(x.U);else if(x.Post){const p=await A('onep?id='+x.Post);posts=[p];modal(postH(p)+'<button class="pri" data-a="mc">Close</button>');paint()}else opf(x.U.ID)}
    else if(a=='ncl'){await A('nclear',{});alerts()}
    else if(a=='atp'){const j=await A('byname',{u:d.u});closeM();opf(j.id)}
    else if(a=='uns'){if(confirm('Unsend this message?')){await A('unsend',{to:peer.ID,ts:d.ts});L()}}
    else if(a=='mrx'){await A('mreact',{id:i,e:d.e});toast('Reaction sent '+d.e)}
    else if(a=='mrp'){const t=$('#mrp').value.trim();if(t){await A('mreply',{id:i,text:t});$('#mrp').value='';toast('Reply sent')}}
    else if(a=='mst')xms(i);
    else if(a=='gset')xg();
    else if(a=='gop'){await A('gmanage',{g:gid,op:d.o,id:i||'',name:($('#gnn')||{}).value||''});if(d.o=='leave'){closeM();go('circles')}else{xg();if(d.o=='rename')toast('Renamed')}}
    else if(a=='xpriv'){await A('setpriv',{});await xm();toast(XM.Priv?'Account is now private':'Account is now public')}
    else if(a=='reqs')reqs();
    else if(a=='ra'){await A('reqact',{id:i,v:d.v});reqs()}
    else if(a=='inst'&&xdp){xdp.prompt();xdp=null}
    else if(a=='ntf'){if(!window.Notification)toast('Not supported on this browser');else Notification.requestPermission().then(r=>toast(r=='granted'?'Alerts on':'Alerts blocked'))}
    else if(a=='rcm'){const r=prompt('Why are you reporting this comment?');if(r!==null){await A('report2',{kind:'comment',id:cur.ID,i:i,reason:r});toast('Thanks, we will review it')}}
    else if(a=='rus'){const r=prompt('Why are you reporting this user?');if(r!==null){await A('report2',{kind:'user',id:i,reason:r});toast('Thanks, we will review it')}}
    else if(a=='urep')xur();
    else if(a=='uca'){await A('ucact',{id:i,op:d.v});xur()}
    else if(a=='mut'){const j=await A('mute',{id:i});toast(j.Muted?'Notifications muted':'Unmuted')}
    else if(a=='pin'){const j=await A('pin',{id:i});toast(j.Pin?'Pinned to your profile':'Unpinned')}
    else if(a=='plink'){const l=location.origin+'/?u='+PF.U.Username;navigator.clipboard?navigator.clipboard.writeText(l).then(()=>toast('Link copied')):prompt('Copy link',l)}
  }catch(x){toast(x.message)}
});
const dl=setInterval(async()=>{if(!ME)return;clearInterval(dl);const u=new URLSearchParams(location.search).get('u');if(!u)return;try{const j=await A('byname',{u});history.replaceState(null,'','/');opf(j.id)}catch(e){}},600);
/* v4.1: inbox that never goes blank, full-screen chats */
addEventListener('unhandledrejection',e=>{try{toast((e.reason&&e.reason.message)||'Something went wrong')}catch(x){}});
alerts=async function(){
  try{
    const[j,cv]=await Promise.all([A('notifs2').catch(()=>A('notifs').then(r=>r.L)),A('inbox').catch(()=>[])]);
    NL=j;$('#nb').hidden=true;
    ppl=[...ppl.filter(p=>!cv.some(c=>c.U.ID==p.ID)),...cv.map(c=>c.U)];
    $('#main').innerHTML='<div class="ch2"><b>Inbox</b></div><div style="padding:8px 12px"><button class="di" data-a="nv" data-t="circles"><i style="background:#7c5cff">👥</i><span>Circles<small>Group chats</small></span></button><button class="di" data-a="nv" data-t="bc"><i style="background:#ff7a1a">📢</i><span>Broadcasts<small>Channels you follow</small></span></button></div><p class="sg" style="padding:6px 16px">Messages</p>'+
    (cv.map(c=>`<div class="pr" data-a="dm" data-i="${c.U.ID}">${AV(c.U)}<div class="nm">${nm(c.U)}<br><small>${c.Mine?'You: ':''}${E(c.Last)} · ${ago(c.TS)}</small></div>${c.Un?`<b class="bd">${c.Un}</b>`:''}</div>`).join('')||'<p class="empty">No chats yet. Find people in Friends.</p>')+
    `<div class="ch2" style="font-size:14px"><span class="sg" style="padding:0">Activity</span>${j.length?'<button data-a="ncl" style="font-size:13px;color:var(--mut)">Clear all</button>':''}</div>`+
    (j.length?j.map((x,n)=>`<div class="pr${x.New?' nw':''}" data-a="nrow" data-n="${n}" style="cursor:pointer">${AV(x.U)}<div class="nm">${nm(x.U)} <small>${TXT[x.Type]||''}, ${ago(x.TS)}</small></div></div>`).join(''):'<p class="empty">No notifications yet.</p>');
  }catch(e){$('#main').innerHTML='<p class="empty">Could not load your inbox.<br><small>'+E(e.message)+'</small></p>'}
};
const fsOn=()=>$('#app').classList.add('fs');
const ch0=chat;chat=async function(u){fsOn();return ch0(u)};
const gp0=gopen;gopen=async function(id,n){fsOn();return gp0(id,n)};
const bo0=bopen;bopen=async function(id){fsOn();return bo0(id)};
const go2=go;go=async function(t){$('#app').classList.remove('fs');return go2(t)};

</script>
</body>
</html>
