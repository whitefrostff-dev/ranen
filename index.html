<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amlink</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<meta name="description" content="Amlink: share, chat and connect. Developed by Nwodili Yaemerie Convenant.">
<script src="https://accounts.google.com/gsi/client" async></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{--bg:#fff;--fg:#0b0b0b;--mut:#65676b;--card:#eaf3ff;--line:#dbe7f5;--acc:#1877f2}
[data-t=dark]{--bg:#000;--fg:#f5f5f5;--mut:#a8abb0;--card:#14181e;--line:#262b33}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{max-width:520px;height:100dvh;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden;border-inline:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
#app.out #main,#app.out nav,#app.out #tb{display:none}
#main{flex:1;overflow-y:auto;position:relative}
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
nav button{flex:1;padding:13px 0;background:none;border:0;color:var(--mut);font-weight:700}
nav button.on{color:var(--acc)}
#login{flex:1;display:grid;place-content:center;text-align:center;gap:14px;padding:24px}
#login h1{font-size:44px;letter-spacing:-1px}#login p{color:var(--mut)}
.vb{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.15em;margin-left:3px}
.av{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;flex:none;text-transform:uppercase}
.av.big{width:84px;height:84px;font-size:34px}
.comp{margin:12px;padding:12px 16px;border-radius:24px;background:var(--card);color:var(--mut);cursor:pointer}
.post{border-bottom:8px solid var(--card)}
.post header{display:flex;gap:10px;align-items:center;padding:12px}
.post header>div{flex:1}.nm{font-weight:700}small{color:var(--mut);font-weight:400}
.post p{padding:0 12px 10px;white-space:pre-wrap;word-wrap:break-word}
.post img,.post video{width:100%;max-height:70vh;object-fit:cover;display:block;background:#000}
.post footer{display:flex;gap:6px;padding:6px 8px}
.post footer button,.pr button,.prof button,.fl{background:none;border:0;padding:8px 12px;border-radius:18px;font-weight:600;color:var(--mut)}
.lk.on{color:#f02849!important}
.fl{border:1.5px solid var(--acc);color:var(--acc);padding:3px 12px;font-size:13px}.fl.on{background:var(--acc);color:#fff}
.empty{text-align:center;color:var(--mut);padding:48px 24px}
.rl{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000;scrollbar-width:none}
.reel{height:100%;scroll-snap-align:start;position:relative;color:#fff}
.reel video{width:100%;height:100%;object-fit:cover}
.reel .shade{position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.7));pointer-events:none}
.reel .info{position:absolute;left:14px;right:80px;bottom:20px;display:grid;gap:6px;justify-items:start}
.reel .rail{position:absolute;right:8px;bottom:24px;display:grid;gap:14px}
.reel .rail button{background:none;border:0;color:#fff;font-size:26px;display:grid;justify-items:center;font-weight:700;text-shadow:0 1px 4px #000}
.reel .rail span{font-size:12px}
.reel .fl{color:#fff;border-color:#fff}.reel .fl.on{background:#fff;color:#000}
.sb{padding:12px}.sb input,.bar input,.box input,.box textarea{width:100%;border:0;background:var(--card);color:var(--fg);padding:11px 16px;border-radius:22px;font:inherit}
.pr{display:flex;gap:8px;align-items:center;padding:10px 12px}.pr .nm{flex:1}
.prof{display:grid;justify-items:center;gap:8px;padding:28px 16px}
.ch{height:100%;display:flex;flex-direction:column}.chh{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.chh button{background:none;border:0;font-size:26px}
.ms{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 13px;border-radius:18px;background:var(--card);align-self:flex-start;word-wrap:break-word}
.m.me{background:var(--acc);color:#fff;align-self:flex-end}
.bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.bar button{border:0;background:none;color:var(--acc);font-weight:700}
#scrim{position:absolute;inset:0;z-index:8;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
#sh{position:absolute;z-index:9;left:0;right:0;bottom:0;height:68%;background:var(--bg);color:var(--fg);border-radius:16px 16px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#app.cs #scrim{opacity:1;pointer-events:auto}#app.cs #sh{transform:none}
#sh .top{display:flex;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
#sh .top button{background:none;border:0;font-size:22px}
#sl{flex:1;overflow-y:auto;padding:4px 16px}
.c{display:flex;gap:10px;padding:10px 0}.c .av{width:34px;height:34px}
.rp{background:none;border:0;color:var(--mut);font-size:12px;font-weight:700;padding:2px 0}
#md{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.box{background:var(--bg);border-radius:16px;padding:18px;width:100%;display:grid;gap:12px}
.box textarea{border-radius:14px;min-height:90px;resize:vertical}
.pri{background:var(--acc);color:#fff;border:0;border-radius:22px;padding:11px;font-weight:700}
.er{color:#f02849;min-height:1em}
#ts{position:absolute;z-index:30;top:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;font-weight:600;font-size:13px}
#nb{background:#f02849;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:4px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#31a24c;margin-left:6px}.pr.nw{background:var(--card)}.at{cursor:pointer;font-size:20px}.m img,.m video{max-width:100%;border-radius:12px;display:block}.m audio{max-width:100%}.dl{background:none;border:0;color:var(--mut);font-size:13px}
.sw{position:relative;width:46px;height:26px;flex:none}.sw input{position:absolute;inset:0;opacity:0;margin:0;padding:0;cursor:pointer;z-index:1;width:100%;height:100%}.sw span{position:absolute;inset:0;border-radius:13px;background:#8a8d91;transition:.2s}.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked+span{background:var(--acc)}.sw input:checked+span::after{transform:translateX(20px)}.sw input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}.row small{display:block}.ch2{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0;font-size:18px}.ch2 button{background:none;border:0;font-size:24px;padding:0 6px}
/* top bar and side menu */
#tb{display:flex;align-items:center;gap:12px;padding:6px 12px;border-bottom:1px solid var(--line)}
#tb button{background:none;border:0;font-size:22px}#tb b{font-size:20px;color:var(--acc)}
#dsc{position:absolute;inset:0;z-index:11;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
#dr{position:absolute;z-index:12;top:0;bottom:0;left:0;width:80%;background:var(--bg);transform:translateX(-105%);transition:transform .25s;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 12px 16px}
#app.dro #dsc{opacity:1;pointer-events:auto}#app.dro #dr{transform:none}
.dh{display:flex;gap:12px;align-items:center;padding:8px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.di{display:flex;gap:14px;align-items:center;width:100%;background:none;border:0;padding:10px 8px;border-radius:14px;text-align:left;font-weight:600}
.di i{font-style:normal;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;color:#fff;font-size:18px;flex:none}
.di small{display:block;color:var(--mut);font-weight:400}.di:active{background:var(--card)}
/* moments */
.ms2{display:flex;gap:10px;overflow-x:auto;padding:12px;scrollbar-width:none}
.mo{flex:none;width:76px;text-align:center;font-size:12px;background:none;border:0}
.mo b.av{width:58px;height:58px;border-radius:18px;font-size:22px;box-shadow:0 0 0 2.5px var(--bg),0 0 0 5px var(--acc)}
.mo span{display:block;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* dark comment sheet */
#sh{--bg:#1c1c1e;--fg:#f5f5f5;--mut:#9a9a9f;--card:#2c2c2e;--line:#333;height:72%}
#sh .top{justify-content:center;position:relative;border:0}#sh .top button{position:absolute;right:12px}
.c{align-items:flex-start}.c .cb{flex:1}.c .nm{font-size:13px;color:var(--mut)}
.cl{background:none;border:0;display:grid;justify-items:center;color:var(--mut);font-size:12px}.cl.on{color:#fe2c55}.cl b{font-size:18px}
/* reels */
.rt{position:absolute;z-index:3;top:0;left:0;right:0;display:flex;justify-content:center;gap:22px;padding:10px;pointer-events:none}
.rt button{pointer-events:auto;background:none;border:0;color:#ffffffa6;font-weight:700;font-size:16px;text-shadow:0 1px 4px #000;padding:2px 0}
.rt button.on{color:#fff;border-bottom:2px solid #fff}
.ra{position:relative;margin-bottom:10px}.ra .av{width:46px;height:46px;border:2px solid #fff}
.reel .rail .pl{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:#fe2c55;color:#fff;font-size:16px;line-height:1;padding:0;display:block}
.row input[type=checkbox]{width:20px;height:20px;padding:0}
/* login and sign-up flow */
.lg{display:flex;justify-content:center}.lg span{display:inline-block;opacity:0;transform:translateY(26px);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*80ms)}
@keyframes rise{to{opacity:1;transform:none}}@keyframes fade{to{opacity:1}}
#login p,#login .pri,#login #gbtn{opacity:0;animation:fade .6s .6s forwards}
#login .pri{justify-self:center;padding:11px 30px}#login .sec,.pri.sec{background:none;border:1.5px solid var(--line);color:var(--fg)}
#au{position:absolute;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ah{display:flex;align-items:center;gap:12px;padding:10px 12px}.ah button{background:none;border:0;font-size:30px;line-height:1;width:36px}
.dots{display:flex;gap:6px;flex:1;justify-content:center;margin-right:36px}.dots i{width:30px;height:4px;border-radius:2px;background:var(--line);transition:background .3s}.dots i.on{background:var(--acc)}
#st{flex:1;overflow-y:auto;padding:16px 24px}
.sl{display:grid;gap:14px;align-content:start;animation:sin .4s cubic-bezier(.2,.8,.2,1)}.sl.bk{animation-name:sbk}
@keyframes sin{from{opacity:0;transform:translateX(56px)}}@keyframes sbk{from{opacity:0;transform:translateX(-56px)}}
.sl h2{font-size:30px;letter-spacing:-.5px;line-height:1.15}.sub{color:var(--mut)}
.sl input:not([type=checkbox]){width:100%;border:0;background:var(--card);color:var(--fg);padding:15px 16px;border-radius:14px;font:inherit}
.sl .pri{padding:14px}.lnk{background:none;border:0;color:var(--acc);font-weight:700;text-align:left;padding:0}
.sl .row input{width:22px;height:22px;flex:none}.leg{max-height:55vh;overflow:auto;display:grid;gap:10px;font-size:14px}
@media (prefers-reduced-motion:reduce){.lg span,.sl,#login p,#login .pri,#login #gbtn{animation:none;opacity:1;transform:none}}
/* bottom bar, right settings drawer, profile */
nav{align-items:center;background:var(--bg)}
nav button{display:grid;justify-items:center;gap:2px;font-size:11px;padding:8px 0;position:relative}
nav button svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--fg)}nav button.on svg{fill:currentColor}
nav .pl2{flex:none;width:50px;height:34px;margin:6px 12px;border-radius:11px;background:var(--fg);color:var(--bg);font-size:26px;font-weight:700;line-height:1;padding:0;box-shadow:-4px 0 0 #7c5cff,4px 0 0 #ff7a1a;place-items:center}
#nb{position:absolute;top:2px;left:54%;margin:0}
.seg{display:flex;gap:4px;margin:0 auto;background:var(--card);border-radius:18px;padding:3px}
.seg button{font-size:14px!important;font-weight:700;padding:5px 14px;border-radius:15px;color:var(--mut)}.seg button.on{background:var(--bg);color:var(--fg)}
#dr{left:auto;right:0;width:90%;transform:translateX(105%);padding-inline:14px}
.dt{display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px;padding:4px 0 6px}.dt button{background:none;border:0;font-size:26px;line-height:1}.dt span{flex:1;text-align:center;margin-right:26px}
.sg{color:var(--mut);font-weight:600;font-size:14px;padding:18px 4px 8px}
.cd{background:var(--card);border-radius:14px;overflow:hidden}
.sr{display:flex;align-items:center;gap:14px;width:100%;padding:16px;background:none;border:0;text-align:left;font-weight:600;font-size:16px}
.sr i{font-style:normal;width:24px;text-align:center;filter:grayscale(1);opacity:.75}.sr em{margin-left:auto;color:var(--mut);font-style:normal;font-size:22px;line-height:1}.sr:active{background:var(--line)}
.avw{position:relative;display:inline-block;flex:none}.od{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#31a24c;border:2px solid var(--bg)}.od.big{width:20px;height:20px;right:4px;bottom:4px;border-width:3px}
.pfh{display:grid;justify-items:center;gap:8px;padding:20px 16px 8px}.pfh h2{display:flex;align-items:center}
.act{display:flex;gap:8px}.ed{background:var(--card);border:0;border-radius:10px;padding:8px 22px;font-weight:700}
.st{display:flex;gap:30px;text-align:center}.st b{display:block;font-size:18px}.bio{text-align:center;max-width:300px}
.pt{display:flex;border-bottom:1px solid var(--line);margin-top:8px}.pt button{flex:1;background:none;border:0;padding:12px;color:var(--mut);border-bottom:2px solid transparent;display:grid;place-items:center}.pt button.on{color:var(--fg);border-color:var(--fg)}.pt svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.tl{position:relative;aspect-ratio:3/4;background:var(--card);border:0;padding:0;overflow:hidden}.tl img,.tl video{width:100%;height:100%;object-fit:cover;display:block}.tt{display:block;padding:8px;font-size:13px;text-align:left}.tp{position:absolute;left:6px;bottom:6px;color:#fff;font-size:12px;text-shadow:0 1px 3px #000}
/* v2 black and white shine theme */
:root{--bg:#fff;--fg:#0a0a0a;--mut:#6b6b74;--card:#f3f3f5;--line:#e3e3e8;--acc:#0a0a0a;--sh:linear-gradient(110deg,#ffd978,#fff 28%,#8fe3ff 52%,#e3a6ff 76%,#ffd978)}
[data-t=dark]{--bg:#050505;--fg:#fafafa;--mut:#9b9ba4;--card:#121214;--line:#242428;--acc:#fff}
@keyframes shine{to{background-position:200% 0}}
.av{background:var(--sh);color:#000}
.pri,nav .pl2,.sw input:checked+span,.atb .on,.rng{background:var(--sh) 0 0/200% 100%;animation:shine 6s linear infinite}
.pri{color:#000}.pri.sec,#login .sec{background:none;animation:none;border:1.5px solid var(--line);color:var(--fg)}
nav .pl2{color:#000;box-shadow:none}.m.me{background:var(--fg);color:var(--bg)}
.fl{border-color:var(--fg);color:var(--fg)}.fl.on{background:var(--fg);color:var(--bg)}.bar button{color:var(--fg)}
#tb b,.lg span{background:var(--sh) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
#tb b{animation:shine 6s linear infinite}
.post{margin:10px 12px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card)}
.comp{border:1px solid var(--line)}nav{backdrop-filter:blur(12px)}
.bm{opacity:.45}.bm.on{opacity:1}.pr{flex-wrap:wrap}
#ann{padding:8px 14px;background:var(--sh);color:#000;font-weight:600;font-size:13px;text-align:center}#app.out #ann{display:none}
.cov{height:130px;background:radial-gradient(circle at 20% 30%,#ffd97866,transparent 50%),radial-gradient(circle at 80% 60%,#8fe3ff55,transparent 55%),linear-gradient(135deg,#000,#2a2a30)}
.pfc{margin:-48px 12px 0;position:relative;display:grid;gap:10px;justify-items:center;text-align:center}
.rng{padding:3px;border-radius:50%}.rng .av{border:3px solid var(--bg)}
.pfn h2{display:flex;justify-content:center;align-items:center}
.pst{display:grid;grid-template-columns:repeat(4,1fr);width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 0}.pst b{display:block;font-size:18px}.pst small{font-size:12px}
.pt button{font-weight:700;font-size:13px}.gr{gap:6px;padding:8px}.tl{aspect-ratio:1;border-radius:14px}
.atb{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}.atb button{flex:none;border:1px solid var(--line);background:none;border-radius:16px;padding:6px 14px;font-weight:700}.atb .on{color:#000;border-color:transparent}
.stg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}.stc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.stc b{display:block;font-size:26px}
.sb textarea{width:100%;border:0;background:var(--card);color:var(--fg);padding:11px 16px;border-radius:16px;font:inherit;min-height:90px}
.ht{font-weight:700;text-decoration:underline dotted;cursor:pointer}.bd{background:#f02849;color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}.pst>div{cursor:pointer}

/* Amlink signature shine: consistent brand accent for live and primary actions. */
.am-shine{background:linear-gradient(110deg,#7c5cff 0%,#ff4fb8 48%,#ff9b42 100%);color:#fff;border:0}
#am-live-stage{border-radius:18px;overflow:hidden}

/* Reels interaction completion */
#app.reels-mode .reel .rmeta{display:flex;align-items:center;gap:8px}
#app.reels-mode .reel .rmeta .av{width:34px;height:34px;border:1.5px solid #fff;cursor:pointer}
#app.reels-mode .reel .rmeta .rfb{margin-left:2px}
#app.reels-mode .reel .rmenu{position:absolute;z-index:8;right:12px;top:calc(env(safe-area-inset-top,0px) + 48px);border:1px solid #ffffff55;border-radius:12px;background:#171717ed;color:#fff;padding:7px;display:grid;min-width:150px;box-shadow:0 8px 24px #0008}
#app.reels-mode .reel .rmenu button{border:0;background:none;color:#fff;text-align:left;padding:10px;border-radius:8px;font-size:13px}
#app.reels-mode .reel .rmenu button:active{background:#ffffff22}
#app.reels-mode .reel .rvm{display:grid;place-items:center}
#app.reels-mode .reel .rplay{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:50%;width:58px;height:58px;background:#0007;color:#fff;font-size:27px;display:none}
#app.reels-mode .reel.paused .rplay{display:grid;place-items:center}
#app.reels-mode .reel .rbar{pointer-events:none}
#app.reels-mode .reel .rbar i{display:block;width:0;transition:width .15s linear}
#app.reels-mode .reel .rstats{display:flex;gap:12px;font-size:11px;opacity:.95}
@media(max-height:620px){#app.reels-mode .reel .rail{gap:8px}#app.reels-mode .reel .info{bottom:12px}}

/* Amlink graphical brand intro + strict signed-out screen isolation */
#am-intro{position:fixed;z-index:9999;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;overflow:hidden;background:radial-gradient(ellipse at 18% 18%,#b8f4ff 0,transparent 38%),radial-gradient(ellipse at 85% 78%,#d9ccff 0,transparent 42%),linear-gradient(145deg,#f8fdff,#fff 52%,#f8f5ff);color:#10131b;animation:introFade .7s ease 2.25s forwards;pointer-events:none}
#am-intro.done{display:none}
.intro-mark{width:82px;height:82px;border-radius:26px;display:grid;place-items:center;position:relative;background:linear-gradient(135deg,#18c8df,#5d5af6);box-shadow:0 18px 48px #5555, inset 0 1px 0 #ffffffaa;transform:translateY(12px) scale(.86);opacity:0;animation:introPop .75s cubic-bezier(.2,.85,.2,1) .12s forwards}

  <nav><button data-t="feed"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg>Home</button><button data-t="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.8 0 4.5 1.8 4.5 4.5"/></svg>Friends</button><button data-t="games"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5M16 11.5h.01M18.5 14h.01"/></svg>Games</button><button class="pl2" data-a="plus" aria-label="Create">+</button><button data-t="alerts"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H9l-5 4z"/></svg>Inbox<b id="nb" hidden></b></button><button data-t="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Profile</button></nav>
  <div id="scrim" data-a="cs"></div>
  <section id="sh" aria-label="Comments">
    <div class="top"><span id="sc">Comments</span><button data-a="cs" aria-label="Close comments">×</button></div>
    <div id="sl"></div>
    <div class="bar"><input id="ci" placeholder="Add a comment…" maxlength="300" autocomplete="off"><button data-a="pc">Post</button></div>
  </section>
  <div id="dsc" data-a="dc"></div>
  <aside id="dr" aria-label="Menu"></aside>
  <div id="au" hidden><div class="ah"><button data-a="ab2" aria-label="Back">‹</button><div class="dots" id="dots"></div></div><div id="st"></div></div>
  <div id="md" hidden></div>
  <div id="ts" hidden></div>
</div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const VB='<svg class="vb" aria-label="Verified"><use href="#vf"/></svg>';
let T=null,ME,tab='feed',posts=[],cur,ppl=[],peer,poll,th='dark',gid,mut=true,rf='y',SG={};
try{T=localStorage.getItem('tk');th=localStorage.getItem('th')||th}catch(e){}
document.documentElement.dataset.t=th;
let CS={snd:1,pop:1,con:1};try{CS=Object.assign(CS,JSON.parse(localStorage.getItem('cs')||'{}'))}catch(e){}
const PB='<span class="am-president-badge" title="Community President" aria-label="Community President">♛ President</span>';
const nm=u=>(u.Nc?'<span class="'+E(u.Nc)+'">'+E(u.Username||'user')+'</span>':E(u.Username||'user'))+(u.Verified?VB:'')+(u.President?PB:'')+(u.Bd&&window.bdg?bdg(u.Bd):'');
const ago=t=>{const m=(Date.now()/1000-t)/60|0;return m<1?'now':m<60?m+'m':m<1440?(m/60|0)+'h':(m/1440|0)+'d'};
async function A(p,b){const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'X-Token':T||'','Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json();if(r.status==401&&T)out();if(j&&j.error)throw new Error(j.error);return j}
function toast(m){const t=$('#ts');t.textContent=m;t.hidden=false;clearTimeout(t.x);t.x=setTimeout(()=>t.hidden=true,2200)}
function out(){try{localStorage.removeItem('tk')}catch(e){}location.reload()}
function modal(h,keep){const m=$('#md');m.innerHTML='<div class="box">'+h+'</div>';m.dataset.k=keep?1:'';m.hidden=false}
const closeM=()=>$('#md').hidden=true;
$('#md').onclick=e=>{if(e.target.id=='md'&&!e.target.dataset.k)closeM()};

async function boot(){
  // Start in a clean signed-out state; only app() may reveal the app shell.
  const root=$('#app'),login=$('#login');
  if(root)root.classList.add('out');
  if(login)login.hidden=false;
  let c={};for(let n=0;n<3&&!c.Fb;n++){try{c=await A('config')}catch(e){await new Promise(r=>setTimeout(r,1200))}}
  try{if(window.firebase&&c.Fb&&c.Fb.apiKey){firebase.initializeApp(c.Fb);FB=firebase.auth()}}catch(e){}
  if(T){try{ME=await A('me');return app()}catch(e){}}
  if(!c.Client){const g=$('#gbtn');if(g)g.hidden=true;if(!c.Fb||!c.Fb.apiKey)$('#le').textContent='The server is not set up for sign-in yet. Check the environment settings on Render.';return}
  if(!window.google){$('#le').textContent='Google sign-in could not load. Check your connection and refresh.';return}
  google.accounts.id.initialize({client_id:c.Client,callback:async r=>{try{const j=await A('login',{credential:r.credential});T=j.token;try{localStorage.setItem('tk',T)}catch(e){}ME=j.me;app()}catch(e){$('#le').textContent=e.message}}});
  google.accounts.id.renderButton($('#gbtn'),{theme:'outline',size:'large',shape:'pill'});
}
function app(){$('#login').hidden=true;$('#app').classList.remove('out');const intro=$('#am-intro');if(intro){intro.classList.add('done');intro.remove()}ME.Username?go('feed'):askName(1);bell()}
function askName(first){
  modal(`<h3>${first?'Choose a username':'Change username'}</h3><input id="un" placeholder="letters, numbers and _" maxlength="20" autocomplete="off"><p class="er" id="er"></p><button class="pri" id="sv">Save</button>`,first);
  $('#sv').onclick=async()=>{try{ME=await A('username',{u:$('#un').value});closeM();go(first?'feed':tab)}catch(e){$('#er').textContent=e.message}};
}
async function go(t){
  document.getElementById('app')?.classList.remove('chat-open');
  tab=t;clearInterval(poll);if(t!=='reels'){if(reelObserver){reelObserver.disconnect();reelObserver=null}clearInterval(reelProgressTimer)}$('#app').classList.remove('cs','dro');$('#app').classList.toggle('reels-mode',t==='reels');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==(t=='reels'?'feed':t)));
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
  $('#main').innerHTML='';
  try{if(t=='feed'||t=='reels'){posts=await A('feed');t=='feed'?home():reels()}else if(t=='people')people();else if(t=='alerts')alerts();else if(t=='circles')await circles();else if(t=='bc')await bcs();else await profile()}catch(e){toast(e.message)}
}
document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.t)go(b.dataset.t)};


var mediaH=p=>p.Media?(p.Kind=='video'?`<video src="${E(p.Media)}" controls playsinline preload="metadata"></video>`:`<img src="${E(p.Media)}" loading="lazy" alt="">`):'';
const folB=u=>u.ID==ME.ID?'':`<button class="fl" data-a="fol" data-i="${u.ID}"></button>`;
var postH=p=>`<article class="post"><header>${AV(p.U)}<div><div class="nm">${nm(p.U)}</div><small>${ago(p.TS)}</small></div>${folB(p.U)}${p.U.ID==ME.ID||ME.Admin?`<button class="dl" data-a="delp" data-i="${p.ID}">Delete</button>`:''}</header>${p.Text?`<p>${tg(p.Text)}</p>`:''}${mediaH(p)}<footer><button class="lk" data-a="like" data-i="${p.ID}">♡ Like <span></span></button><button class="cm" data-a="cm" data-i="${p.ID}">▤ Comment <span></span></button></footer></article>`;
function upd(p){posts=posts.map(x=>x.ID==p.ID?p:x);if(cur&&cur.ID==p.ID)cur=p;paint()}
function home(){$('#main').innerHTML=`<div class="comp" data-a="new">What’s on your mind, ${E(ME.Username)}?</div>`+(posts.map(postH).join('')||'<p class="empty">No posts yet. Be the first to share something.</p>');paint();strip()}

/* Moments (24h status) */
async function strip(){
  try{
    const l=await A('statuses');SG={};
    l.forEach(s=>(SG[s.U.ID]=SG[s.U.ID]||{U:s.U,L:[]}).L.push(s));
    const h='<div class="ms2"><button class="mo" data-a="sa"><b class="av">＋</b><span>Your moment</span></button>'+Object.values(SG).map(x=>`<button class="mo" data-a="sv" data-i="${x.U.ID}"><b class="av">${E((x.U.Username||'?')[0])}</b><span>${E(x.U.Username)}</span></button>`).join('')+'</div>';
    const c=$('.comp');if(c&&tab=='feed')c.insertAdjacentHTML('beforebegin',h);
  }catch(e){}
}
function sview(id){
  const L=SG[id].L;let i=0;
  const show=()=>{if(i>=L.length){closeM();return}const s=L[i];
    modal(`<div style="display:grid;gap:10px"><b>${nm(s.U)} <small>${ago(s.TS)} · ${i+1}/${L.length}</small></b>${mediaH(s)}${s.Text?`<p style="font-size:18px;white-space:pre-wrap">${E(s.Text)}</p>`:''}<small>Tap to continue</small></div>`);
    $('#md .box').onclick=()=>{i++;show()}};
  show();
}
async function cfmanage(){
  const [friends,chosen]=await Promise.all([A('friends'),A('closefriends')]);
  const ids=new Set(chosen.map(x=>x.ID));
  modal('<h3>Close friends</h3><p class="sub">Only people on this list can see moments shared with Close friends. They are not notified when you add or remove them.</p>'+friends.map(u=>`<div class="pr">${AV(u)}<div class="nm">${nm(u)}</div><button class="ed" data-a="cft" data-i="${u.ID}">${ids.has(u.ID)?'Remove':'Add'}</button></div>`).join('')+'<button class="pri sec" data-a="mc">Done</button>');
}
function sadd(){
  modal('<h3>New moment</h3><textarea id="tx" placeholder="What’s happening? It disappears in 24 hours." maxlength="300"></textarea><label class="fl2">Who can see it?<select id="staud"><option value="followers">Followers</option><option value="close">Close friends only</option></select></label><button class="ed" data-a="cfm">Manage close friends</button><input id="fi" type="file" accept="image/*,video/*"><p class="er" id="er"></p><button class="pri" id="pub">Share moment</button>');
  $('#pub').onclick=async()=>{const f=$('#fi').files[0],b=$('#pub');b.disabled=true;
    try{let m='',k='';if(f){m=await up(f);k=f.type.startsWith('video')?'video':'image'}
      await A('status',{text:$('#tx').value,media:m,kind:k,audience:$('#staud').value});closeM();go('feed')}
    catch(e){$('#er').textContent=e.message;b.disabled=false}};
}

/* Reels: full-screen feed with real account-backed interactions */
let reelObserver=null,reelProgressTimer=null,reelActiveId='';
function reelCount(n){return n>=1000000?(n/1000000).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(n||0)}
function reelLiked(p){return (p.Likes||[]).includes(ME.ID)}
function reelSaved(id){return SV().includes(id)}
async function reels(){
  if(reelObserver){reelObserver.disconnect();reelObserver=null}clearInterval(reelProgressTimer);
  try { const ranked=await A('reelsfeed?n=80'+(rf==='f'?'&mode=following':'')); if(Array.isArray(ranked)) posts=ranked; } catch(e) { /* keep already-loaded feed as offline fallback */ }
  let v=posts.filter(p=>p.Kind==='video'&&p.Media);
  if(rf==='f')v=v.filter(p=>(ME.Following||[]).includes(p.U.ID)||p.U.ID===ME.ID);
  if(rf==='y')v=[...v].sort((a,b)=>(b.TS||0)-(a.TS||0));
  const card=p=>`<section class="reel" data-reel="${E(p.ID)}">
    <video data-a="pp" data-i="${E(p.ID)}" src="${E(p.Media)}" loop ${mut?'muted ':''}playsinline webkit-playsinline preload="metadata" aria-label="Video by ${E(p.U.Username)}"></video>
    <div class="shade"></div><div class="am-watermark" aria-label="Amlink watermark"><b>A</b> Amlink</div><button class="rplay" data-a="pp" data-i="${E(p.ID)}" aria-label="Play or pause">▶</button>
    <div class="rt"><button data-a="rf" data-v="f" class="${rf==='f'?'on':''}">Following</button><button data-a="rf" data-v="y" class="${rf==='y'?'on':''}">For You</button></div>
    <div class="info"><div class="rmeta"><span data-a="pf" data-i="${E(p.U.ID)}">${AV(p.U)}</span><b>@${E(p.U.Username)}${p.U.Verified?VB:''}${p.U.President?PB:''}</b>${p.U.ID===ME.ID?'':`<button class="rfb" data-a="rfol" data-i="${E(p.U.ID)}">${(ME.Following||[]).includes(p.U.ID)?'Following':'Follow'}</button>`}</div>
    <span class="rcp">${E(p.Text||'')}</span><span class="rmu">♫ Original audio · @${E(p.U.Username)}</span></div>
    <div class="rail"><div class="ra" data-a="pf" data-i="${E(p.U.ID)}">${AV(p.U)}</div>
    <button class="lk ${reelLiked(p)?'on':''}" data-a="like" data-i="${E(p.ID)}" aria-label="Like reel">${reelLiked(p)?'♥':'♡'}<span>${reelCount((p.Likes||[]).length)}</span></button>
    <button class="cm" data-a="cm" data-i="${E(p.ID)}" aria-label="Comments">▤<span>${reelCount((p.C||[]).length)}</span></button>
    <button data-a="sh" data-i="${E(p.ID)}" aria-label="Share reel">➤<span>Share</span></button>
    <button class="${reelSaved(p.ID)?'on':''}" data-a="rbm" data-i="${E(p.ID)}" aria-label="Save reel">${reelSaved(p.ID)?'🔖':'♧'}<span>Save</span></button>
    <button data-a="rmore" data-i="${E(p.ID)}" aria-label="More options">⋯<span>More</span></button>
    </div><div class="rbar"><i></i></div></section>`;
  $('#main').innerHTML='<div class="rl" id="reel-feed">'+(v.length?v.map(card).join(''):'<p class="empty" style="color:#fff;padding:30vh 24px">No reels yet. Share a video using ＋ to start your Reels feed.</p>')+'</div>';
  const feed=$('#reel-feed');if(!feed)return;
  reelObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{
    const section=entry.target,video=section.querySelector('video');
    if(entry.isIntersecting){reelActiveId=section.dataset.reel;if(!section.dataset.viewSent){section.dataset.viewSent='1';A('reelview',{id:reelActiveId}).catch(()=>{})}if(!section.dataset.eventsBound){section.dataset.eventsBound='1';const vv=section.querySelector('video');vv.addEventListener('ended',()=>A('reelsignal',{id:section.dataset.reel,kind:'complete'}).catch(()=>{}));vv.addEventListener('pause',()=>{if(vv.currentTime>2&&vv.duration&&vv.currentTime/vv.duration<.25)A('reelsignal',{id:section.dataset.reel,kind:'skip'}).catch(()=>{})})}document.querySelectorAll('.reel video').forEach(other=>{if(other!==video)other.pause()});video.play().then(()=>section.classList.remove('paused')).catch(()=>section.classList.add('paused'))}
    else {video.pause();section.classList.remove('paused')}
  }),{root:feed,threshold:.72});
  document.querySelectorAll('.reel').forEach(section=>reelObserver.observe(section));
  // Update the thin progress line without forcing a React-style full rerender.
  reelProgressTimer=setInterval(()=>{const sec=document.querySelector(`.reel[data-reel="${CSS.escape(reelActiveId)}"]`),video=sec&&sec.querySelector('video'),bar=sec&&sec.querySelector('.rbar i');if(video&&bar&&video.duration)bar.style.width=(video.currentTime/video.duration*100)+'%'},150);
  // Support shared reel links opened on another device.
  const match=location.hash.match(/^#reel=([^&]+)/);if(match){const target=document.querySelector(`.reel[data-reel="${CSS.escape(decodeURIComponent(match[1]))}"]`);if(target)setTimeout(()=>target.scrollIntoView({behavior:'instant',block:'start'}),100)}
}
function reelMore(id){
  const p=posts.find(x=>x.ID===id);if(!p)return;
  const old=document.querySelector('.reel .rmenu');if(old)old.remove();
  const sec=document.querySelector(`.reel[data-reel="${CSS.escape(id)}"]`);if(!sec)return;
  sec.insertAdjacentHTML('beforeend',`<div class="rmenu"><button data-a="rbm" data-i="${E(id)}">${reelSaved(id)?'Remove saved reel':'Save reel'}</button><button data-a="rreport" data-i="${E(id)}">Report reel</button>${p.U.ID===ME.ID||ME.Admin?`<button data-a="delp" data-i="${E(id)}">Delete reel</button>`:''}<button data-a="rclose">Cancel</button></div>`);
}
async function reelShare(id){
  const url=location.origin+location.pathname+'#reel='+encodeURIComponent(id),p=posts.find(x=>x.ID===id);A('reelsignal',{id,kind:'share'}).catch(()=>{});
  const data={title:'Amlink Reel',text:(p&&p.Text)||'Watch this reel on Amlink',url};
  if(navigator.share){try{await navigator.share(data);return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(url);toast('Reel link copied')}catch(e){prompt('Copy this reel link',url)}
}

/* Comments */
function sheet(id){cur=posts.find(p=>p.ID==id);$('#app').classList.add('cs');sl()}

const stat=u=>u.On?'Online':u.Seen?'Last seen '+(ago(u.Seen)=='now'?'just now':ago(u.Seen)+' ago'):'';
function people(){
  $('#main').innerHTML='<div class="ch2"><b>Friends</b><button data-a="cset" aria-label="Chat settings">⋯</button></div><div class="sb"><input id="q" placeholder="Search people by username" autocomplete="off"></div><div id="pl"></div>';
  let t;$('#q').oninput=()=>{clearTimeout(t);t=setTimeout(pl,250)};pl();
}
async function pl(){try{const q=$('#q').value;ppl=(!CS.con&&!q)?[]:await A(q?'search?q='+encodeURIComponent(q):'friends');drawP()}catch(e){toast(e.message)}}
function drawP(){
  const on=ppl.filter(u=>u.On),off=ppl.filter(u=>!u.On).sort((a,b)=>(b.Seen||0)-(a.Seen||0)),q=$('#q')&&$('#q').value;
  const row=u=>`<div class="pr"><span class="avw" data-a="pf" data-i="${u.ID}">${AV(u)}${u.On?'<i class="od"></i>':''}</span><div class="nm" data-a="pf" data-i="${u.ID}">${nm(u)}<br><small>${stat(u)}</small></div><button class="fl" data-a="fol" data-i="${u.ID}"></button><button data-a="dm" data-i="${u.ID}">Message</button>${ME.Admin?`<button data-a="ver" data-i="${u.ID}">${u.Verified?'Unverify':'Verify'}</button>`:''}</div>`;
  const h=(t,n)=>n?`<p class="sg" style="padding:14px 16px 4px">${t} (${n})</p>`:'';
  $('#pl').innerHTML=(ppl.length?'':'<p class="empty">Search a username to find people. People you follow and anyone online show up here.</p>')+(q?ppl.map(row).join(''):h('Online now',on.length)+on.map(row).join('')+h('Offline',off.length)+off.map(row).join(''));
  paint();
}
async function chat(u){
  peer=u;$('#app').classList.add('chat-open');clearInterval(poll);$('#main').innerHTML=`<div class="ch"><div class="chh"><button data-a="back" aria-label="Back">‹</button><div><b>${nm(u)}</b><br><small>${stat(u)}</small></div></div><div class="ms" id="ms"></div><div class="bar"><label class="at" aria-label="Attach photo or video">📎<input id="mf" type="file" accept="image/*,video/*" hidden></label><input id="mi" placeholder="Message…" autocomplete="off"><button data-a="mic" id="mic" aria-label="Record voice note">🎤</button><button data-a="send">Send</button></div></div>`;
  $('#mi').onkeydown=e=>{if(e.key=='Enter')send()};$('#mf').onchange=()=>sendFile($('#mf').files[0]);
  await L();poll=setInterval(()=>L().catch(()=>{}),3000);
}
async function send(){const i=$('#mi'),t=i.value.trim();if(!t)return;i.value='';await A('msg',{to:peer.ID,text:t});await L()}

/* Circles (group chats) */
async function circles(){
  const g=await A('groups');
  $('#main').innerHTML='<div class="ch2"><b>Circles</b><button data-a="gn" aria-label="New circle">＋</button></div>'+(g.map(x=>`<button class="di" style="padding:10px 16px" data-a="go" data-i="${x.ID}" data-n="${E(x.Name)}"><i style="background:#7c5cff">${E(x.Name[0].toUpperCase())}</i><span>${E(x.Name)}<small>${x.N} members${x.Last?' · '+E(x.Last):''}</small></span></button>`).join('')||'<p class="empty">No circles yet. Tap ＋ to start a group chat.</p>');
}
function gnew(){
  const sel=new Set();
  modal('<h3>New circle</h3><input id="gnm" placeholder="Circle name" maxlength="40" autocomplete="off"><input id="gq" placeholder="Search people to add" autocomplete="off"><div id="gls" style="max-height:200px;overflow:auto"></div><p class="er" id="er"></p><button class="pri" id="gc">Create circle</button>');
  const draw=async()=>{try{const l=await A('search?q='+encodeURIComponent($('#gq').value));
    $('#gls').innerHTML=l.map(u=>`<label class="row"><span>${nm(u)}</span><input type="checkbox" data-id="${u.ID}"${sel.has(u.ID)?' checked':''}></label>`).join('')||'<p class="empty">Follow people or search a username.</p>'}catch(e){}};
  $('#gls').onchange=e=>{e.target.checked?sel.add(e.target.dataset.id):sel.delete(e.target.dataset.id)};
  let t;$('#gq').oninput=()=>{clearTimeout(t);t=setTimeout(draw,250)};draw();
  $('#gc').onclick=async()=>{const n=$('#gnm').value;try{const j=await A('gcreate',{name:n,members:[...sel].join(',')});closeM();gopen(j.id,n)}catch(e){$('#er').textContent=e.message}};
}
async function gload(){const m=await A('gmsgs?g='+gid),b=$('#ms');if(!b)return;b.innerHTML=m.map(x=>`<div class="m ${x.Me?'me':''}">${x.Me?'':'<small>'+nm(x.U)+'</small><br>'}${E(x.Text)}</div>`).join('');b.scrollTop=b.scrollHeight}
async function gopen(id,n){
  gid=id;tab='circles';clearInterval(poll);
  $('#main').innerHTML=`<div class="ch"><div class="chh"><button data-a="cb" aria-label="Back">‹</button><b>${E(n)}</b></div><div class="ms" id="ms"></div><div class="bar"><input id="mi" placeholder="Message the circle…" autocomplete="off"><button data-a="gs">Send</button></div></div>`;

/* ================= 1. VIDEO SAFETY CHECK: 3 still frames are checked before upload ================= */
async function scanVideo(f){
  const v=document.createElement('video'),url=URL.createObjectURL(f);v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
  const bad=()=>new Error('We could not check this video. Try an MP4 file.');
  try{
    await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(bad());setTimeout(()=>rej(bad()),15000)});
    const d=v.duration&&isFinite(v.duration)?v.duration:(f.xdur||1),c=document.createElement('canvas'),frames=[];
    for(const p of [.1,.5,.9]){
      await new Promise(r=>{v.onseeked=r;v.currentTime=Math.min(d*p,Math.max(0,d-.1));setTimeout(r,4000)});
      const k=Math.min(1,640/Math.max(v.videoWidth||640,v.videoHeight||640));
      c.width=Math.round((v.videoWidth||320)*k);c.height=Math.round((v.videoHeight||240)*k);
      c.getContext('2d').drawImage(v,0,0,c.width,c.height);frames.push(c.toDataURL('image/jpeg',.7))}
    const r=await fetch('/api/vscan',{method:'POST',headers:{'X-Token':T,'Content-Type':'application/json'},body:JSON.stringify({frames})}),j=await r.json();
    if(j.error)throw new Error(j.error);return j.token||''}
  finally{URL.revokeObjectURL(url)}}

  else{if(XF.some(x=>x.type.startsWith('video/')))XF=[];XF=[...XF,...imgs].slice(0,10)}

function meta(){const m=$('#stmeta');if(!m)return;const eb=$('#stedit');if(eb)eb.hidden=!(ST.k=='reel'&&ST.f);const f=ST.k=='reel'?ST.f:XF[ST.i];m.textContent=f?(ST.dur?dur(ST.dur)+' · ':'')+mb(f.size):''}
async function frames(file,n){
  const v=document.createElement('video'),url=URL.createObjectURL(file);v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
  try{
    await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(new Error('x'));setTimeout(()=>rej(new Error('t')),10000)});
    const d=isFinite(v.duration)?v.duration:(file.xdur||0),w=v.videoWidth||360,h=v.videoHeight||640,k=Math.min(1,480/Math.max(w,h)),c=document.createElement('canvas');
    c.width=Math.round(w*k);c.height=Math.round(h*k);const x=c.getContext('2d'),fr=[];
    for(let i=0;i<n;i++){
      await new Promise(r=>{v.onseeked=r;v.currentTime=Math.min(Math.max(0,d*(i+.5)/n),Math.max(0,d-.05));setTimeout(r,2500)});
      x.drawImage(v,0,0,c.width,c.height);fr.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.82)))}
    return{d,fr:fr.filter(Boolean)}}
  finally{URL.revokeObjectURL(url)}}
async function makeCovers(){
  const f=ST.f;if(!f)return;thumbs();let r=null;try{r=await frames(f,7)}catch(e){}
  if(f!==ST.f)return;
  if(!r||!r.fr.length){ST.cuu=[];const b=$('#stcv');if(b)b.hidden=true;return}
  if(r.d>61&&!f.xdur){ST.dur=r.d;toast('Trim your video to 60 seconds or less');thumbs();meta();if(window.XVE)XVE.open(f);return}
  ST.dur=r.d;ST.cvs=r.fr;ST.cuu=r.fr.map(x=>URL.createObjectURL(x));ST.ci=0;thumbs();meta();showCv()}
function showCv(){const z=$('#stpv'),v=z&&z.querySelector('video');if(!z||!v)return;let i=z.querySelector('.cvov');const u=ST.cuu[ST.ci];

function stuClose(ask){

async function stuPost(){
  const R=ST.k=='reel',b=$('#stup'),er=$('#ster'),text=$('#stc').value.trim(),st=t=>{const s=$('#stst');if(s)s.textContent=t};er.textContent='';
  const sch=$('#stsc').checked;let at=0;
  if(sch){const v=$('#stdt').value;at=v?Math.floor(new Date(v).getTime()/1000):0;if(!at||at<Date.now()/1000+120){er.textContent='Pick a time at least 2 minutes from now.';return}}
  let poll='';const po=$('#stpo');
  if(po&&po.checked){poll=$$('.stp1').map(x=>x.value.trim()).filter(Boolean).join('|');if(poll.split('|').length<2){er.textContent='A poll needs at least 2 options.';return}}
  if(R&&!ST.f){er.textContent='Choose a video first.';return}
  if(R&&ST.dur>61&&!ST.f.xdur){er.textContent='Trim the video to 60 seconds or less.';return}
  if(!R&&!XF.length&&!text&&!poll){er.textContent='Write something or add a photo or video.';return}
  b.disabled=true;$('#stub').hidden=false;
  try{
    const files=R?[ST.f]:XF,urls=[];
    for(let i=0;i<files.length;i++){st(files[i].type.startsWith('video/')?'Checking and uploading video…':'Uploading '+(i+1)+' of '+files.length+'…');urls.push(await up(files[i]))}
    let poster='';if(R&&ST.cvs[ST.ci]){st('Saving your cover…');try{poster=await up(new File([ST.cvs[ST.ci]],'cover.jpg',{type:'image/jpeg'}))}catch(e){poster=''}}
    if(!R&&files[0]&&files[0].type.startsWith('image/')&&window.thumbOf){st('Making a preview…');try{poster=await up(await thumbOf(files[0]))}catch(e){poster=''}}
    st(sch?'Scheduling…':'Posting…');
    const kind=files[0]?(files[0].type.startsWith('video/')?'video':'image'):'';
    const r=await A('post4',{text,media:urls.join(','),kind,poll,sens:$('#stse').checked?'1':'',poster,alt:($('#sta')||{}).value||'',cm:$('#stcm').value,at:at||'',dur:R?(ST.dur||''):'',duet:window.XDUET||''});
    stuClose(false);
    if(r.scheduled)toast('Scheduled for '+when(r.scheduled*1000));
    else{toast(R?'Your reel is live 🎬':'Posted');go(R?'reels':'feed')}}
  catch(e){er.textContent=e.message;b.disabled=false;$('#stub').hidden=true;st('')}}

function arcade(){modal('<h3>Arcade</h3><div class="ctl"><button data-a="gplay" data-g="snake"><i>🐍</i>Snake<small>Eat, grow, do not crash</small></button><button data-a="gplay" data-g="memory"><i>🧠</i>Memory Match<small>Fewer moves, higher score</small></button><button data-a="gplay" data-g="taprush"><i>⚡</i>Tap Rush<small>Test your reaction speed</small></button><button data-a="gplay" data-g="tilemerge"><i>🔢</i>2048<small>Merge matching tiles</small></button><button data-a="gword"><i>🔤</i>Daily Word<small>One puzzle a day</small></button></div>')}

async function lboards(){

  const sec=(t,l)=>`<p class="sg" style="padding:0">${t}</p>`+(l.map((r,i)=>`<div class="pr"><b>${i+1}</b>${AV(r.U)}<div class="nm">${nm(r.U)}</div><b>${r.V}</b></div>`).join('')||'<small class="sub">No scores yet</small>');
  modal('<h3>Leaderboards</h3>'+sec('⭐ Top XP',x)+sec('🐍 Snake',s)+sec('🧠 Memory',m))}

async function submit(g,s){try{const j=await A('gscore',{game:g,score:s,tok:(window.XTOK&&XTOK[g])||''});toast(j.New?'New best: '+j.Best+' 🎉':'Score '+s+' · best '+j.Best);const bx=document.querySelector('#md .box');if(bx&&!bx.querySelector('[data-a=shsc]'))bx.insertAdjacentHTML('beforeend',`<button class="pri" data-a="shsc" data-g="${g}" data-s="${s}">📤 Challenge friends to beat ${s}</button>`)}catch(e){toast(e.message)}}

function snake(){
  window.XTOK=window.XTOK||{};A('gstart',{game:'snake'}).then(j=>{XTOK.snake=j.tok}).catch(()=>{});
  modal('<h3>Snake</h3><canvas id="snc" width="300" height="300" style="width:100%;max-width:300px;margin:0 auto;display:block;background:#000;border-radius:12px;touch-action:none"></canvas><p id="sn1" class="sub" style="text-align:center">Score 0 · swipe or use arrow keys</p><div class="act" style="justify-content:center"><button class="ed" data-a="sdir" data-d="-1,0">◀</button><button class="ed" data-a="sdir" data-d="0,-1">▲</button><button class="ed" data-a="sdir" data-d="0,1">▼</button><button class="ed" data-a="sdir" data-d="1,0">▶</button></div>');
  const c=$('#snc'),x=c.getContext('2d'),N=15,Z=20;
  let sn=[[7,7],[6,7],[5,7]],d=[1,0],nd=d,sc=0,f,t;
  const pl=()=>{let p;do p=[Math.random()*N|0,Math.random()*N|0];while(sn.some(s=>s[0]==p[0]&&s[1]==p[1]));return p};f=pl();
  const dir=(a,b)=>{if(!(a==-d[0]&&b==-d[1]))nd=[a,b]};window.SDIR=dir;
  const kd=e=>{const m={ArrowLeft:[-1,0],ArrowUp:[0,-1],ArrowDown:[0,1],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();dir(...m)}};
  document.addEventListener('keydown',kd);
  let sx,sy;c.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};
  c.ontouchend=e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;Math.abs(dx)>Math.abs(dy)?dir(dx>0?1:-1,0):dir(0,dy>0?1:-1)};
  const stop=()=>{clearInterval(t);document.removeEventListener('keydown',kd)};
  t=setInterval(()=>{
    if(!$('#snc')){stop();return}
    d=nd;const h=[sn[0][0]+d[0],sn[0][1]+d[1]];
    if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||sn.some(s=>s[0]==h[0]&&s[1]==h[1])){stop();$('#sn1').textContent='Game over · score '+sc;if(sc>0)submit('snake',sc);return}
    sn.unshift(h);if(h[0]==f[0]&&h[1]==f[1]){sc+=10;f=pl();$('#sn1').textContent='Score '+sc}else sn.pop();
    x.fillStyle='#000';x.fillRect(0,0,300,300);x.fillStyle='#fe2c55';x.fillRect(f[0]*Z,f[1]*Z,Z-2,Z-2);
    x.fillStyle='#8fe3ff';sn.forEach(s=>x.fillRect(s[0]*Z,s[1]*Z,Z-2,Z-2))},120)}

function memory(){
  window.XTOK=window.XTOK||{};A('gstart',{game:'memory'}).then(j=>{XTOK.memory=j.tok}).catch(()=>{});
  const em=['🍎','🚀','🎧','🔥','🐱','⚽'],cards=[...em,...em].sort(()=>Math.random()-.5),done=new Set();let op=[],mv=0,lock=false;const t0=Date.now();
  modal('<h3>Memory Match</h3><p id="mmv" class="sub" style="text-align:center">Moves 0</p><div id="mg" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>');
  const draw=()=>{const g=$('#mg');if(!g)return;g.innerHTML=cards.map((e,i)=>`<button class="ed" data-i="${i}" style="font-size:30px;height:72px">${done.has(i)||op.includes(i)?e:'❓'}</button>`).join('');$('#mmv').textContent='Moves '+mv};
  draw();
  $('#mg').onclick=e=>{const b=e.target.closest('button');if(!b||lock)return;const i=+b.dataset.i;if(done.has(i)||op.includes(i))return;op.push(i);draw();
    if(op.length==2){mv++;lock=true;setTimeout(()=>{if(cards[op[0]]==cards[op[1]]){done.add(op[0]);done.add(op[1])}op=[];lock=false;draw();
      if(done.size==12){const s=Math.max(50,1000-mv*30-Math.floor((Date.now()-t0)/1000)*5);toast('Done in '+mv+' moves');submit('memory',s)}},600)}}}

$('#app').addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  try{
    if(a=='gh')ghub();
    else if(a=='gar')arcade();
    else if(a=='glb')lboards();
    else if(a=='gplay'){const k=b.dataset.g;k=='snake'?snake():k=='memory'?memory():k=='taprush'?window.XG.taprush():window.XG.tilemerge()}
    else if(a=='sdir'){const [x,y]=b.dataset.d.split(',').map(Number);window.SDIR&&window.SDIR(x,y)}
    else if(a=='gclaim'){const j=await A('gclaim',{});toast('You won 🪙 '+j.Won+'!');ghub()}
  }catch(x){toast(x.message)}});
window.XG={snake,memory};
})();
</script>

live=function(){
  if(es||!window.EventSource)return;
  const px=new EventTarget();es=px;let dly=1000,down=false,real=null;
  px.addEventListener('message',e=>{const d=e.data;
    if(d.startsWith('game:')){if(window.XGU)window.XGU(d.slice(5));return}
    if(d.startsWith('match:')){if(window.XGM)window.XGM(d.slice(6));return}

  }catch(x){toast(x.message)}});
})();
</script>

<script>
(()=>{
const GN={ttt:['❌⭕','Tic-Tac-Toe','X and O. First to get 3 in a row.'],c4:['🔴🟡','Connect 4','Drop discs and get 4 in a line.'],rps:['✊✋','Rock Paper Scissors','Best of 3, played live.'],chk:['🔴⚫','Checkers','Jump and capture. Reach the far side to become a king.'],bs:['🚢','Battleship','Find and sink the hidden fleet.'],dab:['🔲','Dots and Boxes','Close boxes to score. Complete one to go again.'],tri:['🧠','Trivia Battle','7 questions. Fastest minds win.']};
const RP={r:'✊',p:'✋',s:'✌️'};
const INTL={music:'🎵 Music',sports:'⚽ Sports',comedy:'😂 Comedy',gaming:'🎮 Gaming',food:'🍲 Food',travel:'✈️ Travel',fashion:'👗 Fashion',tech:'💻 Tech',art:'🎨 Art',study:'📚 Study'};
let GT='play',GID=null,QT=null,XC={},WJ=null;
const cp=l=>navigator.clipboard?navigator.clipboard.writeText(l).then(()=>toast('Link copied')):prompt('Copy link',l);

/* invite link: remember ?r=CODE until the person has an account */
try{const r=new URLSearchParams(location.search).get('r');if(r&&/^\w{4,10}$/.test(r)){localStorage.setItem('ref',r);history.replaceState(null,'','/')}}catch(e){}

/* interests: shared by the welcome tour and the menu */
window.XINT=Object.keys(INTL);
window.XINTH=(sel,lab)=>(lab===''?'':`<p class="sg" style="padding:0">${lab||'3. Pick your interests'}</p>`)+`<div class="chips" id="intc">${XINT.map(k=>`<button type="button" class="${sel.includes(k)?'sel':''}" data-a="intt" data-k="${k}">${INTL[k]}</button>`).join('')}</div>`;

/* small preview image for photo posts (used in grids) */
window.thumbOf=async f=>{const bm=await createImageBitmap(f),k=Math.min(1,480/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.7));if(!b)throw new Error('thumb');return new File([b],'thumb.jpg',{type:'image/jpeg'})};

/* ================= GAMES TAB ================= */
const go5=go;
go=async function(t){
  if(t!='games')return go5(t);
  tab='games';clearInterval(poll);$('#app').classList.remove('cs','dro','fs');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t=='games'));
  document.querySelectorAll('.seg button').forEach(b=>b.classList.remove('on'));
  await hub()};
async function hub(){
  let me={Coins:0,Level:1,Streak:0};try{me=await A('gme')}catch(e){}
  const tabs=[['play','🎮 Play'],['mine','⚔️ My games'],['cup','🏅 Cups'],['solo','🕹 Solo'],['3d','🌐 3D Worlds'],['rank','🏆 Rankings']];
  $('#main').innerHTML=`<div class="ch2"><b>Games</b><span class="gpill">🪙 ${me.Inf?'∞':me.Coins} · Lv ${me.Level} · 🔥 ${me.Streak}</span></div><div class="atb">${tabs.map(([k,l])=>`<button data-a="gtab" data-k="${k}" class="${GT==k?'on':''}">${l}</button>`).join('')}</div><div id="gbody"></div>`;
  await gbody()}
const stt=g=>g.Status=='active'?(g.Mine?'your move':'their move'):g.Status=='draw'?'draw':g.Status=='won'?(g.Win==ME.ID?'you won':'they won'):(g.Win==ME.ID?'they resigned':'you resigned');
async function gbody(){
  const box=$('#gbody');if(!box)return;let h='';
  try{
    if(GT=='play'){
      const mine=await A('gmine'),n=mine.filter(g=>g.Mine).length;
      h=(n?`<div class="gban" data-a="gtab" data-k="mine"><span>⚔️ ${n} game${n>1?'s':''} waiting for your move</span><span>Open ›</span></div>`:'')+
        Object.entries(GN).map(([k,v])=>`<div class="gc"><i>${v[0]}</i><div><b>${v[1]}</b><small>${v[2]}</small><div class="gcb"><button class="ed" data-a="gq" data-k="${k}">⚡ Quick match</button><button class="ed" data-a="gfr" data-k="${k}">👥 Challenge a friend</button></div></div></div>`).join('')+
        '<p class="sub" style="text-align:center;padding:8px 24px">Quick match pairs you with a random player who is waiting. You can also challenge anyone from a chat with the 🎮 button.</p>'}
    else if(GT=='mine'){
      const mine=await A('gmine');
      h=mine.map(g=>`<div class="pr" data-a="gopen" data-i="${g.ID}" style="cursor:pointer">${AV(g.Opp)}<div class="nm">${nm(g.Opp)}<br><small>${E(GN[g.Kind]?GN[g.Kind][1]:g.Kind)} · ${stt(g)}</small></div>${g.Mine?'<b class="bd">Your move</b>':''}</div>`).join('')||'<p class="empty">No games yet. Start one from the Play tab.</p>'}
    else if(GT=='3d'){
      h=window.X3D_HOME?window.X3D_HOME():`<div class="gc"><i>🏎️</i><div><b>Amlink Street Racer</b><small>Solo time trials and global/friends rankings.</small><button class="pri" data-a="am3d" data-g="streetracer">Play 3D racer</button></div></div>`}
    else if(GT=='solo'){
      h=`<div class="gc"><i>🐍</i><div><b>Snake</b><small>Eat, grow, do not crash. Top the leaderboard.</small><div class="gcb"><button class="ed" data-a="gplay" data-g="snake">▶ Play</button></div></div></div>
      <div class="gc"><i>🧠</i><div><b>Memory Match</b><small>Find all the pairs in the fewest moves.</small><div class="gcb"><button class="ed" data-a="gplay" data-g="memory">▶ Play</button></div></div></div>
      <div class="gc"><i>⚡</i><div><b>Tap Rush</b><small>Test your reaction. Tap only when the signal turns green.</small><div class="gcb"><button class="ed" data-a="gplay" data-g="taprush">▶ Play</button></div></div></div>
      <div class="gc"><i>🔢</i><div><b>2048</b><small>Merge matching tiles and build the biggest number.</small><div class="gcb"><button class="ed" data-a="gplay" data-g="tilemerge">▶ Play</button></div></div></div>
      <div class="gc"><i>🔤</i><div><b>Daily Word</b><small>One 5-letter puzzle a day. Same word for everyone.</small><div class="gcb"><button class="ed" data-a="gword">▶ Play today’s word</button></div></div></div>
      <p class="sg" style="padding:8px 16px 0">Rewards</p><div class="gcb" style="padding:0 12px 12px"><button class="ed" data-a="gh">🏆 Rewards hub</button><button class="ed" data-a="wal">👛 Wallet</button><button class="ed" data-a="boost">🚀 Boost</button><button class="ed" data-a="shop">🛍 Shop</button><button class="ed" data-a="inv">💌 Invite friends</button></div>`}
    else if(GT=='cup'){h=window.XCUP?await XCUP():''}
    else{
      const q=window.XRF?'&f=1':'';
      const [x,s,m,wn]=await Promise.all([A('gboard?g=xp'+q),A('gboard?g=snake'+q),A('gboard?g=memory'+q),A('gboard?g=wins'+q)]);
      const sec=(t,l)=>`<p class="sg" style="padding:8px 16px 0">${t}</p>`+(l.map((r,i)=>`<div class="pr"><b>${i+1}</b>${AV(r.U)}<div class="nm">${nm(r.U)}</div><b>${r.V}</b></div>`).join('')||'<small class="sub" style="padding:0 16px">No scores yet</small>');
      h=`<div class="atb"><button data-a="rkf" data-v="0" class="${window.XRF?'':'on'}">🌍 Everyone</button><button data-a="rkf" data-v="1" class="${window.XRF?'on':''}">👥 Friends</button></div>`+sec('⭐ Top XP',x)+sec('🏅 Most multiplayer wins',wn)+sec('🐍 Snake',s)+sec('🧠 Memory Match',m)}
  }catch(e){h='<p class="empty">'+E(e.message)+'</p>'}
  box.innerHTML=h}

/* choose a friend to challenge */
function friendPicker(kind){
  modal(`<h3>Challenge a friend</h3><p class="sub">${E(GN[kind][1])}</p><div class="sb" style="padding:0"><input id="gfq" placeholder="Search a username" autocomplete="off"></div><div id="gfl"></div>`);
  const draw=async()=>{const q=$('#gfq')?$('#gfq').value.trim():'';let l=[];try{l=q?await A('search?q='+encodeURIComponent(q)):await A('friends')}catch(e){}
    const b=$('#gfl');if(b)b.innerHTML=l.map(u=>`<div class="pr">${AV(u)}<div class="nm">${nm(u)}<br><small>${u.On?'Online':''}</small></div><button class="ed" data-a="gnw2" data-u="${u.ID}" data-k="${kind}">Challenge</button></div>`).join('')||'<p class="empty">Search a username, or follow people to see them here.</p>'};
  let t;$('#gfq').oninput=()=>{clearTimeout(t);t=setTimeout(draw,250)};draw()}

/* quick match */
async function quick(kind){
  const r=await A('gqjoin',{kind});
  if(r.id){gview(r.id);return}
  modal(`<h3>Finding a player</h3><div class="gq"><div class="ubar"><i></i></div><p class="sub" style="text-align:center">Waiting for another player to join ${E(GN[kind][1])}…</p><button class="pri sec" data-a="gqc">Cancel</button></div>`,true);
  let n=0;clearInterval(QT);
  QT=setInterval(async()=>{n++;
    if(!$('.gq')){clearInterval(QT);A('gqcancel',{}).catch(()=>{});return}
    try{const j=await A('gqpoll');if(j.id){clearInterval(QT);gview(j.id);return}}catch(e){}
    if(n>36){clearInterval(QT);A('gqcancel',{}).catch(()=>{});const q=$('.gq');if(q)q.innerHTML=`<p class="empty">No one else is online right now. Try challenging a friend instead.</p><button class="pri" data-a="gfr" data-k="${kind}">Challenge a friend</button>`}},2000)}

/* the game board */
async function gview(id){GID=id;drawGame(await A('gget?id='+id))}
window.XGD=drawGame;
function drawGame(g){
  window.XGC=g;GID=g.ID;const me=g.Me,opp=me==1?g.B:g.A,mt=g.Turn==ME.ID,act=g.Status=='active';
  let s;
  if(act)s=(g.Kind=='rps'||g.Kind=='tri')?(g.My?'Waiting for @'+opp.Username+'…':g.Kind=='tri'?'Pick your answer':'Pick your move'):(mt?'Your turn':'Waiting for @'+opp.Username+'…');
  else if(g.Status=='draw')s='It is a draw 🤝';
  else if(g.Win==ME.ID)s=g.Status=='resigned'?'You won, they resigned 🎉':'You won! 🎉';
  else s=g.Status=='resigned'?'You resigned':'@'+opp.Username+' won';
  let board='';
  if(g.Kind=='ttt')board='<div class="tb">'+g.Board.map((v,i)=>`<button data-a="gmv" data-m="${i}" ${(!act||!mt||v)?'disabled':''}>${v==1?'<span style="color:#ef4444">✕</span>':v==2?'<span style="color:#3b82f6">◯</span>':''}</button>`).join('')+'</div>';
  else if(g.Kind=='c4')board='<div class="c4">'+g.Board.map((v,i)=>`<button class="${v?'p'+v:''}" data-a="gmv" data-m="${i%7}" ${(!act||!mt)?'disabled':''} aria-label="Column ${i%7+1}"></button>`).join('')+'</div>';
  else if(g.Kind=='rps'){const mineL=me==1?g.L1:g.L2,theirL=me==1?g.L2:g.L1,sc=me==1?[g.S1,g.S2]:[g.S2,g.S1];
    board=`<div class="rsc"><b>You ${sc[0]}</b><span>–</span><b>${sc[1]} @${E(opp.Username)}</b></div>`+(g.Rd?`<div class="rrv"><span>${RP[mineL]||''}</span><small>vs</small><span>${RP[theirL]||''}</span></div><p class="sub" style="text-align:center">${g.LW==0?'Tie. Go again.':g.LW==me?'You won the round':'They won the round'}</p>`:'')+(act?`<div class="rpick">${['r','p','s'].map(k=>`<button data-a="gmv" data-m="${k}" ${g.My?'disabled':''} class="${g.My==k?'sel':''}">${RP[k]}</button>`).join('')}</div>`:'')}
  else if(window.XG2&&XG2[g.Kind])board=XG2[g.Kind](g,me,act,mt,opp);
  const mark=g.Kind=='ttt'?['✕','◯']:g.Kind=='c4'?['🔴','🟡']:g.Kind=='chk'?['🔴','⚫']:g.Kind=='dab'?['🟥','🟦']:['',''];
  const html=`<div id="gbd" data-g="${g.ID}" style="display:grid;gap:14px"><div class="gvs">${AV(g.A)}<b>${nm(g.A)} ${mark[0]}</b><span>vs</span>${AV(g.B)}<b>${nm(g.B)} ${mark[1]}</b></div><p class="gst">${E(s)}</p>${board}${act?'<button class="ed" data-a="grs">🏳 Resign</button>':`<button class="pri" data-a="grm" data-k="${g.Kind}" data-u="${opp.ID}">🔁 Play again</button>`}</div>`;
  const bx=document.getElementById('gbd');
  if(bx&&bx.dataset.g==g.ID)bx.outerHTML=html;else modal('<h3>'+E(GN[g.Kind][1])+'</h3>'+html)}
window.XGU=id=>{if(GID==id&&document.getElementById('gbd'))gview(id).catch(()=>{});else{toast('🎮 Your move in a game');if(tab=='games'&&GT!='solo'&&GT!='rank')gbody()}};
window.XGM=id=>{if($('.gq')){clearInterval(QT);gview(id).catch(()=>{})}};
setInterval(()=>{if(GID&&document.getElementById('gbd')&&!document.hidden)gview(GID).catch(()=>{})},5000);

/* challenge cards inside chats, bubble themes */
const L2=L;
L=async function(){await L2();decorate()};
function decorate(){
  const mineB=XC.Bub||'',theirB=(typeof peer!='undefined'&&peer&&peer.Bub)||'';
  document.querySelectorAll('#ms .m').forEach(el=>{
    const m=el.textContent.trim().match(/^🎮 (ttt|c4|rps|chk|bs|dab|tri) ([0-9a-f]{24})/);
    if(m){const me=el.classList.contains('me');el.removeAttribute('data-a');
      el.innerHTML=`<div class="gcard"><b>${GN[m[1]][0]} ${E(GN[m[1]][1])}</b><small>${me?'You sent a challenge':'You were challenged'}</small><button class="ed" data-a="gopen" data-i="${m[2]}">Open game</button></div>`}
    const c=el.classList.contains('me')?mineB:theirB;if(c)el.classList.add(c)})}
const ch=chat;
chat=async function(u){await ch(u);const bar=document.querySelector('.ch .bar');
  if(bar&&!$('#gmb')){const mic=$('#mic');(mic||bar.lastElementChild).insertAdjacentHTML('beforebegin','<button id="gmb" data-a="gch" aria-label="Play a game" style="font-size:20px">🎮</button>')}};

/* ================= DAILY WORD ================= */
async function wopen(){wdraw(await A('wget'))}
function wdraw(j){
  WJ=j;const rows=[];
  for(let r=0;r<6;r++){const g=j.G[r];rows.push('<div class="wr">'+[0,1,2,3,4].map(c=>g?`<div class="wc wc${g.F[c]}">${E(g.W[c])}</div>`:'<div class="wc"></div>').join('')+'</div>')}
  const body=`<div class="wg">${rows.join('')}</div>`+(j.Done?`<p class="gst">${j.Won?'Solved in '+j.G.length+'/6 🎉':'The word was '+E((j.Answer||'').toUpperCase())}</p><button class="pri" data-a="wsh">📤 Share result</button><button class="pri sec" data-a="wpost">📝 Post to my feed</button><small class="sub" style="text-align:center">A new word arrives every day at midnight UTC.</small>`:`<div class="bar" style="padding:0;border:0"><input id="wi" maxlength="5" placeholder="Type a 5-letter word" autocomplete="off" autocapitalize="none"><button data-a="wgo">Guess</button></div><p class="er" id="wer"></p>`);
  modal('<h3>Daily Word</h3><div id="wgd" style="display:grid;gap:14px">'+body+'</div>');
  const i=$('#wi');if(i){i.focus();i.onkeydown=e=>{if(e.key=='Enter')wgo()}}}
async function wgo(){const i=$('#wi');if(!i)return;try{wdraw(await A('wguess',{w:i.value.trim().toLowerCase()}))}catch(e){const r=$('#wer');if(r)r.textContent=e.message}}
function wtext(){const em=WJ.G.map(g=>[...g.F].map(c=>c=='2'?'🟩':c=='1'?'🟨':'⬛').join('')).join('\n');return`Amlink Word ${WJ.Day} ${WJ.Won?WJ.G.length:'X'}/6\n${em}\n#amlinkword`}

/* ================= SHOP, INVITES, INTERESTS ================= */
async function shop(){
  const j=await A('shop'),T={badge:'Profile badges',frame:'Avatar frames',name:'Name styles',bubble:'Chat bubbles',game:'3D game cosmetics'};
  const prev=it=>it.Type=='badge'?(window.bdg?bdg(it.ID):''):it.Type=='frame'?`<b class="av ${it.ID}">${E((ME.Username||'A')[0])}</b>`:it.Type=='name'?`<b class="${it.ID}">${E(ME.Username||'you')}</b>`:it.Type=='game'?`<div style="font-size:28px">${it.ID.startsWith('car')?'🏎️':it.ID.startsWith('parkour')?'✨':it.ID.startsWith('island')?'🏝️':'🌌'}</div>`:`<div class="m me ${it.ID}" style="max-width:none">Hello 👋</div>`;
  modal(`<h3>Shop</h3><div class="stg" style="padding:0"><div class="stc"><b>🪙 ${j.Inf?'∞':j.Coins}</b><small>Your Ran Coin</small></div><div class="stc"><b>Lv ${j.Level}</b><small>Your level</small></div></div><small class="sub">Earn Ran Coin from the daily reward, challenges, games and invites.</small>`+
    Object.keys(T).map(t=>`<p class="sg" style="padding:0">${T[t]}</p><div class="shg">`+j.Items.filter(i=>i.Type==t).map(it=>`<div class="shi">${prev(it)}<small>${E(it.Name)}</small>`+(it.Own?`<button class="ed" data-a="seq" data-i="${it.ID}" data-t="${it.Type}" data-e="${it.Eq?1:0}">${it.Eq?'Unequip':'Equip'}</button>`:`<button class="ed" data-a="sby" data-i="${it.ID}" ${j.Level<it.Lvl&&!j.Inf?'disabled':''}>${j.Level<it.Lvl&&!j.Inf?'Level '+it.Lvl:(j.Inf?'Free':'🪙 '+it.Price)}</button>`)+'</div>').join('')+'</div>').join(''))}

<!-- ===== Amlink Batch 3: reel video editor (trim, crop, filters, adjust, sound) ===== -->
<style>
#vedt{position:absolute;inset:0;z-index:48;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;animation:pgin .28s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#vedt .pgh{max-width:none}
.vcv{position:relative;display:grid;place-items:center;background:#000;min-height:34vh;touch-action:none;flex:none}
.vcv canvas{max-width:100%;max-height:44vh;touch-action:none;cursor:grab}
.vpp{position:absolute;left:12px;bottom:12px;width:44px;height:44px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:18px}
.vtm{position:absolute;right:12px;bottom:18px;color:#fff;font-size:12px;text-shadow:0 1px 3px #000}
.vpn{padding:8px 16px;display:grid;gap:12px;align-content:start}
.vexp{position:absolute;inset:0;z-index:5;background:#000e;color:#fff;display:grid;place-content:center;gap:14px;text-align:center;padding:24px}
.vexp .ed{background:#ffffff26;color:#fff;justify-self:center}
</style>
<script>
(()=>{
const FILT={'Original':'','Vivid':'saturate(1.4) contrast(1.1)','B&W':'grayscale(1)','Warm':'sepia(.35) saturate(1.2)','Cool':'hue-rotate(15deg) saturate(1.1) brightness(1.05)','Fade':'contrast(.85) brightness(1.1) saturate(.8)','Drama':'contrast(1.35) brightness(.9)','Vintage':'sepia(.5) contrast(.9) brightness(1.05) saturate(.9)','Glow':'brightness(1.12) saturate(1.3) contrast(.95)'};
const ASP=[[0,'Original'],[9/16,'9:16'],[1,'1:1'],[4/5,'4:5'],[16/9,'16:9']];
const F=()=>typeof CanvasRenderingContext2D!='undefined'&&'filter' in CanvasRenderingContext2D.prototype;
const REC=()=>!!(window.MediaRecorder&&HTMLCanvasElement.prototype.captureStream&&(window.AudioContext||window.webkitAudioContext));
const mm=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const MAXD=60;
let ES=null,V=null,raf=0,EXP=null;

/* recordings made in a browser have no length stored in them. This adds it, so the reel can be scrubbed everywhere. */
function fixWebm(buf,dur){
  const rdSize=p=>{const b=buf[p];if(b===undefined)return null;let l=1,m=0x80;while(l<=8&&!(b&m)){l++;m>>=1}if(l>8)return null;let v=b&(m-1),unk=v===m-1;for(let i=1;i<l;i++){const c=buf[p+i];if(c===undefined)return null;v=v*256+c;if(c!==255)unk=false}return{l,v,unk}};
  const rdId=p=>{const b=buf[p];if(b===undefined)return null;let l=1,m=0x80;while(l<=4&&!(b&m)){l++;m>>=1}if(l>4)return null;let v=0;for(let i=0;i<l;i++)v=v*256+buf[p+i];return{l,v}};
  const wrSize=(a,pos,l,v)=>{for(let i=l-1;i>=0;i--){a[pos+i]=v%256;v=Math.floor(v/256)}a[pos]|=(0x80>>(l-1))};
  let p=0;const h=rdId(p);if(!h||h.v!==0x1A45DFA3)return null;
  const hs=rdSize(p+h.l);if(!hs)return null;p+=h.l+hs.l+hs.v;
  const sg=rdId(p);if(!sg||sg.v!==0x18538067)return null;
  const ss=rdSize(p+sg.l);if(!ss)return null;
  const segSizePos=p+sg.l,segStart=p+sg.l+ss.l;let q=segStart;
  const end=ss.unk?buf.length:Math.min(buf.length,q+ss.v);
  let seek=null,prev=null;
  while(q<end){
    const id=rdId(q);if(!id)return null;const sz=rdSize(q+id.l);if(!sz||sz.unk)return null;
    const el={id:id.v,pos:q,il:id.l,sl:sz.l,size:sz.v};
    if(id.v===0x1F43B675)return null;                    // a cluster came before Info
    if(id.v===0x114D9B74)seek=el;
    if(id.v===0x1549A966){
      const cs=q+id.l+sz.l,ce=cs+sz.v;let scale=1000000,o=cs;
      while(o<ce){const cid=rdId(o);if(!cid)return null;const csz=rdSize(o+cid.l);if(!csz)return null;
        if(cid.v===0x4489)return null;                   // already has a duration
        if(cid.v===0x2AD7B1){let v=0;for(let i=0;i<csz.v;i++)v=v*256+buf[o+cid.l+csz.l+i];scale=v}
        o+=cid.l+csz.l+csz.v}
      const add=new Uint8Array(11);add[0]=0x44;add[1]=0x89;add[2]=0x88;new DataView(add.buffer).setFloat64(3,dur*1e9/scale);
      const newLen=sz.v+11,hdr=new Uint8Array(12);hdr.set([0x15,0x49,0xA9,0x66]);hdr[4]=0x01;let n=newLen;for(let i=11;i>=5;i--){hdr[i]=n%256;n=Math.floor(n/256)}
      const delta=hdr.length+newLen-(id.l+sz.l+sz.v);
      if(!seek){                                          // no index: the file can simply grow
        const out=new Uint8Array(buf.length+delta);
        out.set(buf.subarray(0,q),0);out.set(hdr,q);out.set(buf.subarray(cs,ce),q+hdr.length);out.set(add,q+hdr.length+sz.v);out.set(buf.subarray(ce),q+hdr.length+newLen);
        if(!ss.unk){let v=ss.v+delta;if(v>Math.pow(2,7*ss.l)-2)return null;wrSize(out,segSizePos,ss.l,v)}
        return out}
      // an index exists: take the room from the padding (Void) right before Info so nothing after it moves
      if(!prev||prev.id!==0xEC||prev.pos+prev.il+prev.sl+prev.size!==q||prev.size<delta)return null;
      const out=new Uint8Array(buf),ns=q-delta;
      wrSize(out,prev.pos+prev.il,prev.sl,prev.size-delta);
      out.fill(0,prev.pos+prev.il+prev.sl,ns);
      out.set(hdr,ns);out.set(buf.subarray(cs,ce),ns+hdr.length);out.set(add,ns+hdr.length+sz.v);
      let o2=seek.pos+seek.il+seek.sl,fixed=false;const e2=o2+seek.size;
      while(o2<e2){const a=rdId(o2),as=rdSize(o2+a.l);
        if(a.v===0x4DBB){let k=o2+a.l+as.l;const ke=k+as.v;let isInfo=false,pp=-1;
          while(k<ke){const b=rdId(k),bs=rdSize(k+b.l),vs=k+b.l+bs.l;
            if(b.v===0x53AB&&bs.v===4&&buf[vs]===0x15&&buf[vs+1]===0x49&&buf[vs+2]===0xA9&&buf[vs+3]===0x66)isInfo=true;
            if(b.v===0x53AC)pp=k;
            k+=b.l+bs.l+bs.v}
          if(isInfo&&pp>=0){const b=rdId(pp),bs=rdSize(pp+b.l),vs=pp+b.l+bs.l;let v=ns-segStart;
            if(v>=Math.pow(256,bs.v))return null;for(let i=bs.v-1;i>=0;i--){out[vs+i]=v%256;v=Math.floor(v/256)}fixed=true}}
        o2+=a.l+as.l+as.v}
      return fixed?out:null}
    prev=el;q+=id.l+sz.l+sz.v}
  return null}

/* how long a reel is, even when the file itself does not say */
window.rdur=v=>isFinite(v.duration)&&v.duration>0?v.duration:(+v.dataset.dur||0);

const pickMime=()=>{for(const m of ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4;codecs=avc1,mp4a.40.2','video/mp4']){try{if(MediaRecorder.isTypeSupported(m))return m}catch(e){}}return ''};
const once=(el,ev)=>new Promise(r=>{const t=setTimeout(r,5000);el.addEventListener(ev,()=>{clearTimeout(t);r()},{once:true})});
const fstr=()=>((FILT[ES.flt]||'')+` brightness(${ES.br}%) contrast(${ES.ct}%) saturate(${ES.sa}%)`).trim();
const adjusted=()=>ES.flt!='Original'||ES.br!=100||ES.ct!=100||ES.sa!=100;

/* what part of the video is shown, and how big the result is */
function geom(vw,vh){
  const ar=ES.asp||vw/vh;let cw,ch;
  if(vw/vh>ar){ch=vh;cw=vh*ar}else{cw=vw;ch=vw/ar}
  cw/=ES.zoom;ch/=ES.zoom;
  const L=Math.max(160,Math.min(960,Math.round(Math.max(cw,ch)))),ow=ar>=1?L:Math.round(L*ar),oh=ar>=1?Math.round(L/ar):L;
  return{ar,cw,ch,sx:(vw-cw)*ES.px,sy:(vh-ch)*ES.py,ow:ow&~1,oh:oh&~1}}
function drawItems(x,w,h){
  for(const it of ES.items){
    x.font='800 '+Math.round(it.s*h)+'px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';
    if(it.k=='t'){x.lineWidth=Math.max(2,it.s*h*.12);x.strokeStyle='#000';x.lineJoin='round';x.strokeText(it.t,it.x*w,it.y*h)}
    x.fillStyle=it.c||'#fff';x.fillText(it.t,it.x*w,it.y*h)}}
function draw(cv,v){
  const g=geom(v.videoWidth,v.videoHeight);
  if(cv.width!=g.ow||cv.height!=g.oh){cv.width=g.ow;cv.height=g.oh}
  const x=cv.getContext('2d');x.filter=F()?fstr():'none';
  x.drawImage(v,g.sx,g.sy,g.cw,g.ch,0,0,cv.width,cv.height);x.filter='none';drawItems(x,cv.width,cv.height)}

/* ---------- the editor screen ---------- */
async function open(file){
  close();
  const v=document.createElement('video');v.playsInline=true;v.preload='auto';v.muted=true;v.src=URL.createObjectURL(file);
  try{await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(new Error('x'));setTimeout(()=>rej(new Error('t')),15000)})}
  catch(e){URL.revokeObjectURL(v.src);toast('This video cannot be edited here. You can still post it as it is.');return}
  let d=v.duration;if(!isFinite(d)||!d)d=file.xdur||0;
  if(!d){URL.revokeObjectURL(v.src);toast('Could not read the length of this video');return}
  V=v;ES={file,dur:d,start:0,end:Math.min(d,MAXD),asp:0,zoom:1,px:.5,py:.5,flt:'Original',br:100,ct:100,sa:100,mute:false,tab:'trim',busy:false,items:[],col:'#ffffff',speed:1,vol:100,vo:null,rec:null};
  const o=document.createElement('div');o.id='vedt';
  o.innerHTML=`<div class="pgh"><button data-v="x" aria-label="Cancel">←</button><b>Edit video</b><button class="ed" data-v="ok" style="margin-left:auto;padding:6px 16px">Done</button></div><div class="vcv"><canvas id="vcv"></canvas><button class="vpp" data-v="pp" aria-label="Play or pause">⏸</button><span class="vtm" id="vtm"></span></div><div class="atb" id="vtb">${[['trim','✂️ Trim'],['crop','⬛ Crop'],['flt','✨ Filters'],['adj','🎚 Adjust'],['txt','🔤 Text'],['spd','⏩ Speed'],['snd','🔊 Sound']].map(([k,l])=>`<button data-v="tab" data-k="${k}">${l}</button>`).join('')}</div><div class="vpn" id="vpn"></div>`;
  $('#app').appendChild(o);
  o.onclick=click;o.oninput=input;
  const cv=$('#vcv');let drag=null;
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect(),pu=(e.clientX-r.left)/r.width,pw=(e.clientY-r.top)/r.height;let hit=-1;ES.items.forEach((it,i)=>{if(Math.hypot(pu-it.x,(pw-it.y)*r.height/r.width)<Math.max(.09,it.s*r.height/r.width*1.2))hit=i});drag=hit>=0?[e.clientX,e.clientY,hit]:[e.clientX,e.clientY]};
  cv.onpointermove=e=>{if(!drag||!V)return;
    if(drag.length==3){const r=cv.getBoundingClientRect(),it=ES.items[drag[2]];if(it){it.x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));it.y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))}return}
    const g=geom(V.videoWidth,V.videoHeight),k=cv.width/cv.clientWidth,dx=(e.clientX-drag[0])*k,dy=(e.clientY-drag[1])*k;drag=[e.clientX,e.clientY];
    const sw=V.videoWidth-g.cw,sh=V.videoHeight-g.ch;
    if(sw>1)ES.px=Math.min(1,Math.max(0,(g.sx-dx*g.cw/cv.width)/sw));
    if(sh>1)ES.py=Math.min(1,Math.max(0,(g.sy-dy*g.ch/cv.height)/sh))};
  cv.onpointerup=cv.onpointercancel=()=>{drag=null};
  panel();V.currentTime=0;V.play().catch(()=>{});loop()}
function close(){
  cancelAnimationFrame(raf);const o=$('#vedt');if(o)o.remove();
  if(V){try{V.pause()}catch(e){}try{URL.revokeObjectURL(V.src)}catch(e){}}
  V=null;ES=null}
function loop(){
  cancelAnimationFrame(raf);
  const step=()=>{if(!V||!ES||!$('#vedt'))return;
    if(!ES.busy){
      if(ES.rec&&V.currentTime>=ES.end-.05){voStop();V.pause()}
      else if(!V.paused&&V.currentTime>=ES.end)V.currentTime=ES.start;
      if(V.readyState>=2)draw($('#vcv'),V);
      const t=$('#vtm');if(t)t.textContent=mm(Math.max(0,V.currentTime-ES.start))+' / '+mm(ES.end-ES.start)}
    raf=requestAnimationFrame(step)};
  step()}

function panel(){
  document.querySelectorAll('#vtb button').forEach(b=>b.classList.toggle('on2',b.dataset.k==ES.tab));
  const p=$('#vpn');let h='';
  if(ES.tab=='trim')h=`<label class="fl2">Start <small id="vts">${mm(ES.start)}</small><input type="range" id="vs" min="0" max="${ES.dur}" step="0.1" value="${ES.start}"></label><label class="fl2">End <small id="vte">${mm(ES.end)}</small><input type="range" id="ve" min="0" max="${ES.dur}" step="0.1" value="${ES.end}"></label><p class="sub" id="vtl">Length ${mm(ES.end-ES.start)}. Reels can be up to 1:00.</p>`;
  else if(ES.tab=='crop')h=`<div class="atb" style="padding:0">${ASP.map(([a,l])=>`<button data-v="asp" data-a="${a}" class="${ES.asp==a?'on2':''}">${l}</button>`).join('')}</div><label class="fl2">Zoom<input type="range" id="vz" min="1" max="3" step="0.01" value="${ES.zoom}"></label><small class="sub">Drag the video to move it inside the frame.</small>`;
  else if(ES.tab=='flt')h=F()?`<div class="atb" style="padding:0">${Object.keys(FILT).map(k=>`<button data-v="flt" data-f="${E(k)}" class="${ES.flt==k?'on2':''}">${E(k)}</button>`).join('')}</div>`:'<p class="sub">Filters need Chrome, Edge or Firefox on a computer or Android phone.</p>';
  else if(ES.tab=='adj')h=F()?`<label class="fl2">Brightness<input type="range" id="vbr" min="50" max="150" value="${ES.br}"></label><label class="fl2">Contrast<input type="range" id="vct" min="50" max="150" value="${ES.ct}"></label><label class="fl2">Color<input type="range" id="vsa" min="0" max="200" value="${ES.sa}"></label>`:'<p class="sub">Adjustments need Chrome, Edge or Firefox.</p>';
  else if(ES.tab=='txt')h=`<div class="bar" style="padding:0;border:0"><input id="vti" maxlength="30" placeholder="Type your text" autocomplete="off"><button data-v="addt">Add</button></div><div class="atb" style="padding:0">${['#ffffff','#ffd978','#ff5c8a','#77ccff','#99ff66'].map(c=>`<button data-v="tcol" data-c="${c}" aria-label="Text color" style="background:${c};width:34px;height:34px;padding:0;border-radius:50%;border:3px solid ${ES.col==c?'var(--fg)':'transparent'}"></button>`).join('')}</div><div class="atb" style="padding:0">${['😀','😂','😍','🔥','👏','💯','❤️','😎','🎉','✨','👀','🙏'].map(e=>`<button data-v="adde" data-e="${e}" style="font-size:22px">${e}</button>`).join('')}</div><small class="sub">Drag text and stickers on the video to move them.</small>${ES.items.map((it,i)=>`<div class="row"><span>${E(it.t)}</span><span><button class="ed" data-v="isz" data-i="${i}" data-d="-1" aria-label="Smaller">➖</button> <button class="ed" data-v="isz" data-i="${i}" data-d="1" aria-label="Bigger">➕</button> <button class="ed" data-v="idel" data-i="${i}" aria-label="Remove">✕</button></span></div>`).join('')}`;
  else if(ES.tab=='spd')h=`<div class="atb" style="padding:0">${[.5,.75,1,1.5,2].map(s=>`<button data-v="spd" data-s="${s}" class="${ES.speed==s?'on2':''}">${s}x</button>`).join('')}</div><p class="sub">The finished video will be ${mm((ES.end-ES.start)/ES.speed)} long. Changing the speed removes a recorded voiceover.</p>`;

function input(e){
