<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amlink</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4FB;--card:#fff;--ink:#1B1740;--mute:#6C6A8A;--line:#E2E3F1;--brand:#5B3DF5;--hot:#FF5A6E;--r:18px}
@media(prefers-color-scheme:dark){:root{--bg:#120F2B;--card:#1C1840;--ink:#F1F0FF;--mute:#A09DC9;--line:#2D2960}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hide{display:none!important}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--brand),var(--hot));display:grid;place-items:center;color:#fff;font-weight:800;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.btn{background:var(--brand);color:#fff;padding:12px 20px;border-radius:99px;font-weight:600}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
a{color:var(--brand);cursor:pointer;font-weight:600}
/* auth */
#auth{min-height:100%;display:grid;grid-template-columns:1fr 1fr}
.hero{background:linear-gradient(160deg,var(--brand),#2A1A9E 60%,var(--hot));color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:flex-end}
.hero h1{font-size:clamp(56px,9vw,120px);line-height:.9;font-weight:800;letter-spacing:-.04em}
.hero p{margin-top:16px;max-width:320px;opacity:.9;font-size:18px}
.form{padding:48px;display:flex;flex-direction:column;justify-content:center;gap:12px;max-width:460px;margin:auto;width:100%}
.form h2{font-size:28px}
.form input[type=text],.form input[type=password],.form input[type=email]{padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);width:100%}
.pick{display:flex;align-items:center;gap:14px}
.chk{display:flex;gap:10px;font-size:14px;color:var(--mute);align-items:flex-start}
.err{color:var(--hot);font-size:14px;min-height:18px}
/* app */
#app{height:100%;display:grid;grid-template-columns:230px 1fr;max-width:1100px;margin:auto}
nav{padding:20px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
nav .logo{font-size:30px;font-weight:800;letter-spacing:-.04em;padding:6px 14px 18px;color:var(--brand)}
nav button{text-align:left;padding:12px 14px;border-radius:14px;font-weight:600;font-size:17px;display:flex;gap:12px;align-items:center}
nav button.on{background:var(--card);box-shadow:inset 3px 0 0 var(--brand)}
nav .spacer{flex:1}
nav small{padding:8px 14px;color:var(--mute);font-size:12px;line-height:1.6}
main{overflow-y:auto;height:100%;padding-bottom:90px}
.pane{padding:20px;max-width:620px;margin:auto}
.compose{background:var(--card);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.compose textarea{border:0;background:none;resize:none;min-height:60px;outline:0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.post{background:var(--card);border-radius:var(--r);margin-top:18px;border:1px solid var(--line);overflow:hidden}
.post header{display:flex;gap:12px;align-items:center;padding:12px 14px}
.post header b{display:block}.post header small{color:var(--mute)}
.post p{padding:0 14px 12px}
.post img.m,.post video.m{width:100%;max-height:560px;object-fit:cover;display:block;background:#000}
.acts{display:flex;gap:18px;padding:12px 14px}
.acts button{font-weight:600;color:var(--mute)}
.acts .liked{color:var(--hot)}
.cm{padding:0 14px 12px;font-size:14px}
.cm input{width:100%;margin-top:8px;padding:10px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg)}
/* reels */
#reels{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000;padding-bottom:0}
.reel{height:100%;scroll-snap-align:start;position:relative;display:grid;place-items:center;color:#fff}
.reel video{width:100%;height:100%;object-fit:contain}
.reel .info{position:absolute;left:18px;bottom:96px;right:90px;text-shadow:0 1px 6px #000}
.reel .side{position:absolute;right:14px;bottom:110px;display:flex;flex-direction:column;gap:18px;align-items:center}
.reel .side button{color:#fff;font-size:26px}
.reel .side span{font-size:12px;display:block}
.empty{padding:60px 20px;text-align:center;color:var(--mute)}
/* chat */
.chat{display:grid;grid-template-columns:260px 1fr;height:100%;max-width:none}
.list{border-right:1px solid var(--line);overflow:auto}
.list button{display:flex;gap:12px;align-items:center;width:100%;padding:14px;text-align:left;border-bottom:1px solid var(--line)}
.list button.on{background:var(--card)}
.conv{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:8px}
.b{max-width:75%;padding:10px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);align-self:flex-start}
.b.me{align-self:flex-end;background:var(--brand);color:#fff;border-color:var(--brand)}
.send{display:flex;gap:8px;padding:12px 14px 100px}
.send input{flex:1;padding:12px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
/* profile */
.ph{display:flex;gap:20px;align-items:center;margin-bottom:20px}
.ph .av{width:92px;height:92px;font-size:34px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:18px}
.grid .t{aspect-ratio:1;background:var(--line);overflow:hidden}
.grid img,.grid video{width:100%;height:100%;object-fit:cover}
.legal{display:flex;flex-direction:column;gap:8px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
/* modal */
dialog{border:0;border-radius:var(--r);max-width:560px;width:92%;padding:24px;background:var(--card);color:var(--ink);max-height:80vh;overflow:auto}
dialog::backdrop{background:#0008}
dialog h3{margin-bottom:10px}dialog p,dialog li{margin:8px 0;line-height:1.5;font-size:15px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:9}
@media(max-width:760px){
#auth{grid-template-columns:1fr}.hero{padding:32px 24px;min-height:34vh}.form{padding:28px 24px}
#app{grid-template-columns:1fr}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;flex-direction:row;background:var(--card);border-top:1px solid var(--line);border-right:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
nav .logo,nav .spacer,nav small{display:none}
nav button{flex-direction:column;gap:2px;font-size:12px;padding:8px 12px;text-align:center}
nav button.on{box-shadow:none;color:var(--brand)}
.chat{grid-template-columns:1fr}.list{max-height:150px;border-right:0;border-bottom:1px solid var(--line)}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<section id="auth">
  <div class="hero"><h1>Am<br>link</h1><p>Post it. Watch it. Talk about it. One place for your people.</p></div>
  <div class="form">
    <h2 id="authTitle">Create your account</h2>
    <div class="pick" id="picRow">
      <div class="av" id="signPic">+</div>
      <label class="btn ghost">Add profile photo<input type="file" id="signFile" accept="image/*" hidden></label>
    </div>
    <input type="text" id="fUser" placeholder="Username" autocomplete="username">
    <input type="email" id="fMail" placeholder="Email">
    <input type="password" id="fPass" placeholder="Password" autocomplete="current-password">
    <label class="chk" id="termsRow"><input type="checkbox" id="fTerms"><span>I am 13 or older and agree to the <a data-doc="terms">Terms and Conditions</a> and <a data-doc="privacy">Privacy Policy</a>.</span></label>
    <div class="err" id="err"></div>
    <button class="btn" id="go">Create account</button>
    <button id="swap" style="color:var(--mute)">Already on Amlink? <a>Log in</a></button>
  </div>
</section>

<div id="app" class="hide">
  <nav id="nav">
    <div class="logo">Amlink</div>
    <button data-t="feed" class="on">🏠 Home</button>
    <button data-t="reels">🎬 Reels</button>
    <button data-t="chat">💬 Chat</button>
    <button data-t="me">👤 Profile</button>
    <div class="spacer"></div>
    <small><a data-doc="terms">Terms</a> · <a data-doc="privacy">Privacy</a> · <a data-doc="rules">Guidelines</a></small>
  </nav>
  <main id="main"></main>
</div>

<dialog id="dlg"><div id="dlgBody"></div><button class="btn" style="margin-top:14px" onclick="dlg.close()">Close</button></dialog>
<div id="toast" class="hide"></div>

<script>
const $=s=>document.querySelector(s);
const store={
  get(k,d){try{const v=localStorage.getItem('amlink:'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('amlink:'+k,JSON.stringify(v));return true}catch(e){toast('Storage is full. Remove some posts.');return false}}
};
let users=store.get('users',{}),me=store.get('me',null),posts=store.get('posts',[]),tab='feed',signPic='',mode='signup',openChat=0;
const bots=[{n:'Ama'},{n:'Kofi'},{n:'Zara'}];
let chats=store.get('chats',{});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const avatar=(u,sz)=>{const p=(users[u]||{}).pic;return `<div class="av" ${sz?`style="width:${sz}px;height:${sz}px"`:''}>${p?`<img src="${p}" alt="">`:esc((u||'?')[0].toUpperCase())}</div>`};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),2400)}
function readFile(f,max){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}
function shrink(url,w){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,w/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};i.src=url})}

/* legal */
const docs={
terms:`<h3>Terms and Conditions</h3><p>By using Amlink you agree to these terms.</p><ul><li>You must be at least 13 years old.</li><li>You own what you post and give Amlink permission to display it to other users.</li><li>You are responsible for your account and password.</li><li>Do not post illegal, hateful, violent, sexual or misleading content, and do not harass others.</li><li>We may remove content or suspend accounts that break these terms or the Community Guidelines.</li><li>Amlink is provided as is. We may update these terms and will tell you when we do.</li></ul><p><i>Starter text. Have a lawyer review it before you launch publicly.</i></p>`,
privacy:`<h3>Privacy Policy</h3><ul><li>We collect your username, email, profile photo, posts, comments and messages.</li><li>We use this to run your account, show your content and keep Amlink safe.</li><li>We do not sell your personal data.</li><li>You can edit or delete your account and content at any time from Profile.</li><li>Contact us at support@amlink.app for any privacy request.</li></ul><p><i>Starter text. Update it to match how your server stores data.</i></p>`,
rules:`<h3>Community Guidelines</h3><ul><li>Be kind. No bullying, threats or hate.</li><li>Only post content you have the right to share.</li><li>No nudity, graphic violence or spam.</li><li>Respect privacy. Do not share other people's personal details.</li><li>Report anything that breaks these rules using the Report button on a post.</li></ul>`
};
document.addEventListener('click',e=>{const d=e.target.closest('[data-doc]');if(d){e.preventDefault();$('#dlgBody').innerHTML=docs[d.dataset.doc];dlg.showModal()}});

/* auth */
$('#signFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;signPic=await shrink(await readFile(f),300);$('#signPic').innerHTML=`<img src="${signPic}" alt="Your profile photo">`};
$('#swap').onclick=()=>{mode=mode==='signup'?'login':'signup';const s=mode==='signup';$('#authTitle').textContent=s?'Create your account':'Welcome back';$('#go').textContent=s?'Create account':'Log in';['picRow','termsRow'].forEach(i=>$('#'+i).classList.toggle('hide',!s));$('#fMail').classList.toggle('hide',!s);$('#swap').innerHTML=s?'Already on Amlink? <a>Log in</a>':'New here? <a>Create account</a>';$('#err').textContent=''};
$('#go').onclick=()=>{
  const u=$('#fUser').value.trim().toLowerCase(),p=$('#fPass').value,m=$('#fMail').value.trim(),er=t=>$('#err').textContent=t;
  if(!/^[a-z0-9_.]{3,20}$/.test(u))return er('Username: 3 to 20 letters, numbers, dots or underscores.');
  if(p.length<6)return er('Password needs at least 6 characters.');
  if(mode==='signup'){
    if(!m.includes('@'))return er('Enter a valid email.');
    if(!$('#fTerms').checked)return er('Accept the Terms and Privacy Policy to continue.');
    if(users[u])return er('That username is taken.');
    users[u]={pass:btoa(p),mail:m,pic:signPic,bio:''};store.set('users',users);
  }else if(!users[u]||users[u].pass!==btoa(p))return er('Wrong username or password.');
  me=u;store.set('me',me);start();
};
function start(){$('#auth').classList.add('hide');$('#app').classList.remove('hide');render()}
function logout(){me=null;store.set('me',null);location.reload()}

/* nav */
$('#nav').onclick=e=>{const b=e.target.closest('button[data-t]');if(!b)return;tab=b.dataset.t;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));render()};
function render(){const m=$('#main');m.id='main';m.className=tab==='reels'?'':'';m.innerHTML=({feed,reels,chat,me:profile})[tab]()}
</script>
<script>
let draft=null;
function postHTML(p,i){
  const media=p.type==='video'?`<video class="m" src="${p.src}" controls playsinline></video>`:p.src?`<img class="m" src="${p.src}" alt="Post by ${esc(p.user)}">`:'';
  return `<article class="post"><header>${avatar(p.user)}<div><b>${esc(p.user)}</b><small>${new Date(p.t).toLocaleString()}</small></div></header>${p.text?`<p>${esc(p.text)}</p>`:''}${media}
  <div class="acts"><button class="${p.likes.includes(me)?'liked':''}" onclick="like(${i})">${p.likes.includes(me)?'♥':'♡'} ${p.likes.length}</button><span style="color:var(--mute);font-weight:600">💬 ${p.comments.length}</span><button onclick="toast('Report sent. Thank you.')">Report</button>${p.user===me?`<button onclick="del(${i})">Delete</button>`:''}</div>
  <div class="cm">${p.comments.map(c=>`<div><b>${esc(c.u)}</b> ${esc(c.t)}</div>`).join('')}<input placeholder="Add a comment" onkeydown="if(event.key==='Enter')comment(${i},this)"></div></article>`}
function feed(){
  return `<div class="pane"><div class="compose"><textarea id="pt" placeholder="What's happening, ${esc(me)}?"></textarea><div id="prev"></div>
  <div class="row"><label class="btn ghost">📷 Photo or video<input type="file" id="pf" accept="image/*,video/*" hidden onchange="pick(this)"></label><button class="btn" onclick="publish()">Post</button></div></div>
  ${posts.length?posts.map(postHTML).join(''):'<div class="empty">No posts yet. Share the first one.</div>'}</div>`}
async function pick(inp){const f=inp.files[0];if(!f)return;
  if(f.type.startsWith('video')){if(f.size>3e6)toast('Video is over 3 MB, so it will not be saved after you close the tab.');draft={type:'video',src:URL.createObjectURL(f),keep:f.size<=3e6,file:f};
    if(draft.keep)draft.src=await readFile(f);$('#prev').innerHTML=`<video class="m" src="${draft.src}" controls style="width:100%;border-radius:12px"></video>`}
  else{draft={type:'image',src:await shrink(await readFile(f),900),keep:true};$('#prev').innerHTML=`<img src="${draft.src}" style="width:100%;border-radius:12px" alt="Preview">`}}
function publish(){const t=$('#pt').value.trim();if(!t&&!draft)return toast('Write something or add a photo.');
  const p={user:me,text:t,type:draft?draft.type:'text',src:draft?draft.src:'',t:Date.now(),likes:[],comments:[]};
  posts.unshift(p);draft=null;
  if(!store.set('posts',posts.map(x=>x.src.startsWith('blob:')?{...x,src:'',type:'text',text:x.text+' (video not saved)'}:x)))posts.shift();
  render();toast('Posted')}
function like(i){const l=posts[i].likes,k=l.indexOf(me);k<0?l.push(me):l.splice(k,1);store.set('posts',posts);render()}
function comment(i,el){const t=el.value.trim();if(!t)return;posts[i].comments.push({u:me,t});store.set('posts',posts);render()}
function del(i){if(confirm('Delete this post?')){posts.splice(i,1);store.set('posts',posts);render()}}
function reels(){const v=posts.map((p,i)=>[p,i]).filter(([p])=>p.type==='video');
  return `<div id="reels" style="height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000;margin-bottom:-90px">${v.length?v.map(([p,i])=>`<div class="reel"><video src="${p.src}" loop playsinline controls onclick="this.paused?this.play():this.pause()"></video><div class="info"><b>@${esc(p.user)}</b><div>${esc(p.text)}</div></div><div class="side"><button onclick="like(${i})">${p.likes.includes(me)?'♥':'♡'}<span>${p.likes.length}</span></button><button onclick="tab='feed';render()">💬<span>${p.comments.length}</span></button></div></div>`).join(''):'<div class="reel"><div class="empty" style="color:#bbb">No reels yet.<br>Post a video from Home and it shows up here.</div></div>'}</div>`}
function chat(){
  const c=bots[openChat],h=chats[c.n]||[];
  return `<div class="chat"><div class="list">${bots.map((b,i)=>`<button class="${i===openChat?'on':''}" onclick="openChat=${i};render()"><div class="av">${b.n[0]}</div><div><b>${b.n}</b><br><small style="color:var(--mute)">${(chats[b.n]||[]).slice(-1)[0]?.t||'Say hi'}</small></div></button>`).join('')}</div>
  <div class="conv"><div class="msgs" id="msgs">${h.map(m=>`<div class="b ${m.me?'me':''}">${esc(m.t)}</div>`).join('')||'<div class="empty">Start the conversation.</div>'}</div>
  <div class="send"><input id="ci" placeholder="Message ${c.n}" onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn" onclick="sendMsg()">Send</button></div></div></div>`}
function sendMsg(){const i=$('#ci'),t=i.value.trim();if(!t)return;const n=bots[openChat].n;(chats[n]=chats[n]||[]).push({me:1,t});store.set('chats',chats);render();
  setTimeout(()=>{chats[n].push({t:['Haha, true.','Tell me more.','Send a pic!','On my way.'][Math.random()*4|0]});store.set('chats',chats);if(tab==='chat')render()},900);
  const m=$('#msgs');m&&(m.scrollTop=m.scrollHeight)}
function profile(){const u=users[me],mine=posts.filter(p=>p.user===me);
  return `<div class="pane"><div class="ph">${avatar(me,92)}<div style="flex:1"><h2>@${esc(me)}</h2><p style="color:var(--mute)">${esc(u.bio)||'No bio yet'}</p><small>${mine.length} posts</small></div></div>
  <div class="row" style="justify-content:flex-start;flex-wrap:wrap"><label class="btn ghost">Change photo<input type="file" accept="image/*" hidden onchange="newPic(this)"></label><button class="btn ghost" onclick="editBio()">Edit bio</button><button class="btn ghost" onclick="logout()">Log out</button></div>
  <div class="grid">${mine.map(p=>`<div class="t">${p.type==='image'?`<img src="${p.src}" alt="">`:p.type==='video'?`<video src="${p.src}"></video>`:`<div style="padding:8px;font-size:13px">${esc(p.text)}</div>`}</div>`).join('')}</div>
  <div class="legal"><a data-doc="terms">Terms and Conditions</a><a data-doc="privacy">Privacy Policy</a><a data-doc="rules">Community Guidelines</a><a onclick="delAcc()" style="color:var(--hot)">Delete my account</a></div></div>`}
async function newPic(i){const f=i.files[0];if(!f)return;users[me].pic=await shrink(await readFile(f),300);store.set('users',users);render()}
function editBio(){const b=prompt('Your bio',users[me].bio);if(b!==null){users[me].bio=b.slice(0,150);store.set('users',users);render()}}
function delAcc(){if(confirm('Delete your account and posts? This cannot be undone.')){delete users[me];posts=posts.filter(p=>p.user!==me);store.set('users',users);store.set('posts',posts);logout()}}
</script>
<script>
/* ---- server-backed layer: replaces the localStorage demo logic ---- */
me=null;users={};posts=[];let contacts=[],thread=[],pendingFile=null;
async function api(p,o){const r=await fetch(p,{credentials:'same-origin',...o});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong.');return j}
const jpost=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
async function load(){try{users=await api('/api/users');posts=await api('/api/posts');contacts=Object.keys(users).filter(u=>u!==me);render()}catch(e){toast(e.message)}}
async function enter(u){me=u.name;start();await load();setInterval(poll,3000)}
async function poll(){try{users=await api('/api/users');contacts=Object.keys(users).filter(u=>u!==me);if(tab==='chat')loadThread()}catch(e){}}
$('#go').onclick=async()=>{
  const u=$('#fUser').value.trim().toLowerCase(),p=$('#fPass').value,er=t=>$('#err').textContent=t;
  try{
    if(mode==='signup'){
      const f=new FormData();f.append('username',u);f.append('password',p);f.append('email',$('#fMail').value.trim());f.append('terms',$('#fTerms').checked?'1':'0');
      if(signPic)f.append('pic',await (await fetch(signPic)).blob(),'pic.jpg');
      enter(await api('/api/signup',{method:'POST',body:f}));
    }else enter(await jpost('/api/login',{username:u,password:p}));
  }catch(e){er(e.message)}
};
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
async function delAcc(){if(confirm('Delete your account and posts? This cannot be undone.')){await api('/api/me',{method:'DELETE'});location.reload()}}
async function newPic(i){const f=i.files[0];if(!f)return;const fd=new FormData();fd.append('pic',await (await fetch(await shrink(await readFile(f),300))).blob(),'pic.jpg');await api('/api/me',{method:'POST',body:fd});load()}
async function editBio(){const b=prompt('Your bio',users[me].bio||'');if(b===null)return;const fd=new FormData();fd.append('bio',b);await api('/api/me',{method:'POST',body:fd});load()}
async function pick(inp){const f=inp.files[0];if(!f)return;pendingFile=f;const u=URL.createObjectURL(f);
  $('#prev').innerHTML=f.type.startsWith('video')?`<video src="${u}" controls style="width:100%;border-radius:12px"></video>`:`<img src="${u}" style="width:100%;border-radius:12px" alt="Preview">`}
async function publish(){const t=$('#pt').value.trim();if(!t&&!pendingFile)return toast('Write something or add a photo.');
  const fd=new FormData();fd.append('text',t);if(pendingFile)fd.append('media',pendingFile);
  try{await api('/api/posts',{method:'POST',body:fd});pendingFile=null;await load();toast('Posted')}catch(e){toast(e.message)}}
async function like(i){try{await api(`/api/posts/${posts[i].id}/like`,{method:'POST'});load()}catch(e){toast(e.message)}}
async function comment(i,el){const t=el.value.trim();if(!t)return;try{await jpost(`/api/posts/${posts[i].id}/comment`,{text:t});load()}catch(e){toast(e.message)}}
async function del(i){if(confirm('Delete this post?')){await api('/api/posts/'+posts[i].id,{method:'DELETE'});load()}}
function chat(){
  if(!contacts.length)return '<div class="empty">No one else has joined yet.<br>Invite a friend to sign up and start chatting.</div>';
  return `<div class="chat"><div class="list">${contacts.map((n,i)=>`<button class="${i===openChat?'on':''}" onclick="pickChat(${i})">${avatar(n)}<b>${esc(n)}</b></button>`).join('')}</div>
  <div class="conv"><div class="msgs" id="msgs">${thread.map(m=>`<div class="b ${m.from===me?'me':''}">${esc(m.t)}</div>`).join('')||'<div class="empty">Say hi.</div>'}</div>
  <div class="send"><input id="ci" placeholder="Message ${esc(contacts[openChat]||'')}" onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn" onclick="sendMsg()">Send</button></div></div></div>`}
function pickChat(i){openChat=i;thread=[];render();loadThread()}
async function loadThread(){const n=contacts[openChat];if(!n)return;try{const t=await api('/api/messages?with='+n);
  if(JSON.stringify(t)!==JSON.stringify(thread)){thread=t;const v=$('#ci')?.value;render();const c=$('#ci');if(c){c.value=v||'';c.focus()}const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}}catch(e){}}
async function sendMsg(){const i=$('#ci'),t=i.value.trim();if(!t)return;i.value='';try{await jpost('/api/messages',{to:contacts[openChat],text:t});loadThread()}catch(e){toast(e.message)}}
$('#nav').addEventListener('click',e=>{if(e.target.closest('button[data-t]')){load();if(tab==='chat')loadThread()}});
api('/api/me').then(enter).catch(()=>{});
</script>
</body>
</html>
